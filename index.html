müssen Sie Ihre offenen Ansprüche aus dem Arbeitsverhältnis beim Arbeitgeber/der Arbeitgeberin geltend machen?","antwort":"Innerhalb von 3 Monaten nach Fälligkeit – eingeschrieben (schriftlich), sonst verfallen sie","richtig":"Innerhalb von 3 Monaten eingeschrieben","falsch":["Innerhalb von 3 Jahren mündlich","Innerhalb von 14 Tagen per SMS","Jederzeit, Ansprüche verfallen nie"],"quelle":"KV Taxi 2026, XII"},{"nr":"36","frage":"Als Arbeitnehmer:in haften Sie für Schäden, die Sie verursachen und verschulden. Welches Gesetz regelt diese Haftung?","antwort":"Das Dienstnehmerhaftpflichtgesetz (DHG)","richtig":"Dienstnehmerhaftpflichtgesetz","falsch":["Kraftfahrgesetz","Arbeitszeitgesetz","Straßenverkehrsordnung"],"quelle":"DHG; KV Taxi 2026, XI"},{"nr":"37","frage":"In welchem Ausmaß haften Sie als Taxilenker:in an von Ihnen verursachten Schäden?","antwort":"Es kommt auf das Verschulden an:\n– entschuldbare Fehlleistung: keine Haftung\n– leichte Fahrlässigkeit: das Gericht kann die Haftung mäßigen oder ganz erlassen\n– grobe Fahrlässigkeit: Mäßigung möglich\n– Vorsatz: volle Haftung","richtig":"Je nach Verschulden – von keiner Haftung bis voller Haftung bei Vorsatz","falsch":["Immer voll für jeden Schaden","Nie, der Arbeitgeber haftet immer","Immer zur Hälfte"],"quelle":"§ 2 DHG"},{"nr":"38","frage":"Ihr Arbeitgeber/Ihre Arbeitgeberin kündigt Sie, wann endet das Arbeitsverhältnis?","antwort":"Mit Ablauf der Kündigungsfrist zum Kündigungstermin (15. oder Letzter eines Monats)\nFristen: 6 Wochen; ab dem 3. Dienstjahr 2 Monate, ab dem 6. 3 Monate, ab dem 16. 4 Monate, ab dem 26. 5 Monate","richtig":"Nach der Kündigungsfrist zum 15. oder Monatsletzten","falsch":["Sofort mit der Kündigung","Immer nach 2 Wochen","Erst nach einem Jahr"],"quelle":"§ 1159 ABGB, KV Taxi 2026, IX.1"},{"nr":"39","frage":"Was ist die Besonderheit einer „Lösung in der Probezeit“ und wo ist diese geregelt?","antwort":"Im ersten Monat kann das Arbeitsverhältnis von beiden Seiten jederzeit ohne Frist und ohne Grund aufgelöst werden\nGeregelt im Kollektivvertrag (und § 1158 ABGB)","richtig":"Im ersten Monat jederzeit ohne Frist – im Kollektivvertrag","falsch":["Im ersten Jahr mit 2 Wochen Frist – in der StVO","Probezeit gibt es im Taxigewerbe nicht","Drei Monate mit Begründung – im KFG"],"quelle":"KV Taxi 2026, IX.1; § 1158 ABGB"},{"nr":"40","frage":"Was bedeutet eine einvernehmliche Auflösung?","antwort":"Arbeitgeber und Arbeitnehmer vereinbaren gemeinsam das Ende – jederzeit, ohne Kündigungsfrist (am besten schriftlich)","richtig":"Beide vereinbaren gemeinsam das Ende, ohne Frist","falsch":["Der Arbeitgeber entlässt fristlos","Der Arbeitnehmer tritt aus","Das Arbeitsverhältnis endet nach einem Jahr"],"quelle":"ABGB (Vertragsfreiheit)"},{"nr":"41","frage":"Wie kann Sie Ihr Arbeitgeber/Ihre Arbeitgeberin kündigen? Muss man einen Grund für die Kündigung nennen?","antwort":"Durch Kündigung – mündlich oder schriftlich – unter Einhaltung von Kündigungsfrist und Kündigungstermin\nEin Grund muss nicht genannt werden (eine unfaire Kündigung kann aber angefochten werden)","richtig":"Mit Frist und Termin – ein Grund muss nicht genannt werden","falsch":["Nur schriftlich mit Begründung","Nur mit Zustimmung der Arbeiterkammer","Jederzeit ohne Frist"],"quelle":"§ 1159 ABGB; ArbVG"},{"nr":"42","frage":"Wann ist eine Entlassung berechtigt und was bedeutet eine Entlassung für mich?","antwort":"Bei einem schweren (wichtigen) Grund, z. B. Diebstahl, Untreue, beharrliche Arbeitsverweigerung, Taxameter nicht eingeschaltet\nDas Arbeitsverhältnis endet sofort ohne Frist; anteiliger Urlaubszuschuss und Weihnachtsgeld entfallen","richtig":"Bei schwerem Grund – sofortiges Ende ohne Frist, anteilige Sonderzahlungen entfallen","falsch":["Bei jeder Verspätung – mit 2 Wochen Frist","Nur mit Zustimmung des Arbeitnehmers","Nach drei Verwarnungen – mit voller Abfertigung"],"quelle":"§ 82 GewO 1859, KV Taxi 2026, IX.3 und XV.F"},{"nr":"43","frage":"Wie kündigen Sie als Arbeitnehmer:in und wo können Sie dies nachlesen?","antwort":"Durch Kündigung unter Einhaltung der gesetzlichen Frist (in der Regel 1 Monat zum Monatsletzten)\nNachlesen: ABGB (§ 1159) und Kollektivvertrag","richtig":"Mit gesetzlicher Frist (meist 1 Monat) – im ABGB und Kollektivvertrag","falsch":["Ohne Frist, einfach nicht mehr kommen","Nur mit Grund – in der StVO","Mit 6 Monaten Frist – im KFG"],"quelle":"§ 1159 ABGB, KV Taxi 2026, IX.1"},{"nr":"44","frage":"Wann dürfen Sie berechtigt vorzeitig austreten?","antwort":"Bei einem wichtigen Grund, z. B.\n– der Arbeitgeber zahlt den Lohn nicht,\n– die Arbeit gefährdet die Gesundheit oder man kann sie nicht mehr leisten,\n– der Arbeitgeber beleidigt, bedroht oder belästigt einen","richtig":"Bei wichtigem Grund, z. B. Lohn wird nicht bezahlt oder Gesundheit gefährdet","falsch":["Wenn man einen besser bezahlten Job findet","Wenn man Urlaub möchte","Wenn das Taxi alt ist"],"quelle":"§ 82a GewO 1859, § 1162 ABGB"},{"nr":"45","frage":"Was bedeutet ein befristetes Arbeitsverhältnis?","antwort":"Ein Arbeitsverhältnis auf bestimmte Zeit – es endet automatisch mit Zeitablauf, ohne Kündigung\nMehrere befristete Verträge hintereinander (Kettenverträge) sind grundsätzlich unzulässig","richtig":"Es endet automatisch mit Zeitablauf, ohne Kündigung","falsch":["Es endet nur durch Kündigung","Es gilt nur in der Probezeit","Es hat keinen Urlaubsanspruch"],"quelle":"ABGB"},{"nr":"46","frage":"Wann haben Sie Anspruch auf Arbeitssuchtage während der Kündigungsfrist und wie lange?","antwort":"Wenn der Arbeitgeber kündigt – auf Verlangen, ohne Lohnabzug\nMindestens ein Fünftel der wöchentlichen Arbeitszeit pro Woche (etwa ein Arbeitstag)","richtig":"Bei Kündigung durch den Arbeitgeber – etwa ein Tag pro Woche, ohne Lohnabzug","falsch":["Bei eigener Kündigung – zwei Tage pro Woche","Nur bei Entlassung – eine Stunde pro Tag","Nie"],"quelle":"§ 1160 ABGB, KV Taxi 2026, IX.2"}]},{"nr":"VII","name":"Diverses","fragen":[{"nr":"1","frage":"Welche Fahrten unterliegen nicht der Taxitarifverordnung?","thema":"Gewerberechtliche Vorschriften","antwort":"Fahrten über die Landesgrenze bzw. das Tarifgebiet hinaus\nBotenfahrten (nur Sachen, ohne Hilfsmittel tragbar)\nPauschalfahrten (Preis über dem einstündigen Zeittarif)\nFahrten mit ärztlicher Transportanweisung, Schülertransporte, Fahrten für öffentliche Auftraggeber mit Rahmentarifen, Ersatzverkehr, Anrufsammeltaxis\nFahrten für Menschen mit Behinderung mit Fahrtkostenzuschuss","richtig":"Fahrten über die Landesgrenze, Botenfahrten, Pauschal- und Vertragsfahrten (z. B. Krankentransporte mit Rahmentarif)","falsch":["Fahrten in der Nacht","Fahrten vom Flughafen in die Stadt","Fahrten unter 5 km"],"quelle":"§ 14 Abs. 1a GelverkG, § 1 Abs. 2 Wiener Taxitarif"},{"nr":"2","frage":"Wonach entscheidet sich, wie viele Fahrzeuge ein Taxiunternehmen einsetzen kann?","thema":"Gewerberechtliche Vorschriften","antwort":"Nach der Konzession: Sie wird für eine bestimmte Zahl von Fahrzeugen erteilt\nFür jedes Fahrzeug müssen finanzielle Leistungsfähigkeit und ein Abstellplatz nachgewiesen werden; mehr Fahrzeuge brauchen eine Genehmigung","richtig":"Nach der Konzession – sie gilt für eine bestimmte Zahl von Fahrzeugen","falsch":["Nach der Zahl der Taxistandplätze","Nach dem Wunsch des Unternehmers, ohne Grenze","Nach der Zahl der Fahrer mit Taxischein"],"quelle":"§ 4, § 5 GelverkG"},{"nr":"3","frage":"Welche Arten von Gewerbe unterscheidet die Gewerbeordnung?","thema":"Gewerberechtliche Vorschriften","antwort":"Freie Gewerbe und reglementierte Gewerbe (für diese braucht man einen Befähigungsnachweis)\nDas Taxigewerbe ist ein konzessioniertes Gewerbe nach dem Gelegenheitsverkehrs-Gesetz","richtig":"Freie und reglementierte Gewerbe","falsch":["Große und kleine Gewerbe","Städtische und ländliche Gewerbe","Tag- und Nachtgewerbe"],"quelle":"§ 5 GewO 1994, § 1 GelverkG"},{"nr":"4","frage":"Wo darf der Taxiunternehmer sein Gewerbe ausüben?","thema":"Gewerberechtliche Vorschriften","antwort":"Vom Standort der Konzession aus (Standortgemeinde) – dort müssen auch die Abstellplätze für die Taxis sein\nWeitere Betriebsstätten sind nur mit eigenen Abstellplätzen erlaubt","richtig":"Vom Standort der Konzession aus (mit Abstellplätzen dort)","falsch":["Überall in Europa ohne Standort","Nur auf Taxistandplätzen","Nur im eigenen Wohnbezirk"],"quelle":"§ 5, § 10 Abs. 6 und 7 GelverkG"},{"nr":"5","frage":"Welche Hygienemaßnahmen sind im Fahrzeug einzuhalten?","thema":"Unfallverhütung / Hygiene / Umweltschutz","antwort":"Das Taxi innen und außen regelmäßig reinigen, Griffe und Sitze sauber halten\nGut lüften\nAbfall entsorgen\nSelbst gepflegt sein (saubere Kleidung, saubere Hände)\nMit einer fieberhaften Infektionskrankheit nicht fahren","richtig":"Regelmäßig reinigen, lüften, persönliche Hygiene – krank nicht fahren","falsch":["Nur einmal im Monat reinigen","Duftbäume statt Reinigung","Hygiene ist Sache der Fahrgäste"],"quelle":"§ 11 Z 6 und 8 LBO, § 3 Z 1 BO 1994"},{"nr":"6","frage":"Welche allgemeine Grundätze der Gefahrenverhütung kennen Sie?","thema":"Unfallverhütung / Hygiene / Umweltschutz","antwort":"Gefahren vermeiden; nicht vermeidbare Gefahren abschätzen und an der Quelle bekämpfen\nDie Arbeit an den Menschen anpassen, Stand der Technik berücksichtigen\nGefährliches durch weniger Gefährliches ersetzen\nGemeinsame Schutzmaßnahmen vor persönlichen\nDie Arbeitnehmer richtig unterweisen","richtig":"Gefahren vermeiden, an der Quelle bekämpfen, gemeinsamer vor persönlichem Schutz, unterweisen","falsch":["Erst nach dem ersten Unfall handeln","Nur Schutzkleidung ausgeben","Verantwortung liegt nur beim Arbeitnehmer"],"quelle":"§ 7 ASchG"},{"nr":"7","frage":"Wann müssen Sie als Arbeitnehmer über Sicherheit und Gesundheitsschutz jedenfalls unterwiesen werden?","thema":"Unfallverhütung / Hygiene / Umweltschutz","antwort":"Vor Beginn der Arbeit\nBei einer Änderung der Aufgaben\nBei neuen Arbeitsmitteln oder Technologien\nNach Unfällen oder Beinahe-Unfällen","richtig":"Bei Arbeitsbeginn, bei neuen Aufgaben oder Arbeitsmitteln und nach Unfällen","falsch":["Nur einmal alle 10 Jahre","Nur auf eigenen Wunsch","Nur bei der Taxilenkerprüfung"],"quelle":"§ 14 ASchG"},{"nr":"8","frage":"Welche Pflichten haben Sie als Arbeitnehmer bei der Mitwirkung an der Unfallverhütung?","thema":"Unfallverhütung / Hygiene / Umweltschutz","antwort":"Sicherheitsvorschriften und Anweisungen einhalten\nArbeitsmittel und Schutzausrüstung richtig benützen\nGefahren, Mängel und Unfälle sofort melden\nSich nicht durch Alkohol oder Drogen gefährden","richtig":"Vorschriften einhalten, Arbeitsmittel richtig nützen, Gefahren und Unfälle melden","falsch":["Keine – das ist Sache des Arbeitgebers","Defekte selbst reparieren, ohne zu melden","Nur die eigene Sicherheit beachten"],"quelle":"§ 15 ASchG"},{"nr":"9","frage":"Wie können Sie als Taxifahrer zum Umweltschutz beitragen?","thema":"Unfallverhütung / Hygiene / Umweltschutz","antwort":"Vorausschauend und spritsparend fahren\nDen Motor nicht unnötig laufen lassen (kein Warmlaufen)\nReifendruck kontrollieren, Taxi gut warten\nElektro- oder Hybridtaxis nutzen\nAbfall richtig entsorgen","richtig":"Spritsparend fahren, Motor nicht laufen lassen, Taxi gut warten","falsch":["Mit laufendem Motor am Standplatz warten","Möglichst oft beschleunigen und bremsen","Den Reifendruck senken"],"quelle":"§ 102 Abs. 4 KFG"},{"nr":"10","frage":"Welche vorbeugenden Maßnahmen können Sie treffen, um sich vor Raubüberfällen zu schützen?","thema":"Kriminalprävention","antwort":"Nur wenig Bargeld sichtbar mitführen, Einnahmen nicht zeigen, Kartenzahlung anbieten\nTüren bei Bedarf verriegeln, Fahrgäste aufmerksam einschätzen\nKontakt zur Funkzentrale halten, Fahrziel melden\nAuf einsame Gegenden achten; bei Bedenken Fahrt ablehnen (erlaubt)","richtig":"Wenig Bargeld sichtbar, Kontakt zur Zentrale, bei Sicherheitsbedenken Fahrt ablehnen","falsch":["Viel Wechselgeld offen zeigen","Fahrgäste nie ansehen","Immer die kürzesten, dunklen Seitenwege nehmen"],"quelle":"§ 12 Abs. 2 Z 3 LBO; Kriminalprävention"},{"nr":"11","frage":"Wie verhalten Sie sich im Falle eines Überfalls?","thema":"Kriminalprävention","antwort":"Ruhe bewahren, keinen Widerstand leisten – das eigene Leben geht vor\nDen Forderungen nachkommen, keine hastigen Bewegungen\nTäter genau einprägen (Aussehen, Sprache, Kleidung)\nWenn möglich, Notsignal geben (Alarmblinkanlage, Notruf)","richtig":"Ruhig bleiben, keinen Widerstand leisten, Täter einprägen","falsch":["Sofort zurückschlagen","Den Täter verfolgen","Laut schreien und das Geld festhalten"],"quelle":"Kriminalprävention; § 102 Abs. 2 Z 2 KFG"},{"nr":"12","frage":"Sie wurden soeben überfallen. Was sollten Sie nun unternehmen?","thema":"Kriminalprävention","antwort":"In Sicherheit bringen, sofort die Polizei rufen (133 oder 112)\nTatort nicht verändern, nichts anfassen\nTäterbeschreibung und Fluchtrichtung notieren\nZeugen ansprechen, Arbeitgeber/Zentrale informieren","richtig":"Polizei rufen, Tatort nicht verändern, Täter und Fluchtrichtung notieren","falsch":["Das Taxi gleich waschen","Dem Täter nachfahren","Erst am nächsten Tag melden"],"quelle":"Kriminalprävention"},{"nr":"13","frage":"Sie werden Opfer eines Überfalls. Wann dürfen Sie Gegenwehr leisten?","thema":"Kriminalprävention","antwort":"Nur in Notwehr: wenn ein gegenwärtiger rechtswidriger Angriff auf Leben, Gesundheit, Freiheit oder Vermögen erfolgt – und nur so viel, wie zur Abwehr nötig ist\nIn der Regel ist Nachgeben sicherer","richtig":"Nur in Notwehr, mit dem nötigen Maß","falsch":["Immer, mit allen Mitteln","Nie, auch nicht bei Lebensgefahr","Erst nach dem Überfall, um das Geld zurückzuholen"],"quelle":"§ 3 StGB"},{"nr":"14","frage":"Wie verhalten Sie sich als Zeuge einer Straftat?","thema":"Kriminalprävention","antwort":"Ruhe bewahren, sich nicht selbst gefährden\nPolizei verständigen (133 oder 112)\nSich Einzelheiten merken (Personen, Kleidung, Fahrzeug, Zeit, Ort)\nWenn gefahrlos möglich, Erste Hilfe leisten; als Zeuge zur Verfügung stehen","richtig":"Polizei verständigen, Einzelheiten merken, als Zeuge zur Verfügung stehen","falsch":["Selbst den Täter festnehmen","Wegfahren, um nichts zu tun zu haben","Den Tatort aufräumen"],"quelle":"Kriminalprävention"},{"nr":"15","frage":"Wie schützen Sie Ihr Taxi vor Diebstahl?","thema":"Kriminalprävention","antwort":"Immer abschließen, Schlüssel nie stecken lassen – auch nicht kurz\nFenster schließen, nichts Wertvolles sichtbar liegen lassen\nWegfahrsperre/Alarmanlage nutzen, an belebten, beleuchteten Orten abstellen","richtig":"Abschließen, Schlüssel abziehen, Wertsachen nicht sichtbar lassen","falsch":["Schlüssel stecken lassen, damit Kollegen das Taxi bewegen können","Nur in der Nacht abschließen","Das Fenster offen lassen zum Lüften"],"quelle":"§ 102 Abs. 6 KFG"},{"nr":"16","frage":"Eine Dame mit Gehstock und Einkaufstaschen nähert sich dem Standplatz und ist offensichtlich auf der Suche nach einem Fahrzeug. Wie verhalten Sie sich?","thema":"Kundenorientiertes Verhalten","antwort":"Aussteigen und der Dame entgegengehen\nHöflich Hilfe anbieten, die Taschen tragen und verstauen\nBeim Einsteigen helfen und beim Ziel beim Aussteigen helfen","richtig":"Aussteigen, entgegengehen, Taschen tragen und beim Einsteigen helfen","falsch":["Im Taxi sitzen bleiben und warten","Sie zum ersten Taxi schicken","Ablehnen, weil die Fahrt kurz sein wird"],"quelle":"§ 11 Z 4 LBO"},{"nr":"17","frage":"Soeben hat es stark zu regnen bekommen. Eine Frau mit Kinderwagen und zwei Kindern hat auf der gegenüberliegenden Straßenseite Schutz in einem Hauseingang gefunden und winkt Ihnen zu. Wie verhalten Sie sich?","thema":"Kundenorientiertes Verhalten","antwort":"Ein Zeichen geben, dass man kommt, und sicher zu ihr zufahren bzw. gefahrlos wenden (Verkehrsregeln beachten)\nAussteigen, beim Verstauen des Kinderwagens und beim Einsteigen helfen\nFreundlich bleiben und die Kinder sicher unterbringen","richtig":"Sicher hinfahren, Kinderwagen verstauen und beim Einsteigen helfen","falsch":["Hupen und warten, bis sie über die Straße kommt","Weiterfahren, Kinderwagen sind zu groß","Verkehrswidrig quer über die Straße fahren"],"quelle":"§ 11 Z 4 LBO; StVO"}]}];

// Autobahnen, Rampen und Namen, die im Wiener Straßengraphen anders heißen
const KEY_ALIAS = { bräuhausbrücke: 'brauhausbrücke', gürtelbrücke: 'gürtelbrückeüberdendonaukanal', bitterlichbrücke: 'bitterlichstrnbrücke' };
const HWY_KEYS = new Set(['a22', 'a23', 'a4', 's1', 's2', 'nordbrücke', 'rampe']);
function streetKey(label) {
  const m = String(label).match(/^\s*([AS])\s*-?\s*(\d+)/i);
  if (m) return m[1].toLowerCase() + m[2];
  if (/^\s*(ausfahrt|abfahrt|kreisverkehr)|ausfahrt\s*$/i.test(label)) return 'rampe';
  let s = label.split('/')[0];
  s = s.replace(/\(.*?\)/g, ' ').replace(/nebenfahrbahn/ig, ' ');
  s = s.toLowerCase().replace(/ß/g, 'ss').replace(/strasse/g, 'str');
  s = s.replace(/[^a-zäöü]/g, '');
  return KEY_ALIAS[s] || s;
}

// Zwei Rampen hintereinander („Abfahrt A22 Richtung Norden“, „Ausfahrt Strebersdorf“): dazwischen liegt die genannte
// Autobahn – sie kommt als verstecktes Zwischenstück dazu, sonst fielen beide Rampen auf denselben Punkt.
function searchKeys(steps, has) {
  const keys = [], own = [];
  steps.forEach((s, i) => {
    const k = streetKey(s); if (!has(k)) return;
    keys.push(k); own.push(i);
    const m = String(s).match(/\b([AS])\s*-?\s*(\d+)/i), via = m && m[1].toLowerCase() + m[2];
    if (k === 'rampe' && i + 1 < steps.length && streetKey(steps[i + 1]) === 'rampe' && via && has(via)) { keys.push(via); own.push(i); }

const kRight = () => krun.hist.filter(h => h[1]).length, kWrong = () => krun.hist.filter(h => !h[1]).map(h => h[0]);

function kAnswer(ok) {
  // solange die Karte noch hinausfliegt, zählt kein zweiter Tastendruck (sonst wäre die nächste Karte ungesehen beantwortet)
  if (!krun || krun.i >= krun.ids.length || kflying) return;
  const id = krun.ids[krun.i], s = kstat[id] || [0, 0, false], before = s[2];
  s[ok ? 0 : 1]++; s[2] = ok; kstat[id] = s; kSave(KSTAT_KEY, kstat);
  krun.hist.push([id, ok, before]); krun.i++; kflip = false; kSave(KRUN_KEY, krun);
  sfx(ok ? 'ok' : 'wrong');
  if (krun.i >= krun.ids.length) sfx('goal');
  kFly(ok ? 1 : -1);
}
function kUndo() {
  if (!krun || !krun.hist.length || kflying) return;
  const [id, ok, before] = krun.hist.pop(), s = kstat[id];
  // Lernstand wie vor der Antwort (ältere Stapel ohne dritten Wert: „nicht gewusst“)
  if (s) { s[ok ? 0 : 1] = Math.max(0, s[ok ? 0 : 1] - 1); s[2] = !!before; }
  kSave(KSTAT_KEY, kstat); krun.i = Math.max(0, krun.i - 1); kflip = false; kSave(KRUN_KEY, krun);
  sfx('zurueck'); drawKarten(); renderKartenPanel();
  // die Karte kommt von der Seite zurück, zu der sie weggeflogen ist (gewusst: rechts, nicht gewusst: links)
  const f = $('#cards .fc'), dir = ok ? 1 : -1;
  if (f && f.animate && !reduced()) f.animate([{ transform: `translateX(${dir * 120}%) rotate(${dir * 14}deg)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 340, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
function kFlip() { if (!krun || krun.i >= krun.ids.length) return; kflip = !kflip; sfx('umdrehen'); const f = $('#cards .fc'); if (f) f.classList.toggle('flipped', kflip); }
// Karte fliegt zur Seite hinaus, dann kommt die nächste
function kFly(dir) {
  const f = $('#cards .fc');
  if (!f || reduced()) { drawKarten(); renderKartenPanel(); return; }
  kflying = true;
  f.style.transition = 'transform .28s ease-in, opacity .28s ease-in';
  f.style.transform = `translateX(${dir * 120}%) rotate(${dir * 14}deg)`; f.style.opacity = '0';
  setTimeout(() => { kflying = false; drawKarten(); renderKartenPanel(); }, 230);
}

// beim Ein- und Ausschalten von „Mischen“: die obersten Karten des neuen Stapels (mit Namen) fächern nach links und
// rechts auf und schieben sich zweimal ineinander; dabei wechselt ihre Reihenfolge. Die echte oberste Karte mischt mit
// und landet zuletzt oben – so gibt es am Ende keinen Schnitt zwischen Animation und Karte. Die bisher oberste Karte
// (prev, so wie sie gerade lag, auch umgedreht) liegt am Anfang noch vorne und verschwindet im Stapel.
function kShuffleAnim(prev) {
  const stage = $('#cards .fc-stage'), fc = $('#cards .fc');
  if (!stage || !fc || reduced() || !fc.animate) return;
  // die nächsten Karten des Stapels; ist er kürzer, irgendwelche anderen (nur fürs Bild)
  const more = krun.ids.slice(krun.i + 1, krun.i + 6), pool = KARTEN_ALL.filter(c => c.id !== krun.ids[krun.i]);
  while (more.length < 5) more.push(pool[Math.floor(Math.random() * pool.length)].id);
  const ghosts = more.map(id => {
    const g = el('div', 'fc-ghost'); g.append(kFront(KARTEN_BY_ID.get(id), false)); stage.insertBefore(g, fc); return g;
  });
  let old = null;
  if (prev && KARTEN_BY_ID.has(prev.id)) {
    const c = KARTEN_BY_ID.get(prev.id); old = el('div', 'fc-ghost');
    let f;
    if (prev.flip && !isSeq(c)) { f = kBack(c); f.style.transform = 'none'; }
    else f = kFront(c, !isSeq(c));
    old.append(f); stage.insertBefore(old, fc);
  }
  // Reihenfolge (z-index): Anfang – alte Karte oben, Mitte – zufällig, Ende – neue Karte oben, alte gleich darunter
  // die neue Karte kommt zuletzt (längste Verzögerung), damit nach ihr keine andere mehr über ihr landet
  const cards = [...ghosts].concat(old ? [old] : [], [fc]), N = cards.length, mid = shuffle(cards.map((_, i) => i));
  const z0 = cards.map((_, i) => i + 1);
  if (old) { z0[N - 2] = N; z0[N - 1] = N - 1; }
  const home = 'translate(0, 0) rotate(0deg)';
  cards.forEach((card, i) => {
    const side = i % 2 ? 1 : -1, x1 = side * (24 + i * 4), x2 = -side * (20 + i * 4), r1 = side * (4 + i * 1.5), r2 = -side * (3 + i * 1.5);
    card.animate([
      { transform: home, zIndex: z0[i] },
      { transform: `translate(${x1}%, ${-6 - i * 2}px) rotate(${r1}deg)`, zIndex: mid[i] + 1, offset: 0.25 },
      { transform: home, zIndex: mid[i] + 1, offset: 0.5 },
      { transform: `translate(${x2}%, ${-4 - i * 2}px) rotate(${r2}deg)`, zIndex: i + 1, offset: 0.75 },
      { transform: home, zIndex: i + 1 },
    ], { duration: 1100, delay: i * 40, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'backwards' });
  });
  sfx('mischen');
  setTimeout(() => cards.forEach(g => { if (g !== fc) g.remove(); }), 1100 + N * 40 + 50);
}

// Hausnummer weglassen (vom Nutzer gewünscht): „Schottenring 7-9“ -> „Schottenring“, „Rennweg 99 / Rinnböckstraße 1“ ->
// „Rennweg / Rinnböckstraße“; Nummern, die zum Namen gehören („7. Haidequerstraße“, „Objekt 1“), bleiben
const ohneNr = s => s.replace(/(?<!Objekt)\s+\d+[a-zA-Z]?(?:\s*[-\/]\s*\d+[a-zA-Z]?)*(?:\s+und\s+\d+)?(?=\s*(?:$|\/|\(|\)|bzw\.))/g, '').replace(/\s+bzw\.\s+/, ' bzw. ');
// „5., Kliebergasse“ bzw. „3./4., Prinz-Eugen-Straße“ -> Bezirk und Straße
function bezirkText(adr, nr = false) {
  const m = adr.match(/^(\d{1,2})(?:\.\/(\d{1,2}))?\.,\s*(.*)$/), o = nr ? s => s : ohneNr;
  if (!m) return { bez: '', str: o(adr) };
  return { bez: m[2] ? `${m[1]}./${m[2]}. Bezirk` : `${m[1]}. Bezirk · ${BEZIRKE[+m[1] - 1] || ''}`, str: o(m[3]) };
}
// lange Fragen (Hausnummern) kleiner setzen
const bigText = (t, cls = '') => el('b', cls + (t.length > 60 ? ' fc-long' : t.length > 26 ? ' fc-mid' : ''), t);
function kFront(c, tip = true) {
  const k = KARTEN[c.kat], v = bezirkText(c.name, true), f = el('div', 'fc-face fc-front');
  f.append(el('small', '', k.frage || k.name), bigText(v.str));
  const bez = v.bez || (k.zusVorne ? c.zus : '');
  if (bez) f.append(el('span', 'fc-bez', bez));
  if (tip) f.append(el('span', 'fc-tip', 'Tippen zum Umdrehen'));
  return f;
}
function kBack(c) {
  const k = KARTEN[c.kat], b = bezirkText(c.adr), f = el('div', 'fc-face fc-back');
  f.append(el('small', '', bezirkText(c.name, true).str), bigText(b.str));
  const bez = b.bez || (k.zusVorne ? '' : c.zus);
  if (bez) f.append(el('span', 'fc-bez', bez));
  return f;
}
const adrText = c => isSeq(c) ? c.adr.join(' – ') : c.adr;

// Reihenfolge-Karte: die Straßen liegen gemischt da und werden der Reihe nach angetippt.
// Richtig angetippt wird die Straße grün, bekommt ihre Nummer und gleitet nach oben in die Reihe – am Ende stehen
// alle von Anfang bis Ende nummeriert oben. Falsch wackelt sie rot und zählt als Fehler. Ohne Fehler geht es von selbst
// weiter (gewusst), sonst bzw. nach „Lösung zeigen“ mit „Weiter“ (nicht gewusst).
// pos: Straße (Index in c.adr) -> ihre Stelle in der Reihenfolge; gezeigt: per Lösung gezeigt.
let kseq = null;
function kSeqState(c) {
  if (!kseq || kseq.id !== c.id || kseq.i !== krun.i) kseq = { id: c.id, i: krun.i, n: 0, fehler: 0, rf: 0, runde: 1, shown: false, pos: {}, gezeigt: {}, order: shuffle(c.adr.map((_, j) => j)) };
  return kseq;
}
const kSeqDone = () => kseq && krun && kseq.i === krun.i && kseq.n >= KARTEN_BY_ID.get(kseq.id).adr.length;
// noch nicht gelegte Straßen
const kSeqOffen = st => st.order.filter(j => st.pos[j] == null);
function kSeqPick(j) {
  const c = KARTEN_BY_ID.get(krun.ids[krun.i]); if (!c || !isSeq(c) || kflying) return;
  const st = kSeqState(c); if (st.n >= c.adr.length || st.pos[j] != null) return;
  // gleiche Namen (zweimal Favoritenstraße) sind austauschbar
  if (c.adr[j] === c.adr[st.n]) {
    st.pos[j] = st.n++;
    kSeqRedraw();
    if (st.n >= c.adr.length && !st.fehler) setTimeout(() => { if (kseq === st && krun.i === st.i && !kflying) kAnswer(true); }, 900);
  } else {
    st.fehler++; st.rf++; sfx('wrong');
    const chip = $(`#cards .seq-pool [data-j="${j}"]`);
    if (chip) { chip.classList.remove('nein'); void chip.offsetWidth; chip.classList.add('nein'); }
    const fl = $('#cards .seq-fehler span'); if (fl) fl.textContent = kSeqInfo(c, st); kSeqFit();
  }
}
// Lösung zeigen: die übrigen Straßen bekommen der Reihe nach ihre Nummer, zählt als nicht gewusst
function kSeqShow() {
  const c = KARTEN_BY_ID.get(krun.ids[krun.i]); if (!c || !isSeq(c) || kflying) return;
  const st = kSeqState(c); if (st.n >= c.adr.length) return;
  st.shown = true; st.fehler = Math.max(1, st.fehler);
  for (; st.n < c.adr.length; st.n++) {
    const j = kSeqOffen(st).find(x => c.adr[x] === c.adr[st.n]);
    st.pos[j] = st.n; st.gezeigt[j] = true;
  }
  kSeqRedraw();
}
// neu zeichnen und die Pillen von ihrem alten an den neuen Platz gleiten lassen (FLIP)
function kSeqRedraw() {
  const vorher = new Map([...document.querySelectorAll('#cards .seq-chip')].map(b => [b.dataset.j, b.getBoundingClientRect()]));
  drawKarten();
  if (reduced()) return;
  const inner = $('#cards .seq-in'), z = inner && +inner.style.zoom || 1;
  document.querySelectorAll('#cards .seq-chip').forEach(b => {
    const a = vorher.get(b.dataset.j), r = b.getBoundingClientRect(); if (!a || !b.animate) return;
    const dx = (a.left - r.left) / z, dy = (a.top - r.top) / z; if (!dx && !dy) return;
    b.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.3,.7,.2,1)' });
  });
}
// Nochmal üben: dieselbe Karte neu gemischt von vorne; zählt trotzdem als nicht gewusst (die Fehler bleiben)
function kSeqNochmal() {
  const c = KARTEN_BY_ID.get(krun.ids[krun.i]); if (!c || !isSeq(c) || kflying || !kSeqDone()) return;
  Object.assign(kseq, { n: 0, rf: 0, runde: kseq.runde + 1, shown: false, pos: {}, gezeigt: {}, order: shuffle(c.adr.map((_, j) => j)) });
  kSeqRedraw();
}
// Stand unten auf der Karte; rf = Fehler in dieser Runde (nach „Nochmal üben“ zählt die neue Runde)
const kSeqInfo = (c, st) => st.n >= c.adr.length ? (st.shown ? 'Lösung' : st.rf ? `${st.rf} Fehler` : st.runde > 1 ? 'Jetzt richtig!' : 'Richtig!')
  : `${KARTEN[c.kat].frage} · ${st.n} von ${c.adr.length}` + (st.rf ? ` · ${st.rf} Fehler` : '');
function kSeqNext() { if (kSeqDone()) kAnswer(!kseq.fehler); }
// Kartenstapel in der Fläche der Karte
function drawKarten() {
  const box = $('#cards'); box.innerHTML = '';
  if (!kValid()) kNewDeck();
  const n = krun.ids.length, done = krun.i >= n, right = kRight(), wrong = kWrong();
  const top = el('div', 'fc-top');
  const prog = el('div', 'fc-prog'), bar = el('i'); bar.style.width = (n ? 100 * krun.i / n : 0) + '%'; prog.append(bar);
  const cnt = el('div', 'fc-cnt');
  cnt.append(el('span', 'fc-ok', `✓ ${right}`), el('span', 'fc-pos', n ? `${Math.min(krun.i + 1, n)} / ${n}` : '0 / 0'), el('span', 'fc-bad', `✕ ${wrong.length}`));
  top.append(prog, cnt); box.append(top);
  const stage = el('div', 'fc-stage'); box.append(stage);
  if (!n) {
    const e = el('div', 'fc-end'); e.append(el('b', '', 'Keine Karten'), el('span', '', kset.falsch ? 'In dieser Auswahl ist keine Karte mehr falsch. Schalte „Falsch“ aus oder wähle andere Kategorien.' : 'Wähle links mindestens eine Kategorie.'));
    stage.append(e); return;
  }
  if (done) {
    const e = el('div', 'fc-end');
    const pct = Math.round(100 * right / n);
    e.append(el('small', '', 'Stapel fertig'), el('b', '', `${right} von ${n} gewusst`), el('span', '', pct === 100 ? 'Alles gewusst – stark!' : `${pct} %`));
    const row = el('div', 'fc-endbtns');
    if (wrong.length) { const b = el('button', 'btn primary', `Falsche wiederholen (${wrong.length})`); b.type = 'button'; b.onclick = () => { kDeck(wrong); drawKarten(); renderKartenPanel(); }; row.append(b); }
    const all = el('button', 'btn', 'Ganzen Stapel nochmal'); all.type = 'button'; all.onclick = () => { kNewDeck(); drawKarten(); renderKartenPanel(); };
    row.append(all); e.append(row);
    if (krun.hist.length) { const u = el('button', 'fc-undo', '↶ Letzte Karte zurück'); u.type = 'button'; u.onclick = kUndo; e.append(u); }
    stage.append(e); return;
  }
  const c = KARTEN_BY_ID.get(krun.ids[krun.i]), seq = isSeq(c);
  const fc = el('div', 'fc' + (seq ? ' fc-seq' : '') + (kflip && !seq ? ' flipped' : ''));
  if (seq) kSeqCard(fc, c);
  else {
    fc.tabIndex = 0; fc.setAttribute('role', 'button'); fc.setAttribute('aria-label', 'Karte umdrehen');
    const inner = el('div', 'fc-inner'); inner.append(kFront(c), kBack(c));
    fc.append(inner);
  }
  fc.append(el('span', 'fc-stamp ok', 'Gewusst'), el('span', 'fc-stamp bad', 'Nochmal'));
  stage.classList.toggle('seq', seq); stage.append(fc);
  // nächste Karte schon darunter andeuten
  if (krun.i + 1 < n) stage.prepend(el('div', 'fc-next'));
  const btns = el('div', 'fc-btns');
  const icon = (cls, title, svg, fn) => { const b = el('button', 'fc-btn ' + cls); b.type = 'button'; b.title = title; b.innerHTML = svg; b.onclick = fn; return b; };
  const no = icon('bad', 'Nicht gewusst (←)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>', () => kAnswer(false));
  const un = icon('undo', 'Letzte Karte zurück (Pfeil nach unten)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>', kUndo);
  un.disabled = !krun.hist.length;
  if (seq) {
    // statt gewusst/nicht gewusst: Lösung zeigen bzw. Weiter, sobald alles liegt
    const st = kSeqState(c), fertig = st.n >= c.adr.length;
    const go = el('button', 'btn fc-seqbtn' + (fertig && st.fehler ? ' primary' : ''), fertig ? 'Weiter →' : 'Lösung zeigen');
    go.type = 'button'; go.onclick = fertig ? kSeqNext : kSeqShow; go.disabled = fertig && !st.fehler;
    btns.append(un, go);
  } else {
    const yes = icon('ok', 'Gewusst (→)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', () => kAnswer(true));
    btns.append(no, un, yes);
  }
  box.append(btns);
  box.append(el('p', 'fc-keys', seq ? 'Straßen der Reihe nach antippen · Leertaste: Lösung / weiter · ↓ zurück'
    : 'Leertaste: umdrehen · Pfeil rechts: gewusst · Pfeil links: nicht gewusst · Pfeil runter: zurück'));
  box.append(fehlerLink('Fehler auf dieser Karte melden', `Karteikarte „${c.name}“`, [`Kategorie: ${KARTEN[c.kat].name}`, `Vorne: ${c.name}${c.zus ? ' (' + c.zus + ')' : ''}`, `Antwort (Katalog): ${adrText(c)}`], 'flink fc-melden'));
  if (seq) kSeqFit(); else kDragInit(fc);
}
// Inhalt der Reihenfolge-Karte: oben Name und Bezirk, darunter die schon gelegten Straßen der Reihe nach (grün bzw.
// gelb mit Nummer), nach einem Strich die übrigen gemischt – alle gleich groß; unten Frage und Stand
function kSeqCard(fc, c) {
  const st = kSeqState(c), face = kFront(c, false);
  // die Frage steht unten in der Zeile mit dem Stand (spart oben eine Zeile)
  face.querySelector('small').remove();
  const done = el('div', 'seq-done'), pool = el('div', 'seq-pool');
  // Nummer erst, wenn die Straße richtig angetippt ist (vorher keine Zahlen – sie sähen wie die Lösung aus)
  st.order.filter(j => st.pos[j] != null).sort((a, b) => st.pos[a] - st.pos[b]).forEach(j => {
    const b = el('button', 'seq-chip ' + (st.gezeigt[j] ? 'shown' : 'ok')); b.type = 'button'; b.dataset.j = j; b.disabled = true;
    b.append(el('span', 'seq-nr', String(st.pos[j] + 1)), c.adr[j]); done.append(b);
  });
  kSeqOffen(st).forEach(j => {
    const b = el('button', 'seq-chip'); b.type = 'button'; b.dataset.j = j;
    b.append(c.adr[j]); b.onclick = () => kSeqPick(j); pool.append(b);
  });
  const info = el('div', 'seq-fehler'), txt = el('span', '', kSeqInfo(c, st)); info.append(txt);
  if (st.n >= c.adr.length) {
    if (st.rf) txt.classList.add('bad'); else if (!st.shown) txt.classList.add('ok');
    // fertig, aber nicht fehlerfrei: dieselbe Karte gleich nochmal legen
    if (st.fehler) { const b = el('button', 'seq-again', '↻ Nochmal üben'); b.type = 'button'; b.onclick = kSeqNochmal; info.append(b); }
  }
  // fertig (selbst gelegt oder „Lösung zeigen“): die Karte wird gelb wie die Rückseite der normalen Karten
  if (st.n >= c.adr.length) face.classList.add('loesung');
  const inner = el('div', 'seq-in'); inner.append(...face.childNodes, done, pool, info); face.append(inner); fc.append(face);
}
// alles ohne Scrollen auf die Karte: ist der Inhalt zu hoch (kleines Handy, niedriges Fenster), wird er verkleinert
function kSeqFit() {
  const face = $('#cards .fc-seq .fc-face'), inner = face && face.firstChild; if (!inner) return;
  // innerhalb einer Karte nur kleiner werden, nie wieder größer – sonst springt die Schrift beim Antippen
  const st = kseq && krun && kseq.i === krun.i ? kseq : null;
  let z = st && st.zoom || 1; inner.style.zoom = z < 1 ? z : '';
  while (face.scrollHeight > face.clientHeight && z > 0.5) { z -= 0.04; inner.style.zoom = z; }
  if (st) st.zoom = z;
}
addEventListener('resize', () => { if (state.mode === 'karten') { if (kseq) kseq.zoom = 1; kSeqFit(); } });
// Wischen: Karte folgt dem Finger, ab ~90 px zählt es als Antwort, sonst ist es ein Tipp zum Umdrehen
function kDragInit(fc) {
  fc.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    kdrag = { x: e.clientX, y: e.clientY, dx: 0, moved: false, id: e.pointerId }; fc.setPointerCapture(e.pointerId); fc.style.transition = 'none';
  });
  fc.addEventListener('pointermove', e => {
    if (!kdrag || e.pointerId !== kdrag.id) return;
    kdrag.dx = e.clientX - kdrag.x; if (Math.abs(kdrag.dx) > 6) kdrag.moved = true;
    fc.style.transform = `translateX(${kdrag.dx}px) rotate(${kdrag.dx / 22}deg)`;
    const k = Math.min(1, Math.abs(kdrag.dx) / 90);
    fc.querySelector('.fc-stamp.ok').style.opacity = kdrag.dx > 0 ? k : 0;
    fc.querySelector('.fc-stamp.bad').style.opacity = kdrag.dx < 0 ? k : 0;
  });
  const end = e => {
    if (!kdrag || e.pointerId !== kdrag.id) return;
    const { dx, moved } = kdrag; kdrag = null;
    if (Math.abs(dx) > 90) { kAnswer(dx > 0); return; }
    fc.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; fc.style.transform = '';
    fc.querySelectorAll('.fc-stamp').forEach(s => { s.style.opacity = 0; });
    if (!moved && e.type === 'pointerup') kFlip();
  };
  fc.addEventListener('pointerup', end); fc.addEventListener('pointercancel', end);
  fc.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); kFlip(); } });
}
document.addEventListener('keydown', e => {
  if (state.mode !== 'karten' || e.metaKey || e.ctrlKey || e.altKey || (e.target instanceof Element && e.target.closest('input, textarea, select'))) return;
  if (e.repeat && [' ', 'ArrowUp', 'ArrowRight', 'ArrowLeft', 'ArrowDown'].includes(e.key)) { e.preventDefault(); return; } // gedrückt halten zählt nur einmal
  const c = krun && krun.i < krun.ids.length ? KARTEN_BY_ID.get(krun.ids[krun.i]) : null;
  if (c && isSeq(c)) {
    // Reihenfolge-Karte: Leertaste/→ = Lösung zeigen bzw. weiter
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); if (kSeqDone()) kSeqNext(); else kSeqShow(); return; }
  }
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); kFlip(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); kAnswer(true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); kAnswer(false); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); kUndo(); }
});

// Leiste links: Kategorien wählen, Lernstand, Stapel neu mischen

// --- Bilder: Sehenswürdigkeiten erkennen (WKO-Katalog VIII., S. 56–60), wie bei der Vorprüfung am Computer ---
// Ein Foto, vier Namen zur Auswahl. Richtig: grün; falsch: rot, der richtige Name wird grün – in beiden Fällen kommt nach
// kurzer Pause von selbst das nächste Bild. Über dem Foto steht dann Name und Adresse; links und rechts davon die Knöpfe
// zurück (letzte Antwort zurücknehmen) und weiter (sofort weiter bzw. Bild überspringen – es kommt ans Ende der Runde).
// Tasten 1–4 wählen, Leertaste/→ weiter, ←/↓ zurück.
// Fotos aus Wikimedia Commons (freie Lizenzen) – Urheber und Lizenz stehen immer unter dem Foto (Pflicht der Lizenzen).
const BSTAT_KEY = 'taxi-bilder-v1', BRUN_KEY = 'taxi-bilder-runde-v1', BSET_KEY = 'taxi-bilder-auswahl-v1';
const BILD_BY_NAME = new Map(BILDER.map(b => [b.name, b]));
// Lernstand je Bild: [wie oft erkannt, wie oft nicht, zuletzt erkannt?]
let bstat = kLoad(BSTAT_KEY, {});
let bset = Object.assign({ falsch: false }, kLoad(BSET_KEY, {}));
// laufende Runde: Namen, Position, Antworten [Name, richtig?], zur aktuellen Frage die vier Namen und die gewählte Antwort
let brun = kLoad(BRUN_KEY, null);
let bweiter = null;
const bWrong = n => !!bstat[n] && !bstat[n][2] && bstat[n][1] > 0;
const bKnown = n => bstat[n] && bstat[n][2];

function bValid() {
  if (!brun || !Array.isArray(brun.ids) || !Array.isArray(brun.hist)) return false;
  brun.ids = brun.ids.filter(n => BILD_BY_NAME.has(n)); brun.hist = brun.hist.filter(h => BILD_BY_NAME.has(h[0]));
  brun.i = Math.min(brun.i, brun.ids.length);
  if (brun.opts && !brun.opts.every(n => BILD_BY_NAME.has(n))) brun.opts = null;
  return true;
}
function bDeck(ids) { brun = { ids: shuffle(ids.slice()), i: 0, hist: [], opts: null, pick: null }; kSave(BRUN_KEY, brun); }
function bNewDeck() { let ids = BILDER.map(b => b.name); if (bset.falsch) ids = ids.filter(bWrong); bDeck(ids); }
// vier Namen: der richtige und drei falsche – möglichst von derselben Art (Denkmal zu Denkmal, Kirche zu Kirche),
// damit es wie bei der Prüfung nicht zu leicht ist
function bOptions(name) {
  const b = BILD_BY_NAME.get(name), andere = BILDER.filter(x => x.name !== name);
  const gleich = shuffle(andere.filter(x => x.typ === b.typ)), rest = shuffle(andere.filter(x => x.typ !== b.typ));
  return shuffle([name, ...gleich.concat(rest).slice(0, 3).map(x => x.name)]);
}
function bAnswer(k) {
  if (!brun || brun.i >= brun.ids.length || brun.pick != null || !brun.opts) return;
  const name = brun.ids[brun.i], ok = brun.opts[k] === name, s = bstat[name] || [0, 0, false], before = s[2];
  s[ok ? 0 : 1]++; s[2] = ok; bstat[name] = s; kSave(BSTAT_KEY, bstat);
  // Antwort mit den vier Namen und dem Lernstand von vorher merken – für „zurück“
  brun.pick = k; brun.hist.push([name, ok, before, brun.opts, k]); kSave(BRUN_KEY, brun);
  sfx(ok ? 'ok' : 'wrong');
  drawBilder(); renderBilderPanel();
  // richtig wie falsch nach kurzer Pause von selbst weiter (vom Nutzer gewünscht); falsch etwas länger, damit man den
  // richtigen Namen und die Adresse noch lesen kann
  clearTimeout(bweiter);
  const i = brun.i; bweiter = setTimeout(() => { if (state.mode === 'bilder' && brun.i === i && brun.pick != null) bNext(); }, ok ? 1600 : 2400);
}
// weiter: nach der Antwort sofort zum nächsten Bild; ohne Antwort wird das Bild übersprungen und kommt ans Ende der Runde
function bNext() {
  if (!brun || brun.i >= brun.ids.length) return;
  clearTimeout(bweiter);
  if (brun.pick == null) {
    if (brun.i >= brun.ids.length - 1) return;
    brun.ids.push(brun.ids.splice(brun.i, 1)[0]); brun.opts = null; kSave(BRUN_KEY, brun); sfx('skip'); drawBilder(); return;
  }
  brun.i++; brun.pick = null; brun.opts = null; kSave(BRUN_KEY, brun);
  if (brun.i >= brun.ids.length) sfx('goal');
  drawBilder();
}
// zurück: letzte Antwort zurücknehmen (Lernstand wie vorher) und das Bild mit denselben vier Namen nochmal fragen
function bBack() {

  clearTimeout(bweiter);
  const [name, ok, before, opts] = brun.hist.pop(), s = bstat[name];
  if (s) { s[ok ? 0 : 1] = Math.max(0, s[ok ? 0 : 1] - 1); s[2] = !!before; if (!s[0] && !s[1]) delete bstat[name]; }
  kSave(BSTAT_KEY, bstat);
  // die Antwort gehörte zum aktuellen Bild (noch nicht weiter) oder zum vorigen
  if (brun.pick == null) brun.i = Math.max(0, brun.i - 1);
  brun.pick = null; brun.opts = Array.isArray(opts) ? opts : null; kSave(BRUN_KEY, brun);
  sfx('zurueck'); drawBilder(); renderBilderPanel();
}
function fotoCredit(b) {
  const f = b.foto, p = el('p', 'bq-credit');
  const a = el('a', '', `Foto: ${f.autor} · ${f.lizenz}`); a.href = f.quelle; a.target = '_blank'; a.rel = 'noopener';

function drawBilder() {
  const box = $('#cards'); box.innerHTML = '';
  if (!bValid()) bNewDeck();

  const top = el('div', 'fc-top');
  const prog = el('div', 'fc-prog'), bar = el('i'); bar.style.width = (n ? 100 * (brun.i + (brun.pick != null ? 1 : 0)) / n : 0) + '%'; prog.append(bar);

    const pct = Math.round(100 * right / n);
    e.append(el('small', '', 'Runde fertig'), el('b', '', `${right} von ${n} erkannt`), el('span', '', pct === 100 ? 'Alles erkannt – stark!' : `${pct} %`));
    const row = el('div', 'fc-endbtns');
    if (wrong.length) { const b = el('button', 'btn primary', `Falsche wiederholen (${wrong.length})`); b.type = 'button'; b.onclick = () => { bDeck(wrong); drawBilder(); renderBilderPanel(); }; row.append(b); }
    const all = el('button', 'btn', 'Alle nochmal'); all.type = 'button'; all.onclick = () => { bset.falsch = false; kSave(BSET_KEY, bset); bNewDeck(); drawBilder(); renderBilderPanel(); };
    row.append(all); e.append(row); return;
  }
  const name = brun.ids[brun.i], b = BILD_BY_NAME.get(name);
  if (!brun.opts) { brun.opts = bOptions(name); kSave(BRUN_KEY, brun); }
  // Foto im Rahmen: der Rahmen (.bq-img) ist nur der Platz, das Foto darin so groß wie möglich und genau so groß wie das
  // Bild selbst (Seitenverhältnis --r, CSS mit Container-Einheiten) – kein Rand links/rechts
  const q = el('div', 'bq'), fig = el('figure', 'bq-img'), img = el('img');
  img.src = b.bild; img.alt = 'Foto einer Sehenswürdigkeit'; img.width = b.w; img.height = b.h; img.draggable = false;
  fig.style.setProperty('--r', (b.w / b.h).toFixed(4));
  fig.append(img);
  const beantwortet = brun.pick != null;
  // über dem Foto die Frage; nach der Antwort stattdessen Name und Adresse (nicht auf dem Foto, sonst verdeckt es auf dem Handy fast alles);
  // links davon zurück, rechts weiter
  const kopf = el('div', 'bq-kopf'), frage = el('p', 'bq-frage');
  if (beantwortet) { frage.classList.add('bq-adr'); frage.append(el('b', '', b.name), el('span', '', b.adr.replace(/^(\d+)\.,\s*/, '$1. Bezirk, '))); }
  else frage.textContent = 'Wie heißt diese Sehenswürdigkeit?';
  const rund = (cls, title, svg, fn, aus) => { const x = el('button', 'fc-btn bq-nav ' + cls); x.type = 'button'; x.title = title; x.setAttribute('aria-label', title); x.innerHTML = svg; x.onclick = fn; x.disabled = aus; return x; };
  const zur = rund('zur', 'Zurück (Pfeil links)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>', bBack, !brun.hist.length);
  const vor = rund('vor', beantwortet ? 'Weiter (Leertaste)' : 'Überspringen (Leertaste)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>', bNext, !beantwortet && brun.i >= n - 1);
  kopf.append(zur, frage, vor);
  q.append(kopf, fig, fotoCredit(b));
  const opts = el('div', 'bq-opts');
  brun.opts.forEach((o, k) => {
    const btn = el('button', 'bq-opt'); btn.type = 'button';
    btn.append(el('span', 'bq-nr', String(k + 1)), el('span', '', o));
    if (beantwortet) {
      btn.disabled = true;
      if (o === name) btn.classList.add('ok'); else if (k === brun.pick) btn.classList.add('nein');
    } else btn.onclick = () => bAnswer(k);
    opts.append(btn);
  });
  q.append(opts);
  box.append(q);
  box.append(el('p', 'fc-keys', 'Tasten 1–4: Antwort wählen · Leertaste: weiter · Pfeil links: zurück'));
  box.append(fehlerLink('Fehler bei diesem Bild melden', `Bild „${name}“`, [`Richtige Antwort: ${name}`, `Adresse: ${b.adr}`, `Foto: ${b.foto.quelle}`], 'flink fc-melden'));

document.addEventListener('keydown', e => {
  if (state.mode !== 'bilder' || e.metaKey || e.ctrlKey || e.altKey || e.repeat || (e.target instanceof Element && e.target.closest('input, textarea, select'))) return;

  else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); bNext(); }

// --- Theorie: die Fragen aus den Abschnitten II–VII des WKO-Katalogs als Karteikarten (vorne Frage, hinten Antwort) ---
// Der Katalog enthält nur die Fragen; die Antworten sind selbst formuliert nach den Gesetzen (RIS) bzw. dem
// Kollektivvertrag, mit Fundstelle (quelle). „alt“: nur in der alten Wiener Betriebsordnung (bis 2020) geregelt.
// Bedienung wie bei den Karteikarten: Tippen/Leertaste dreht um, rechts/→ gewusst, links/← nicht gewusst, ↓ zurück.
const THEORIE_ALL = THEORIE.flatMap((k, ki) => k.fragen.map(q => ({ id: k.nr + '|' + q.nr, kap: ki, ...q })));
const THEORIE_BY_ID = new Map(THEORIE_ALL.map(q => [q.id, q]));
const TSTAT_KEY = 'taxi-theorie-v1', TSET_KEY = 'taxi-theorie-auswahl-v1', TRUN_KEY = 'taxi-theorie-stapel-v1';
// Lernstand je Frage: [wie oft gewusst, wie oft nicht, zuletzt gewusst?]
let tstat = kLoad(TSTAT_KEY, {});
let tset = Object.assign({ kap: THEORIE.map((_, i) => i), falsch: false, mischen: true }, kLoad(TSET_KEY, {}));
if (tset.falsch && tset.mischen) tset.mischen = false;
tset.kap = (Array.isArray(tset.kap) ? tset.kap : []).filter(i => Number.isInteger(i) && i >= 0 && i < THEORIE.length);
let trun = kLoad(TRUN_KEY, null);
let tflip = false, tdrag = null, tflying = false;
const tKnown = id => tstat[id] && tstat[id][2];
const tWrong = id => !!tstat[id] && !tstat[id][2] && tstat[id][1] > 0;
const tWrongIds = () => THEORIE_ALL.filter(q => tset.kap.includes(q.kap) && tWrong(q.id)).map(q => q.id);

function tDeck(ids) { trun = { ids: tset.mischen ? shuffle(ids.slice()) : ids.slice(), i: 0, hist: [] }; tflip = false; kSave(TRUN_KEY, trun); }
function tNewDeck() { let ids = THEORIE_ALL.filter(q => tset.kap.includes(q.kap)).map(q => q.id); if (tset.falsch) ids = ids.filter(tWrong); tDeck(ids); }
function tValid() {
  if (!trun || !Array.isArray(trun.ids) || !Array.isArray(trun.hist)) return false;
  trun.ids = trun.ids.filter(id => THEORIE_BY_ID.has(id)); trun.hist = trun.hist.filter(h => THEORIE_BY_ID.has(h[0]));
  trun.i = Math.min(trun.i, trun.ids.length);

}
function tAnswer(ok) {

  s[ok ? 0 : 1]++; s[2] = ok; tstat[id] = s; kSave(TSTAT_KEY, tstat);

  sfx(ok ? 'ok' : 'wrong');

  f.style.transform = `translateX(${dir * 120}%) rotate(${dir * 14}deg)`; f.style.opacity = '0';

}
function tUndo() {

  if (s) { s[ok ? 0 : 1] = Math.max(0, s[ok ? 0 : 1] - 1); s[2] = !!before; }
  kSave(TSTAT_KEY, tstat); trun.i = Math.max(0, trun.i - 1); tflip = false; kSave(TRUN_KEY, trun);
  sfx('zurueck'); drawTheorie(); renderTheoriePanel();

  if (f && f.animate && !reduced()) f.animate([{ transform: `translateX(${dir * 120}%) rotate(${dir * 14}deg)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 340, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
function tFlip() { if (!trun || trun.i >= trun.ids.length) return; tflip = !tflip; sfx('umdrehen'); const f = $('#cards .fc'); if (f) f.classList.toggle('flipped', tflip); }

const tKapName = q => `${THEORIE[q.kap].nr}. ${THEORIE[q.kap].name}`;
function tFront(q) {

// Rückseite: Antwort als Liste (eine Zeile = ein Punkt), darunter die Fundstelle
function tBack(q) {

function drawTheorie() {

  const no = icon('bad', 'Nicht gewusst (←)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>', () => tAnswer(false));
  const un = icon('undo', 'Letzte Karte zurück (Pfeil nach unten)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>', tUndo);

  btns.append(no, un, yes); box.append(btns);
  box.append(el('p', 'fc-keys', 'Leertaste: umdrehen · Pfeil rechts: gewusst · Pfeil links: nicht gewusst · Pfeil runter: zurück'));
  box.append(fehlerLink('Fehler bei dieser Frage melden', `Theorie ${THEORIE[q.kap].nr}/${q.nr}`, [`Kapitel: ${tKapName(q)}`, `Frage: ${q.frage}`, `Antwort (App): ${q.antwort.replace(/\n/g, ' / ')}`, `Fundstelle: ${q.quelle}`], 'flink fc-melden'));

}
// Wischen wie bei den Karteikarten: ab ~90 px zählt es als Antwort, sonst ist es ein Tipp zum Umdrehen
function tDragInit(fc) {
  fc.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    tdrag = { x: e.clientX, dx: 0, moved: false, id: e.pointerId }; fc.setPointerCapture(e.pointerId); fc.style.transition = 'none';
  });
  fc.addEventListener('pointermove', e => {
    if (!tdrag || e.pointerId !== tdrag.id) return;
    tdrag.dx = e.clientX - tdrag.x; if (Math.abs(tdrag.dx) > 6) tdrag.moved = true;
    fc.style.transform = `translateX(${tdrag.dx}px) rotate(${tdrag.dx / 22}deg)`;
    const k = Math.min(1, Math.abs(tdrag.dx) / 90);
    fc.querySelector('.fc-stamp.ok').style.opacity = tdrag.dx > 0 ? k : 0;
    fc.querySelector('.fc-stamp.bad').style.opacity = tdrag.dx < 0 ? k : 0;
  });
  const end = e => {
    if (!tdrag || e.pointerId !== tdrag.id) return;
    const { dx, moved } = tdrag; tdrag = null;
    if (Math.abs(dx) > 90) { tAnswer(dx > 0); return; }
    fc.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; fc.style.transform = '';
    fc.querySelectorAll('.fc-stamp').forEach(s => { s.style.opacity = 0; });
    if (!moved && e.type === 'pointerup') tFlip();
  };
  fc.addEventListener('pointerup', end); fc.addEventListener('pointercancel', end);
  fc.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); tFlip(); } });
}
document.addEventListener('keydown', e => {
  if (state.mode !== 'theorie' || e.metaKey || e.ctrlKey || e.altKey || (e.target instanceof Element && e.target.closest('input, textarea, select'))) return;
  if (e.repeat && [' ', 'ArrowUp', 'ArrowRight', 'ArrowLeft', 'ArrowDown'].includes(e.key)) { e.preventDefault(); return; }
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); tFlip(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); tAnswer(true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); tAnswer(false); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); tUndo(); }
});

// --- Prüfungs-Simulation: gemischte Fragen wie bei der Computerprüfung, je vier Antworten, Auswertung je Bereich ---
// Aufbau laut Kursunterlagen der Taxischule (Block 1: 34 Adressen, 6 Bilder, 15 Routen; Block 2: je 9 Fragen aus
// Betriebsordnung, Tarif, StVO, KFG und Arbeits-/Sozialrecht), in jedem Bereich rund zwei Drittel richtig zum Bestehen.
// Die Prüfungskommission kann davon abweichen. „Kurztest“: weniger Fragen je Bereich, gleiche Schwelle (zwei Drittel).
const PBEREICHE = [
  { key: 'adr', name: 'Adressen', n: 34, min: 23, kurz: 10 },
  { key: 'bild', name: 'Bilder', n: 6, min: 4, kurz: 3 },
  { key: 'route', name: 'Routen', n: 15, min: 10, kurz: 5 },
  ...THEORIE.slice(0, 5).map((k, i) => ({ key: 't' + i, kap: i, name: k.name, n: 9, min: 6, kurz: 3 })),
];
const PSET_KEY = 'taxi-pruefung-auswahl-v1', PRUN_KEY = 'taxi-pruefung-lauf-v1', PHIST_KEY = 'taxi-pruefung-verlauf-v1';
let pset = Object.assign({ bereiche: PBEREICHE.map(b => b.key), kurz: false, sofort: false }, kLoad(PSET_KEY, {}));
pset.bereiche = (Array.isArray(pset.bereiche) ? pset.bereiche : []).filter(k => PBEREICHE.some(b => b.key === k));
let prun = kLoad(PRUN_KEY, null), phist = kLoad(PHIST_KEY, []);
let ptimer = null, pweiter = null, pfehler = false;
const pAnzahl = b => pset.kurz ? b.kurz : b.n, pMin = (b, n) => n === b.n ? b.min : Math.ceil(n * 2 / 3);
const fmtAdr = a => a.replace(/^(\d+(?:\.\/\d+)?)\.,\s*/, '$1. Bezirk, ');
// n verschiedene zufällige Elemente
const pZiehe = (arr, n) => shuffle(arr.slice()).slice(0, n);

// Fragen eines Bereichs erzeugen: { b: Bereich, frage, sub (kleine Zeile), opts, ok (Index der richtigen), bild? }
function pFragen(b, n) {
  if (b.key === 'adr') {
    const pool = KARTEN_ALL.filter(c => KARTEN[c.kat].teil === 1 && !isSeq(c));
    return pZiehe(pool, n).map(c => {
      // falsche Adressen bevorzugt aus derselben Kategorie (Hotel zu Hotel, Krankenhaus zu Krankenhaus)
      const gleich = shuffle(pool.filter(x => x.kat === c.kat && x.adr !== c.adr)), rest = shuffle(pool.filter(x => x.kat !== c.kat));
      const falsch = [...new Set(gleich.concat(rest).map(x => fmtAdr(x.adr)))].filter(a => a !== fmtAdr(c.adr)).slice(0, 3);
      const opts = shuffle([fmtAdr(c.adr), ...falsch]);
      return { b: b.key, sub: KARTEN[c.kat].name, frage: `Wo befindet sich: ${c.name}?`, opts, ok: opts.indexOf(fmtAdr(c.adr)) };
    });
  }
  if (b.key === 'bild') return pZiehe(BILDER, n).map(x => {
    const opts = bOptions(x.name);
    return { b: b.key, sub: 'Sehenswürdigkeiten', frage: 'Wie heißt diese Sehenswürdigkeit?', bild: x.name, opts, ok: opts.indexOf(x.name) };
  });
  if (b.key === 'route') return pZiehe(ROUTES, n).map(r => {
    const ch = makeChoices(r, POOL, 4), opts = ch.map(c => c.steps.map(stepName).join(' – '));
    return { b: b.key, sub: `Route ${r.n} · ${CHAPTERS[r.chap].name}`, frage: `Von ${r.from} nach ${r.to}: Welche Fahrtroute ist richtig?`, opts, ok: ch.findIndex(c => c.correct) };
  });
  return pZiehe(THEORIE[b.kap].fragen, n).map(q => {
    const opts = shuffle([q.richtig, ...q.falsch]);
    return { b: b.key, sub: `${THEORIE[b.kap].nr}. ${THEORIE[b.kap].name}`, frage: q.frage, opts, ok: opts.indexOf(q.richtig) };
  });
}
function pStart() {
  const bs = PBEREICHE.filter(b => pset.bereiche.includes(b.key));
  if (!bs.length) return;
  // Reihenfolge wie bei der Prüfung: Bereich für Bereich
  const qs = bs.flatMap(b => pFragen(b, pAnzahl(b)));
  prun = { qs, i: 0, pick: qs.map(() => null), versuche: {}, start: Date.now(), ende: null, kurz: !!pset.kurz };
  pfehler = false; kSave(PRUN_KEY, prun); drawPruefung(); renderPruefungPanel();
}
// „Lösung sofort“ gilt sofort, auch mitten in der Prüfung (pset.sofort, nicht beim Start festgelegt).
// Mit Lösung: richtig → grün und weiter; falsch → blinkt zweimal rot und man versucht es nochmal, bis es stimmt.
// Gewertet wird immer die erste Antwort (pick); weitere Versuche stehen in versuche[i].
const pGeloest = i => prun.pick[i] != null && (prun.pick[i] === prun.qs[i].ok || (prun.versuche[i] || []).includes(prun.qs[i].ok));
const pFalschVersucht = i => [prun.pick[i], ...(prun.versuche[i] || [])].filter(k => k != null && k !== prun.qs[i].ok);
let pblink = null;
function pAnswer(k) {
  if (!prun || prun.ende || prun.i >= prun.qs.length) return;
  const i = prun.i, q = prun.qs[i];
  if (k < 0 || k >= q.opts.length) return;
  if (!prun.versuche) prun.versuche = {};
  clearTimeout(pweiter);
  if (pset.sofort) {
    if (pGeloest(i) || pFalschVersucht(i).includes(k)) return;
    if (prun.pick[i] == null) prun.pick[i] = k; else (prun.versuche[i] = prun.versuche[i] || []).push(k);
    kSave(PRUN_KEY, prun);
    if (k === q.ok) { sfx('ok'); drawPruefung(); pweiter = setTimeout(() => { if (state.mode === 'pruefung' && prun && prun.i === i) pGo(1); }, 1200); }
    else { sfx('wrong'); pblink = k; drawPruefung(); pblink = null; }
    return;
  }
  // wie in der Prüfung: kein Richtig/Falsch, die Wahl wird gelb und es geht weiter (änderbar beim Zurückblättern)
  prun.pick[i] = k; kSave(PRUN_KEY, prun);
  sfx('umdrehen'); drawPruefung(); pweiter = setTimeout(() => { if (state.mode === 'pruefung' && prun && prun.i === i) pGo(1); }, 320);
}
function pGo(d) {
  if (!prun || prun.ende) return;
  clearTimeout(pweiter);
  prun.i = Math.max(0, Math.min(prun.qs.length, prun.i + d)); kSave(PRUN_KEY, prun); drawPruefung();
}
function pAbgeben() {
  if (!prun || prun.ende) return;
  clearTimeout(pweiter);
  prun.ende = Date.now(); prun.i = prun.qs.length;
  const erg = pErgebnis();
  phist = [{ t: prun.ende, ok: erg.bestanden, r: erg.richtig, n: prun.qs.length, kurz: prun.kurz }].concat(phist).slice(0, 10);
  kSave(PHIST_KEY, phist); kSave(PRUN_KEY, prun);
  sfx(erg.bestanden ? 'goal' : 'wrong'); drawPruefung(); renderPruefungPanel();
}
function pErgebnis() {
  const rows = PBEREICHE.map(b => {
    const idx = prun.qs.map((q, i) => i).filter(i => prun.qs[i].b === b.key);
    if (!idx.length) return null;
    const r = idx.filter(i => prun.pick[i] === prun.qs[i].ok).length, min = pMin(b, idx.length);
    return { b, n: idx.length, r, min, ok: r >= min };
  }).filter(Boolean);
  return { rows, bestanden: rows.every(x => x.ok), richtig: rows.reduce((s, x) => s + x.r, 0) };
}
const pZeit = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function drawPruefung() {
  const box = $('#cards'); box.innerHTML = '';
  clearInterval(ptimer);
  if (!prun || !Array.isArray(prun.qs) || !prun.qs.length) {
    const stage = el('div', 'fc-stage'), e = el('div', 'fc-end'); stage.append(e); box.append(stage);
    const bs = PBEREICHE.filter(b => pset.bereiche.includes(b.key)), n = bs.reduce((s, b) => s + pAnzahl(b), 0);
    e.append(el('small', '', 'Prüfungs-Simulation'), el('b', '', pset.kurz ? 'Kurztest' : 'Computerprüfung'),
      el('span', '', n ? `${n} Fragen mit je vier Antworten – genau eine stimmt. In jedem Bereich musst du rund zwei Drittel richtig haben.` : 'Wähle links mindestens einen Bereich.'));
    if (n) { const row = el('div', 'fc-endbtns'), b = el('button', 'btn primary', 'Prüfung starten'); b.type = 'button'; b.onclick = pStart; row.append(b); e.append(row); }
    return;
  }
  const n = prun.qs.length, beantwortet = prun.pick.filter(x => x != null).length;
  const top = el('div', 'fc-top');
  const prog = el('div', 'fc-prog'), bar = el('i'); bar.style.width = (100 * beantwortet / n) + '%'; prog.append(bar);
  const cnt = el('div', 'fc-cnt'), uhr = el('span', 'fc-pos');
  const zeigeZeit = () => { uhr.textContent = `${Math.min(prun.i + 1, n)} / ${n} · ${pZeit((prun.ende || Date.now()) - prun.start)}`; };
  zeigeZeit();
  cnt.append(el('span', '', ''), uhr, el('span', '', ''));
  top.append(prog, cnt); box.append(top);
  if (prun.ende) return pErgebnisZeigen(box);
  ptimer = setInterval(() => { if (state.mode !== 'pruefung' || !document.body.contains(uhr)) { clearInterval(ptimer); return; } zeigeZeit(); }, 1000);
  if (prun.i >= n) {
    // Ende erreicht: abgeben oder zu offenen Fragen zurück
    const stage = el('div', 'fc-stage'), e = el('div', 'fc-end'), offen = prun.pick.map((x, i) => x == null ? i : -1).filter(i => i >= 0);
    e.append(el('small', '', 'Alle Fragen durch'), el('b', '', offen.length ? `${offen.length} ${offen.length === 1 ? 'Frage' : 'Fragen'} offen` : 'Fertig?'),
      el('span', '', offen.length ? 'Offene Fragen zählen als falsch.' : 'Du kannst noch zurückblättern oder jetzt abgeben.'));
    const row = el('div', 'fc-endbtns');
    const ab = el('button', 'btn primary', 'Prüfung abgeben'); ab.type = 'button'; ab.onclick = pAbgeben; row.append(ab);
    if (offen.length) { const z = el('button', 'btn', 'Zu den offenen Fragen'); z.type = 'button'; z.onclick = () => { prun.i = offen[0]; drawPruefung(); }; row.append(z); }
    else { const z = el('button', 'btn', '‹ Zurückblättern'); z.type = 'button'; z.onclick = () => pGo(-1); row.append(z); }
    e.append(row); stage.append(e); box.append(stage); return;
  }
  const q = prun.qs[prun.i], pick = prun.pick[prun.i], sofort = pset.sofort, geloest = sofort && pGeloest(prun.i), versucht = sofort ? pFalschVersucht(prun.i) : [];
  const wrap = el('div', 'bq ps'), kopf = el('div', 'bq-kopf');
  const rund = (cls, title, svg, fn, aus) => { const x = el('button', 'fc-btn bq-nav ' + cls); x.type = 'button'; x.title = title; x.setAttribute('aria-label', title); x.innerHTML = svg; x.onclick = fn; x.disabled = aus; return x; };
  const zur = rund('zur', 'Vorige Frage (Pfeil links)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>', () => pGo(-1), prun.i === 0);
  const vor = rund('vor', 'Nächste Frage (Pfeil rechts)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>', () => pGo(1), false);
  const bereich = PBEREICHE.find(b => b.key === q.b);
  const mitte = el('p', 'bq-frage ps-sub', `${bereich ? bereich.name : ''} · ${q.sub}`);
  kopf.append(zur, mitte, vor);
  const fig = el('div', 'bq-img');
  if (q.bild && BILD_BY_NAME.has(q.bild)) {
    const bb = BILD_BY_NAME.get(q.bild), img = el('img'); img.src = bb.bild; img.alt = 'Foto einer Sehenswürdigkeit'; img.width = bb.w; img.height = bb.h; img.draggable = false;
    fig.style.setProperty('--r', (bb.w / bb.h).toFixed(4)); fig.append(img);
    wrap.append(kopf, el('p', 'ps-frage-klein', q.frage), fig, fotoCredit(bb));
  } else {
    const karte = el('div', 'ps-karte'); karte.append(el('b', q.frage.length > 120 ? 'lang' : '', q.frage)); fig.classList.add('ps-text'); fig.append(karte);
    wrap.append(kopf, fig);
  }
  const lang = q.opts.some(o => o.length > 42);
  const opts = el('div', 'bq-opts' + (lang ? ' lang' : ''));
  q.opts.forEach((o, k) => {
    const btn = el('button', 'bq-opt'); btn.type = 'button';
    btn.append(el('span', 'bq-nr', String(k + 1)), el('span', '', o));
    if (sofort) {
      if (geloest && k === q.ok) btn.classList.add('ok');
      else if (versucht.includes(k)) btn.classList.add(k === pblink ? 'blink' : 'versucht');
      if (geloest || versucht.includes(k)) btn.disabled = true; else btn.onclick = () => pAnswer(k);
    } else { if (k === pick) btn.classList.add('gewaehlt'); btn.onclick = () => pAnswer(k); }
    opts.append(btn);
  });
  wrap.append(opts); box.append(wrap);
  // jederzeit vorzeitig beenden (offene Fragen zählen als falsch)
  const ende = el('button', 'fc-undo ps-ende', 'Prüfung beenden'); ende.type = 'button';
  ende.onclick = () => { if (confirm('Prüfung jetzt beenden und auswerten? Offene Fragen zählen als falsch.')) pAbgeben(); };
  box.append(ende);
  box.append(el('p', 'fc-keys', 'Tasten 1–4: Antwort · Pfeile: blättern'));
}
function pErgebnisZeigen(box) {
  const erg = pErgebnis(), stage = el('div', 'fc-stage ps-erg'), e = el('div', 'fc-end');
  e.append(el('small', '', `Ergebnis · ${pZeit(prun.ende - prun.start)} Minuten`), el('b', erg.bestanden ? 'ps-ok' : 'ps-nein', erg.bestanden ? 'Bestanden' : 'Nicht bestanden'),
    el('span', '', `${erg.richtig} von ${prun.qs.length} richtig`));
  const tab = el('div', 'ps-tab');
  erg.rows.forEach(x => {
    const row = el('div', 'ps-row' + (x.ok ? ' ok' : ' nein'));
    row.append(el('span', 'ps-name', x.b.name), el('span', 'ps-zahl', `${x.r} / ${x.n}`), el('span', 'ps-min', `ab ${x.min}`), el('span', 'ps-zeichen', x.ok ? '✓' : '✕'));
    tab.append(row);
  });
  e.append(tab);
  const falsch = prun.qs.map((q, i) => i).filter(i => prun.pick[i] !== prun.qs[i].ok);
  const row = el('div', 'fc-endbtns');
  if (falsch.length) { const f = el('button', 'btn', pfehler ? 'Fehler ausblenden' : `Fehler ansehen (${falsch.length})`); f.type = 'button'; f.onclick = () => { pfehler = !pfehler; drawPruefung(); }; row.append(f); }
  const neu = el('button', 'btn primary', 'Neue Prüfung'); neu.type = 'button'; neu.onclick = pStart; row.append(neu);
  e.append(row);
  if (pfehler) {
    const liste = el('div', 'ps-fehler');
    falsch.forEach(i => {
      const q = prun.qs[i], it = el('div', 'ps-f');
      it.append(el('small', '', (PBEREICHE.find(b => b.key === q.b) || {}).name + ' · ' + q.sub), el('b', '', q.frage + (q.bild ? ` (${q.bild})` : '')));
      if (prun.pick[i] != null) it.append(el('span', 'ps-du', 'Deine Antwort: ' + q.opts[prun.pick[i]]));
      else it.append(el('span', 'ps-du', 'Nicht beantwortet'));
      it.append(el('span', 'ps-richtig', 'Richtig: ' + q.opts[q.ok]));
      liste.append(it);
    });
    e.append(liste);
  }
  stage.append(e); box.append(stage);
}
document.addEventListener('keydown', e => {
  if (state.mode !== 'pruefung' || e.metaKey || e.ctrlKey || e.altKey || e.repeat || (e.target instanceof Element && e.target.closest('input, textarea, select'))) return;
  if (/^[1-4]$/.test(e.key)) { e.preventDefault(); pAnswer(+e.key - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); pGo(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); pGo(-1); }
});

// Leiste links: Umfang, Bereiche, sofortige Lösung, Start und die letzten Ergebnisse
function renderPruefung(p) { clearTimeout(pweiter); p.append(el('div', 'kpanel')); renderPruefungPanel(); drawPruefung(); setTimeout(() => map.invalidateSize(), 0); }
function renderPruefungPanel() {
  const p = $('#play .kpanel'); if (!p) return; p.innerHTML = '';
  p.append(el('h2', 'h-title', 'Prüfungs-Simulation'));
  p.append(el('p', 'k-info', 'Wie die Computerprüfung: Block 1 mit Adressen, Bildern und Routen, Block 2 mit der Theorie. Jede Frage hat vier Antworten, eine stimmt. In jedem Bereich brauchst du rund zwei Drittel richtig.'));
  const save = () => kSave(PSET_KEY, pset);
  const laeuft = prun && !prun.ende && Array.isArray(prun.qs) && prun.qs.length;
  const dd = el('label', 'chapdd'), sel = el('select'); sel.setAttribute('aria-label', 'Umfang wählen');
  dd.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>';
  [[false, 'Ganze Prüfung'], [true, 'Kurztest']].forEach(([kurz, name]) => {
    const n = PBEREICHE.filter(b => pset.bereiche.includes(b.key)).reduce((s, b) => s + (kurz ? b.kurz : b.n), 0);
    const o = el('option', '', `${name} · ${n} Fragen`); o.value = kurz ? '1' : '0'; sel.append(o);
  });
  sel.value = pset.kurz ? '1' : '0';
  sel.onchange = () => { pset.kurz = sel.value === '1'; save(); if (!laeuft) drawPruefung(); renderPruefungPanel(); };
  dd.append(sel); dd.insertAdjacentHTML('beforeend', '<svg class="dd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
  p.append(dd);
  const sec = el('div', 'k-sec'), left = el('div', 'k-left'), opts = el('div', 'k-opts');
  const alle = pset.bereiche.length === PBEREICHE.length, ab = el('button', 'k-link' + (alle ? ' all' : pset.bereiche.length ? ' some' : '')); ab.type = 'button';
  ab.title = alle ? 'Alle abwählen' : 'Alle auswählen'; ab.setAttribute('aria-label', ab.title); ab.append(el('span', 'k-box'), 'Alle');
  ab.onclick = () => { pset.bereiche = alle ? [] : PBEREICHE.map(b => b.key); save(); if (!laeuft) drawPruefung(); renderPruefungPanel(); };
  const so = el('button', 'k-tog' + (pset.sofort ? ' on' : ''), 'Lösung sofort'); so.type = 'button'; so.setAttribute('aria-pressed', !!pset.sofort);
  so.title = 'Nach jeder Antwort gleich zeigen, ob sie stimmt (in der echten Prüfung erst am Ende)';
  so.append(el('span', 'k-led')); so.onclick = () => { pset.sofort = !pset.sofort; save(); renderPruefungPanel(); if (prun && !prun.ende) drawPruefung(); };
  opts.append(el('span', 'k-div'), so);
  left.append(el('h3', '', 'Bereiche'), ab); sec.append(left, opts); p.append(sec);
  const list = el('div', 'k-kats');
  PBEREICHE.forEach(b => {
    const on = pset.bereiche.includes(b.key), n = pAnzahl(b);
    const x = el('button', 'k-kat' + (on ? ' on' : '')); x.type = 'button'; x.setAttribute('aria-pressed', on);
    x.append(el('span', 'k-check'), el('span', 'k-name', b.name), el('span', 'k-n', `${n} Fragen · ab ${pMin(b, n)}`));
    x.onclick = () => { pset.bereiche = on ? pset.bereiche.filter(k => k !== b.key) : PBEREICHE.map(y => y.key).filter(k => k === b.key || pset.bereiche.includes(k)); save(); if (!laeuft) drawPruefung(); renderPruefungPanel(); };
    list.append(x);
  });
  p.append(list);
  const foot = el('div', 'k-foot');
  const st = el('button', 'btn primary', laeuft ? 'Neu starten' : 'Prüfung starten'); st.type = 'button';
  st.disabled = !pset.bereiche.length;
  st.onclick = () => { if (laeuft && !confirm('Laufende Prüfung abbrechen und neu starten?')) return; pStart(); };
  foot.append(st);
  if (laeuft) { const abg = el('button', 'btn', 'Jetzt abgeben'); abg.type = 'button'; abg.onclick = () => { if (confirm('Prüfung jetzt abgeben? Offene Fragen zählen als falsch.')) pAbgeben(); }; foot.append(abg); }
  p.append(foot);
  if (phist.length) {
    p.append(el('h3', 'ps-verlauf-t', 'Letzte Ergebnisse'));
    const v = el('div', 'ps-verlauf');
    phist.slice(0, 5).forEach(h => {
      const d = new Date(h.t), row = el('div', 'b-row on ' + (h.ok ? 'ok' : 'nein'));
      row.append(el('span', 'b-dot'), el('span', 'k-name', `${d.toLocaleDateString('de-AT')} · ${h.kurz ? 'Kurztest' : 'Prüfung'} · ${h.r}/${h.n} – ${h.ok ? 'bestanden' : 'nicht bestanden'}`));
      v.append(row);
    });
    p.append(v);
  }
  p.append(el('p', 'k-src', 'Aufbau der Computerprüfung laut Kursunterlagen; die Prüfungskommission kann davon abweichen. Fragen aus dem WKO-Fragenkatalog 2026.'));
}
