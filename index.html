<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaxiLernen Wien</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: große abgerundete Karte links (mit schwebenden Glas-Knöpfen), helle Leiste rechts; am Handy Karte oben, Leiste darunter */
:root {
  --page: #0e0e0e; --panel: rgba(250, 216, 96, .96); --on-panel: #141414; --on-panel-muted: rgba(20, 20, 20, .62); --card: #fbf8f0; --fg: #141414; --muted: #8a8984; --line: #dcdad4; --soft: #f1ede2;
  --dark: #151515; --dark-fg: #f4f3ef; --dark-muted: #9a9993;
  --acc: #f7c831; --acc-ink: #1a1a1a;
  --route: #1d3fbf; --route-ink: #fff; --warn: #ff6a00;
  --good: #1f8a45; --good-bg: #e2f3e8; --bad: #d23b2f; --bad-bg: #fbe5e2;
  --glass: rgba(28, 28, 28, .46); --glass-line: rgba(255, 255, 255, .22);
  --font: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --r: 30px; --gap: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0e0e0e; --card: #232325; --fg: #f2f1ed; --muted: #9b9a95; --line: #333335; --soft: #2b2b2e;
  --dark: #0f0f10; --good: #6fd08d; --good-bg: #1d3324; --bad: #ff8a80; --bad-bg: #3a1f1c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0e0e0e; --card: #232325; --fg: #f2f1ed; --muted: #9b9a95; --line: #333335; --soft: #2b2b2e;
  --dark: #0f0f10; --good: #6fd08d; --good-bg: #1d3324; --bad: #ff8a80; --bad-bg: #3a1f1c; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--fg); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: minmax(360px, 440px) 1fr; gap: var(--gap); padding: var(--gap); }
/* Menü links, Karte rechts (am Handy gilt die Reihenfolge weiter unten: Karte oben) */
.panel { grid-column: 1; grid-row: 1; }
.mapwrap { grid-column: 2; grid-row: 1; }

/* --- Karte --- */
.mapwrap { position: relative; border-radius: var(--r); overflow: hidden; background: #e7e5df; min-height: 0; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
#map { position: absolute; inset: 0; background: #e7e5df; }
#map { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.svpop .leaflet-popup-content-wrapper { padding: 0; border-radius: 999px; background: #141414; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.svpop .leaflet-popup-content { margin: 0; }
.svpop .leaflet-popup-tip { background: #141414; }
.svbtn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px 9px 12px; color: var(--acc) !important; font: 500 .95rem var(--font); text-decoration: none; white-space: nowrap; }
.svbtn svg { width: 18px; height: 18px; }
.leaflet-container { background: #e7e5df; font-family: var(--font); }
.maphead { position: absolute; left: 30px; top: 26px; z-index: 1002; color: #141414; pointer-events: none; max-width: 40%; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 1.5rem; letter-spacing: -.01em; }
.logo { font: 700 .95rem/1 var(--font); letter-spacing: .1em; background: var(--acc); color: var(--acc-ink); padding: 8px 11px; border-radius: 9px; white-space: nowrap; }
.maphead h1 { font-weight: 500; font-size: 1.75rem; letter-spacing: -.02em; margin: 30px 0 4px; }
.maphead p { margin: 0; font-size: .95rem; opacity: .9; }
.maphead { text-shadow: 0 0 2px #fff, 0 0 6px #fff, 0 0 12px rgba(255,255,255,.9); }
.logo { text-shadow: none; }
.tabs { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 1002; display: flex; gap: 8px; }
.gbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--glass-line); background: var(--glass); color: #fff; cursor: pointer; padding: 0; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); transition: background .2s, transform .15s; position: relative; }
.gbtn:hover { background: rgba(28,28,28,.62); }
.gbtn:active { transform: scale(.94); }
.gbtn svg { width: 20px; height: 20px; }
.tab.on { background: #fff; color: #141414; border-color: #fff; }
.tab.on::after { content: ""; position: absolute; bottom: -9px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #fff; }
.mapctl { position: absolute; right: 22px; bottom: 34px; z-index: 1002; display: flex; flex-direction: column; gap: 10px; }
#quest { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 1002; width: min(460px, calc(100% - 32px)); box-sizing: border-box; padding: 9px 10px 9px 16px; border-radius: 18px; background: color-mix(in srgb, var(--acc) 72%, transparent); -webkit-backdrop-filter: blur(6px) saturate(1.2); backdrop-filter: blur(6px) saturate(1.2); color: #141414; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 1px; align-items: center; text-align: left; box-shadow: 0 6px 18px rgba(0,0,0,.18); animation: ffin .3s ease-out; pointer-events: none; }
#quest[hidden] { display: none; }
#chapflash { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1003; pointer-events: none; display: grid; gap: 2px; text-align: center; padding: 22px 38px 20px; border-radius: 26px; background: color-mix(in srgb, var(--acc) 88%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #141414; box-shadow: 0 14px 40px rgba(0,0,0,.25); animation: chapin .45s cubic-bezier(.2,.8,.2,1); transition: opacity .45s, transform .45s; }
#chapflash small { font-size: 1rem; font-weight: 500; opacity: .7; letter-spacing: .04em; }
#chapflash b { font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
#chapflash span { font-size: .9rem; opacity: .75; }
#chapflash.out { opacity: 0; transform: translate(-50%, -50%) scale(.96); }
@keyframes chapin { from { opacity: 0; transform: translate(-50%, -50%) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
body.questing .maphead p { visibility: hidden; }
#quest small { grid-column: 1; color: rgba(20,20,20,.62); font-size: .74rem; font-weight: 500; letter-spacing: .02em; }
#quest b { grid-column: 1; font-weight: 600; font-size: 1rem; line-height: 1.2; }
#quest .qmsg { grid-column: 1; font-size: .8rem; opacity: .85; line-height: 1.3; }
#quest.bad .qmsg { color: #a3241a; opacity: 1; font-weight: 500; }
#quest .qskip { grid-column: 2; grid-row: 1 / span 3; pointer-events: auto; border: 0; border-radius: 999px; padding: 7px 14px; background: #141414; color: var(--acc); font: inherit; font-size: .8rem; font-weight: 500; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.18); transition: transform .12s; }
#quest .qskip:hover { background: #2a2a2a; }
#quest .qskip:active { transform: scale(.95); }
#ffwd { position: absolute; left: 50%; bottom: 82px; transform: translateX(-50%); z-index: 1002; display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px 10px 14px; border: 0; border-radius: 999px; background: #141414; color: var(--acc); font: 500 .95rem var(--font); cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: ffin .25s ease-out; }
#ffwd[hidden] { display: none; }
#ffwd svg { width: 18px; height: 18px; }
#ffwd:active { transform: translateX(-50%) scale(.95); }
@keyframes ffin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translateX(-50%); } }
.geo-pill { position: absolute; left: 22px; bottom: 26px; z-index: 1002; max-width: 46%; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); color: #fff; font-size: .85rem; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.geo-pill { transition: opacity .6s; }
.geo-pill.done { opacity: 0; pointer-events: none; }
.geo-pill svg { flex: none; width: 18px; height: 18px; opacity: .85; }
#geo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#geo.bad { color: #ffb4ac; }
.leaflet-top.leaflet-right { top: 14px; right: 14px; }
.leaflet-control-attribution { font-size: 10px; border-radius: 8px 0 0 0; }

.status { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
/* --- Leiste rechts --- */
.panel { background: var(--panel); color: var(--on-panel); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.chapdd, .iconbtn, .card, .chip, .btn, .opt, .pillbtn, .notice, .status { color: var(--fg); }
.topbar { display: flex; gap: 10px; align-items: center; }
.chapdd { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 999px; padding: 0 16px; height: 48px; cursor: pointer; }
.chapdd svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.chapdd select { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: .95rem; font-weight: 500; -webkit-appearance: none; appearance: none; padding-right: 26px; cursor: pointer; text-overflow: ellipsis; }
.chapdd .dd-chev { position: absolute; right: 16px; pointer-events: none; color: var(--fg); }
.chapdd:focus-within { box-shadow: 0 0 0 2px #141414; }
.iconbtn { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:hover { box-shadow: inset 0 0 0 1px var(--line); }
.scroll { overflow-y: auto; padding: 28px 22px 26px; display: flex; flex-direction: column; gap: 16px; min-height: 0; flex: 1; }
.rbtn:focus-visible, .btn:focus-visible, .opt:focus-visible, .rt:focus-visible, .gbtn:focus-visible, .iconbtn:focus-visible, .pillbtn:focus-visible { outline: 2px solid #141414; outline-offset: 2px; }
#stage { display: flex; flex-direction: column; gap: 16px; }
#head { display: flex; flex-direction: column; gap: 14px; }
.h-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.h-left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
/* Knöpfe unter der Strecke: rotes ✕ links, ↻ ▲ ▼ rechts (vom Nutzer so gewünscht) */
.h-nav { flex: none; display: flex; gap: 8px; align-self: stretch; justify-content: flex-end; }
.h-nav .rbtn.zu { margin-right: auto; }
/* auf einer Linie mit dem Kapitel-Schild (unten in der Titelzeile) */
.flink.h-melden { align-self: flex-end; margin-bottom: 3px; text-align: right; }
.rbtn { width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; background: #141414; color: var(--acc); display: grid; place-items: center; cursor: pointer; transition: transform .15s; }
.rbtn:hover { transform: translateY(-1px); }
.rbtn:active { transform: scale(.94); }
.rbtn svg { width: 22px; height: 22px; }
.rbtn.zu { background: #e5484d; color: #fff; }
.h-title { font-weight: 500; font-size: 2rem; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
.h-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-weight: 500; font-size: .85rem; padding: 4px 11px; border-radius: 999px; background: #141414; color: #fff; }
.badge.soft { background: rgba(255,255,255,.55); color: #141414; }
.card { background: var(--card); border-radius: 26px; padding: 18px 20px; }
.card.lern { display: flex; flex-direction: column; gap: 14px; }
.card.lern .btn:not(.primary):not(.nav-b) { background: var(--soft); }
.tl-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.tl-top > span:first-child { color: var(--muted); font-size: 1.05rem; }
.tl-kat { flex: 1; min-width: 0; text-align: center; color: var(--muted); opacity: .55; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-line { position: relative; display: flex; align-items: center; justify-content: space-between; height: 40px; }
.tl-line::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 2px solid var(--acc); }
.tl-line i { position: relative; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--acc); background: var(--card); }
.tl-mid { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; box-shadow: 0 0 0 6px var(--card); }
.tl-mid svg { width: 20px; height: 20px; }
.tl-via { text-align: center; color: var(--muted); font-size: .88rem; margin-top: 2px; text-wrap: balance; }
.tl-hint { color: var(--muted); font-size: .8rem; line-height: 1.35; margin-top: 8px; text-wrap: pretty; }
.tl-names { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; font-size: .95rem; line-height: 1.25; }
.tl-names span { text-wrap: balance; justify-self: start; background: #141414; color: var(--acc); border-radius: 14px; padding: 6px 12px; font-weight: 500; }
.tl-names span:last-child { justify-self: end; text-align: right; }
.hint { margin: 0; color: var(--on-panel-muted); }
.card .hint { color: var(--muted); }
#score:empty { display: none; }
#score { align-self: flex-start; font-weight: 500; font-size: .85rem; color: var(--bad); background: var(--bad-bg); padding: 4px 12px; border-radius: 999px; }
#play { display: flex; flex-direction: column; gap: 12px; }
#play:empty { display: none; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--card); font-weight: 500; font-size: .92rem; }
.chip small { font-size: .74rem; color: var(--muted); font-weight: 400; }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.dest { background: var(--acc); color: var(--acc-ink); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; }
.chain:empty { display: none; }
.chain .chip:not(:last-child)::after { content: "›"; margin-left: 4px; color: var(--muted); }
.chain.small .chip { font-size: .82rem; padding: 3px 9px; }

/* Schritte als Zeitleiste */
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; counter-reset: s; }
ol.steps li { position: relative; display: flex; align-items: center; gap: 12px; padding: 5px 0; cursor: pointer; counter-increment: s; }
ol.steps li::before { content: counter(s); flex: none; position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 600; background: var(--card); border: 2px solid var(--line); color: var(--muted); }
ol.steps li:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 50%; height: 100%; border-left: 2px solid var(--line); }
ol.steps li .chip { background: none; padding: 2px 0; font-size: .98rem; }
ol.steps li.past::before { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
ol.steps li.past::after { border-color: var(--acc); }
ol.steps li.next::before { border-style: dashed; border-color: var(--fg); color: var(--fg); }
ol.steps li.now::before { background: var(--fg); border-color: var(--fg); color: var(--card); }
ol.steps li.now .chip { font-weight: 600; }
ol.steps li.dest::before { content: "★"; background: var(--fg); border-color: var(--fg); color: var(--card); }
ol.steps li.dest .chip { background: var(--acc); color: var(--acc-ink); padding: 4px 12px; }

.notice { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; background: var(--bad-bg); font-size: .9rem; }
.notice strong { color: var(--bad); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-weight: 500; font-size: .92rem; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--soft); cursor: pointer; }
.btn:hover { box-shadow: inset 0 0 0 1px var(--line); }
.btn.primary { background: var(--fg); color: var(--card); }
.btn:disabled { opacity: .4; cursor: default; }
.playbtn { display: inline-flex; align-items: center; gap: 8px; }
.btn > svg:only-child { width: 18px; height: 18px; display: block; margin: 0 auto; }
.rnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar.row3 { flex-wrap: nowrap; }
.bar.row3 .btn { flex: 1 1 0; min-width: 0; padding: 10px 8px; justify-content: center; white-space: nowrap; }
.btn.playbtn { background: #141414; color: var(--acc); }
.nav-b { width: 38px; height: 38px; padding: 0 0 3px; font-size: 1.3rem; line-height: 1; background: var(--acc); color: #141414; font-weight: 600; }
.nav-b:hover { box-shadow: inset 0 0 0 1.5px #141414; }
.nav-t { font-size: 1rem; font-weight: 600; letter-spacing: .01em; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { padding: 14px 16px; border: 0; border-radius: 20px; background: var(--card); cursor: pointer; text-align: left; }
.opt .chip { background: none; padding: 0; font-size: 1rem; }
.opt:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.opt.no { background: var(--bad-bg); color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.result { margin: 0; padding: 14px 16px; border-radius: 20px; display: flex; flex-direction: column; gap: 4px; }
.result.good { background: var(--good-bg); color: var(--good); }
.result.bad { background: var(--bad-bg); color: var(--bad); }
.feedback { margin: 0; color: var(--bad); font-weight: 500; }
.feedback:empty { display: none; }

/* Routenliste: dunkle Karten */
.sec { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.sec h3 { margin: 0; font-weight: 500; font-size: 1.4rem; letter-spacing: -.01em; }
.sec h3 small { font-size: .85rem; color: var(--on-panel-muted); font-weight: 400; margin-left: 4px; }
.pillbtn { border: 0; background: var(--card); border-radius: 999px; padding: 9px 16px; font-size: .88rem; cursor: pointer; }
.pillbtn:hover { box-shadow: inset 0 0 0 1px var(--line); }
#routes { display: flex; flex-direction: column; gap: 8px; }
.chap-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .85rem; color: var(--on-panel-muted); padding: 10px 6px 0; }
.chap-h b { font-weight: 600; color: var(--on-panel); }
.rt { display: grid; grid-template-columns: 52px 1fr; gap: 4px 12px; align-items: center; text-align: left; padding: 14px 18px 14px 16px; border: 0; border-radius: 24px; background: var(--dark); color: var(--dark-fg); cursor: pointer; position: relative; overflow: hidden; }
.rt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 74px; opacity: .13; background:
  linear-gradient(115deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 34px 30px,
  linear-gradient(25deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 26px 38px;
  -webkit-mask: linear-gradient(90deg, #000 40%, transparent); mask: linear-gradient(90deg, #000 40%, transparent); }
.rt:hover { background: #242424; }
.rt.on { box-shadow: 0 0 0 3px #fff; }
.rt-n { position: relative; font-weight: 500; font-size: 1.4rem; letter-spacing: -.02em; }
.rt-body { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rt-line { position: relative; display: flex; align-items: center; justify-content: space-between; height: 22px; }
.rt-line::before { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; border-top: 1.5px solid var(--acc); }
.rt-line > i { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--acc); }
.rt-mid { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--dark); font-size: .78rem; color: var(--dark-muted); }
.rt:hover .rt-mid { background: #242424; }
.rt-lv { display: inline-flex; gap: 3px; }
.rt-lv i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--dark-muted); }
.rt-lv i.f { background: var(--acc); border-color: var(--acc); }
.rt-names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: .9rem; line-height: 1.2; }
.rt-names span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rt-to { text-align: right; }
.empty { color: var(--on-panel-muted); text-align: center; padding: 20px 0; margin: 0; }
.foot { font-size: .78rem; color: var(--on-panel-muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
.foot-btns { display: flex; gap: 6px 14px; flex-wrap: wrap; }
/* Impressum und Datenschutz: Dialog über allem */
#rechtliches { width: min(640px, calc(100vw - 32px)); max-height: min(82vh, 820px); padding: 0; border: 0; border-radius: 24px; background: var(--card); color: var(--fg); box-shadow: 0 24px 60px rgba(0,0,0,.35); font: inherit; }
#rechtliches[open] { display: flex; flex-direction: column; }
#rechtliches::backdrop { background: rgba(20,20,20,.55); }
.r-kopf { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 12px; font-size: 1.05rem; border-bottom: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
.r-zu { width: 36px; height: 36px; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); font-size: 1rem; cursor: pointer; }
.r-body { overflow-y: auto; padding: 6px 22px 22px; font-size: .92rem; line-height: 1.5; }
.r-body h3 { margin: 18px 0 6px; font-size: 1.1rem; }
.r-body p { margin: 0 0 10px; }
.r-body a { color: inherit; }
.r-liste { margin: 0 0 12px; padding-left: 1.2em; display: grid; gap: 4px; }
.r-platz { background: var(--acc); color: #141414; padding: 0 5px; border-radius: 5px; font-weight: 600; }
.flink { justify-self: start; align-self: flex-start; border: 0; background: none; padding: 2px 0; font: inherit; font-size: .82rem; color: var(--on-panel-muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.flink:hover { color: var(--on-panel); }
.fc-melden { align-self: center; margin-top: 6px; color: rgba(242,241,237,.55); }
.fc-melden:hover { color: #f2f1ed; }
.foot button { border: 0; background: none; color: var(--on-panel-muted); text-decoration: underline; font-size: inherit; cursor: pointer; padding: 0; }

/* Filter (Leaflet-Steuerung oben rechts) */
.filterctl { font: 14px var(--font); color: #141414; display: flex; flex-direction: column; align-items: flex-end; }
.fbtn b { position: absolute; top: -3px; right: -3px; background: var(--acc); color: var(--acc-ink); border-radius: 9px; min-width: 18px; padding: 0 5px; font-size: 11px; line-height: 18px; text-align: center; }
.fbtn b:empty { display: none; }
.fpanel { margin-top: 8px; background: #fff; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,.25); padding: 8px; width: 280px; display: flex; flex-direction: column; }
.frow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; cursor: pointer; }
.frow:hover { background: #f3f2ee; }
.frow input { width: 18px; height: 18px; accent-color: #141414; margin: 0; }
.fl { display: block; font-weight: 500; }
.fs { display: block; font-size: 12px; color: #8a8984; }
.fst { font-size: 11px; color: #d23b2f; white-space: nowrap; }
.leaflet-top.leaflet-right { z-index: 1003; }
.fpanel { max-height: min(72vh, 600px); overflow-y: auto; }
@media (max-width: 760px) { .fpanel { max-height: calc(56dvh - 84px); } }
.fhead { font-weight: 500; font-size: 15px; padding: 8px 10px 4px; }
.fsound { width: 100%; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; border-top: 1px solid #ece8dc; border-radius: 0 0 14px 14px; margin-top: 4px; }
.fico { display: grid; place-items: center; width: 18px; height: 18px; }
.fico svg { width: 20px; height: 20px; }
.fchev { width: 18px; height: 18px; transition: transform .2s; }
.fsound[aria-expanded="true"] .fchev { transform: rotate(180deg); }
.fsub { background: #f7f4ec; border-radius: 14px; margin: 0 4px 4px; }
.fsub[hidden] { display: none; }
.fvoice { cursor: default; }
.fseg { display: inline-flex; background: #f1ede2; border-radius: 999px; padding: 3px; gap: 2px; }
.fseg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; color: #141414; cursor: pointer; }
.fseg button.on { background: #141414; color: var(--acc); }
.bez { display: inline-block; font: 600 12px var(--font); letter-spacing: .04em; text-transform: uppercase; color: #5b4b8a; background: rgba(255,255,255,.8); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }

/* Marker, Pfeile, Schilder auf der Karte */
.leaflet-marker-icon.arrow { background: none; border: 0; }
.arrow svg { display: block; transform-origin: 50% 50%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.arrow .pass { display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--route); border: 2px solid #fff; opacity: .9; }
.arrow .blink { display: block; width: 30px; height: 30px; border-radius: 50%; background: var(--warn); border: 3px solid #fff; animation: blink .5s ease-in-out 5 alternate; }
@keyframes blink { from { opacity: 1; transform: scale(1); } to { opacity: .15; transform: scale(.6); } }
.leaflet-tooltip.headlabel { background: var(--route); color: var(--route-ink); border: 0; border-radius: 999px; font: 600 13px var(--font); padding: 3px 10px; box-shadow: 0 2px 6px rgba(0,0,0,.3); opacity: .95 !important; }
.leaflet-tooltip.headlabel::before { display: none; }
.leaflet-tooltip { font-family: var(--font); border-radius: 10px; }
.skiplabel { position: absolute; transform: translate(-50%, -150%); background: var(--bad); color: #fff; font: 600 13px var(--font); padding: 3px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: opacity .5s ease; }
.fade .skiplabel { opacity: 0; }
/* richtige Straße: grüner Ring mit Häkchen */
.okpulse { position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #2bb673; color: #fff; box-shadow: 0 0 0 0 rgba(43,182,115,.55); animation: okpop .85s ease-out forwards; }
.okpulse svg { width: 18px; height: 18px; }
@keyframes okpop { 0% { transform: scale(.3); opacity: 0; box-shadow: 0 0 0 0 rgba(43,182,115,.55); } 25% { transform: scale(1.08); opacity: 1; } 40% { transform: scale(1); } 75% { opacity: 1; box-shadow: 0 0 0 16px rgba(43,182,115,0); } 100% { transform: scale(.85); opacity: 0; box-shadow: 0 0 0 16px rgba(43,182,115,0); } }
/* Ziel erreicht: Ergebnis-Karte über dem Ziel */
.resultcard { position: absolute; left: 0; bottom: 64px; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; padding: 14px 14px 14px 20px; border-radius: 24px; background: color-mix(in srgb, var(--acc) 78%, transparent); -webkit-backdrop-filter: blur(8px) saturate(1.2); backdrop-filter: blur(8px) saturate(1.2); color: #141414; box-shadow: 0 10px 28px rgba(0,0,0,.22); white-space: nowrap; font-family: var(--font); cursor: default; animation: rcin .45s cubic-bezier(.2,.8,.2,1); }
.resultcard::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; margin-left: -7px; background: color-mix(in srgb, var(--acc) 78%, transparent); transform: rotate(45deg); border-radius: 3px; clip-path: polygon(100% 0, 100% 100%, 0 100%); } /* nur die untere Spitze, sonst doppelt getönt */
.rs-text { display: flex; flex-direction: column; gap: 6px; }
.rs-k { font-size: .78rem; font-weight: 500; color: rgba(20,20,20,.65); margin-bottom: -4px; }
.rs-h { font-size: 1.05rem; font-weight: 600; white-space: normal; max-width: 250px; line-height: 1.2; }
.rs-row { display: flex; gap: 14px; font-size: .95rem; }
.rs-row > span { display: inline-flex; align-items: center; gap: 6px; }
.rs-row i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; color: #fff; }
.rs-ok i { background: #1f8a45; }
.rs-bad i { background: #d23b2f; }
.rs-row b { font-size: 1.15rem; font-weight: 700; }
.resultcard small { font-size: .78rem; color: rgba(20,20,20,.65); }
.rs-next, .rs-redo { flex: none; }
.rs-redo + .rs-next { margin-left: -10px; }
.rs-close { position: absolute; top: -9px; right: -9px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: #fff; color: #141414; display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.3); z-index: 1; }
.rs-close svg { width: 13px; height: 13px; }
.rs-close:hover { background: #141414; color: var(--acc); }
@keyframes rcin { from { opacity: 0; transform: translateX(-50%) translateY(12px) scale(.92); } to { opacity: 1; transform: translateX(-50%); } }
/* Ziel erreicht: Konfetti */
.confetti { position: absolute; left: 0; top: 0; pointer-events: none; }
.confetti i { position: absolute; left: -3px; top: -5px; width: 7px; height: 11px; border-radius: 2px; background: var(--c); box-shadow: 0 0 0 .5px rgba(0,0,0,.18); opacity: 0; animation: confetti 1.6s cubic-bezier(.2,.7,.3,1) var(--d) forwards; }
@keyframes confetti {
  0% { transform: translate(0, 0) rotate(0) scale(.5); opacity: 1; }
  45% { transform: translate(calc(var(--x) * .8), var(--y)) rotate(calc(var(--r) * .5)) scale(1); opacity: 1; }
  100% { transform: translate(var(--x), calc(var(--y) + 70px)) rotate(var(--r)) scale(.9); opacity: 0; } }
.pinmarker { overflow: visible; }
.pinwrap { position: relative; display: block; width: 0; height: 0; }
.pindot { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.pindot.start { background: var(--acc); }
.pindot.goal { background: #141414; }
.pinstem { position: absolute; left: 0; top: -1px; height: 2px; background: rgba(20,20,20,.75); transform-origin: 0 50%; }
.pinwrap .pin { position: absolute; transform: translate(-50%, -50%); cursor: pointer; }
.pin { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 3px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.3); white-space: nowrap; font: 600 10px/1 var(--font); letter-spacing: .08em; }
.pin.start { background: #fff; color: #141414; }
.pin.goal { background: #141414; color: #fff; }
.pinredo { display: inline-flex; align-items: center; gap: 4px; margin: -1px -6px -1px 4px; padding: 5px 9px 5px 7px; border-radius: 999px; background: var(--acc); color: #141414; font: 600 11px/1 var(--font); letter-spacing: 0; transition: transform .12s; }
.pinredo svg { width: 12px; height: 12px; }
.pinredo:hover { background: #ffd84d; }
.pinredo:active { transform: scale(.94); }
.ico { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; border-radius: 999px; }
.ico.taxi { background: var(--acc); color: var(--acc-ink); padding: 0 5px; font: 700 9px/1 var(--font); letter-spacing: .06em; }
.ico.hotel { background: #1d5fbf; color: #fff; }
.ico.ort { background: #7a4b2a; color: #fff; }
.ico.klinik { background: #c4262e; color: #fff; }
.ico.bahn { background: #2f6b3a; color: #fff; }
.ico.flug { background: #44506b; color: #fff; }
.ico.lm { height: 24px; min-width: 24px; }

/* Handy: Karte oben (sticky), Leiste darunter, Modus-Knöpfe unten auf der Karte */
@media (max-width: 760px) {
  :root { --gap: 0px; }
  .app { display: flex; flex-direction: column; height: auto; min-height: 100%; padding: 0; }
  .mapwrap { position: sticky; top: 0; z-index: 1; height: 56vh; height: 56dvh; flex: none; border-radius: 0 0 28px 28px; }
  .maphead { left: max(18px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); max-width: 62%; }
  .brand { font-size: 1.15rem; }
  .maphead h1 { font-size: 1.35rem; margin-top: 10px; }
  .maphead p { font-size: .85rem; }
  .tabs { top: auto; bottom: 40px; }
  .tab.on::after { display: none; }
  .mapctl { right: 14px; bottom: 98px; gap: 8px; }
  .mapctl .gbtn { width: 40px; height: 40px; }
  .geo-pill { left: 14px; bottom: 98px; max-width: 62%; }
  .leaflet-control-attribution { font-size: 9px; }
  .geo-pill:has(#geo:not(.bad)) { display: none; }
  .leaflet-top.leaflet-right { top: max(8px, env(safe-area-inset-top)); right: 6px; }
  .panel { border-radius: 0; overflow: visible; overflow: clip; }
  .scroll { overflow: visible; padding: 22px max(16px, env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .h-title { font-size: 1.6rem; }
  .opts { grid-template-columns: 1fr; }
}
/* --- Karteikarten (Modus „karten“): statt der Karte ein Kartenstapel, links die Kategorien --- */
#cards { display: none; }
body.karten #cards { display: flex; position: absolute; inset: 0; z-index: 1001; flex-direction: column; align-items: center; padding: 168px 24px 28px; background: rgba(46,46,49,.9); overflow: hidden; }
/* dahinter schimmert die Karte durch: dunkel eingefärbt, ohne Linien/Schilder, nicht bedienbar */
body.karten #map { pointer-events: none; }
body.karten #map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) grayscale(.7) brightness(.85) contrast(.9); }
body.karten #map .leaflet-overlay-pane, body.karten #map .leaflet-marker-pane, body.karten #map .leaflet-shadow-pane, body.karten #map .leaflet-tooltip-pane,
body.karten #map .leaflet-popup-pane, body.karten #map .leaflet-control-container { display: none; }
/* auf dem dunklen Grund: Überschrift, Zähler und Hinweise hell */
body.karten .maphead { color: #f2f1ed; text-shadow: none; max-width: calc(100% - 140px); }
body.karten .fc-pos, body.karten .fc-keys { color: rgba(242,241,237,.6); }
body.karten .fc-prog { background: rgba(255,255,255,.14); }
body.karten .fc-ok { color: #6fd08d; } body.karten .fc-bad { color: #ff8a80; }
body.karten .mapctl, body.karten .geo-pill, body.karten #quest, body.karten #ffwd, body.karten #chapflash,
body.karten #head, body.karten #score, body.karten .scroll > .sec, body.karten #routes, body.karten .topbar { display: none !important; }
body.karten .maphead p { visibility: visible; }
body.karten #theme { position: absolute; top: 24px; right: 24px; z-index: 1003; }
body.karten #theme svg { width: 22px; height: 22px; }
.fc-top { width: min(560px, 100%); display: grid; gap: 8px; }
.fc-prog { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 10%, transparent); overflow: hidden; }
.fc-prog i { display: block; height: 100%; background: var(--acc); border-radius: inherit; transition: width .3s; }
.fc-cnt { display: flex; justify-content: space-between; font-weight: 600; font-size: .95rem; }
.fc-ok { color: var(--good); } .fc-bad { color: var(--bad); } .fc-pos { color: var(--muted); font-weight: 500; }
.fc-stage { position: relative; flex: 1; width: min(560px, 100%); min-height: 220px; max-height: 380px; margin: 18px 0; display: grid; }
.fc, .fc-next, .fc-end, .fc-ghost { grid-area: 1 / 1; }
.fc-ghost { position: relative; pointer-events: none; }
.fc { position: relative; perspective: 1400px; cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; outline: none; z-index: 1; }
.fc-next { border-radius: 26px; background: var(--card); transform: translateY(10px) scale(.96); opacity: .55; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.fc-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); }
.fc.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.14); }
.fc-front { background: var(--card); color: var(--fg); }
.fc-back { background: var(--acc); color: #141414; transform: rotateY(180deg); }
.fc-face small { font-size: .85rem; font-weight: 500; letter-spacing: .03em; opacity: .6; }
.fc-face b { font-size: clamp(1.4rem, 3.4vw, 2.1rem); font-weight: 650; line-height: 1.2; text-wrap: balance; }
.fc-back b { font-size: clamp(1.6rem, 4vw, 2.5rem); }
.fc-bez { font-size: 1.05rem; font-weight: 500; }
.fc-tip { position: absolute; bottom: 16px; font-size: .78rem; opacity: .45; }
.fc:focus-visible .fc-face { box-shadow: 0 0 0 3px var(--acc), 0 16px 40px rgba(0,0,0,.14); }
.fc-stamp { position: absolute; top: 18px; z-index: 2; padding: 6px 14px; border-radius: 10px; font-weight: 700; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; border: 3px solid; opacity: 0; pointer-events: none; }
.fc-stamp.ok { left: 18px; color: var(--good); border-color: var(--good); transform: rotate(-10deg); background: var(--card); }
.fc-stamp.bad { right: 18px; color: var(--bad); border-color: var(--bad); transform: rotate(10deg); background: var(--card); }
.fc-btns { display: flex; align-items: center; gap: 22px; }
.fc-btn { width: 64px; height: 64px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--card); box-shadow: 0 6px 18px rgba(0,0,0,.12); transition: transform .12s; }
.fc-btn svg { width: 28px; height: 28px; }
.fc-btn.ok { color: var(--good); } .fc-btn.bad { color: var(--bad); }
.fc-btn.undo { width: 46px; height: 46px; color: var(--muted); } .fc-btn.undo svg { width: 20px; height: 20px; }
.fc-btn:active { transform: scale(.92); } .fc-btn:disabled { opacity: .35; cursor: default; }
.fc-keys { margin: 14px 0 0; font-size: .8rem; color: var(--muted); }
.fc-end { align-self: center; justify-self: center; display: grid; gap: 8px; justify-items: center; text-align: center; padding: 28px; border-radius: 26px; background: var(--card); box-shadow: 0 16px 40px rgba(0,0,0,.12); width: 100%; }
.fc-end small { color: var(--muted); font-weight: 500; }
.fc-end b { font-size: 1.8rem; font-weight: 650; }
.fc-end span { color: var(--muted); }
.fc-endbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
.fc-undo { border: 0; background: none; color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer; margin-top: 4px; }
.fc-face b.fc-long { font-size: clamp(1.05rem, 2.4vw, 1.35rem); }
/* Reihenfolge-Karte: alle Straßen als große Pillen, die an ihrem Platz bleiben; angetippt werden sie grün und
   bekommen ihre Nummer – so wächst nichts und alles passt ohne Scrollen auf die Karte */
.fc-stage.seq { max-height: none; }
.fc-seq { cursor: default; touch-action: auto; }
.fc-seq .fc-face { justify-content: flex-start; padding: 18px 18px 14px; overflow-y: auto; }
.seq-in { margin: auto 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.fc-seq .fc-face b { font-size: clamp(1.25rem, 2.8vw, 1.7rem); }
.fc-seq .fc-bez { font-size: .9rem; margin-top: -10px; }
.seq-done, .seq-pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
.seq-done:empty, .seq-pool:empty { display: none; }
.seq-done:not(:empty) + .seq-pool { padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); }
.seq-chip { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 999px; border: 0; font: inherit; font-weight: 600; font-size: 1.1rem; line-height: 1.2; cursor: pointer; color: var(--fg); background: color-mix(in srgb, var(--fg) 10%, transparent); transition: transform .12s, background .2s, color .2s; }
.seq-chip:disabled { cursor: default; }
.seq-chip.ok { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.seq-chip.shown { background: color-mix(in srgb, var(--acc) 26%, transparent); }
.seq-nr { flex: none; width: 24px; height: 24px; margin-left: -8px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; background: color-mix(in srgb, currentColor 22%, transparent); }
.seq-chip:not(:disabled):hover { background: color-mix(in srgb, var(--fg) 16%, transparent); }
.seq-chip:not(:disabled):active { transform: scale(.95); }
.seq-chip.nein { animation: seqNein .4s; background: color-mix(in srgb, var(--bad) 25%, transparent); }
@keyframes seqNein { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.seq-fehler { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 12px; font-size: .88rem; color: var(--muted); }
.seq-fehler .ok { color: var(--good); font-weight: 600; } .seq-fehler .bad { color: var(--bad); font-weight: 600; }
.seq-again { border: 0; border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 600; font-size: .88rem; cursor: pointer; color: var(--fg); background: color-mix(in srgb, var(--fg) 10%, transparent); transition: background .15s, transform .12s; }
.seq-again:hover { background: color-mix(in srgb, var(--fg) 16%, transparent); } .seq-again:active { transform: scale(.95); }
/* fertig gelegt bzw. Lösung gezeigt: Karte gelb, Pillen schwarz mit weißer Schrift; die Nummer ist grün bei selbst
   richtig gelegten, hell bei per Lösung gezeigten */
.fc-seq .fc-face { transition: background .35s, color .35s; }
.fc-seq .fc-face.loesung { background: var(--acc); color: #141414; }
.loesung .seq-chip, .loesung .seq-chip.ok, .loesung .seq-chip.shown { color: #fff; background: #141414; }
.loesung .seq-chip .seq-nr { background: rgba(255,255,255,.18); }
.loesung .seq-chip.ok .seq-nr { background: #2f9e55; }
.loesung .seq-again { color: #141414; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.loesung .seq-again:hover { background: #f2f1ed; }
.loesung .seq-fehler { color: rgba(20,20,20,.7); }
.loesung .seq-fehler .ok { color: #1d6b35; } .loesung .seq-fehler .bad { color: #a8231b; }
.fc-seqbtn { min-width: 150px; height: 46px; background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.fc-seqbtn.primary { background: var(--acc); color: #141414; }
.kpanel { display: grid; gap: 14px; }
.k-opts { display: flex; align-items: center; justify-content: flex-end; gap: 5px; flex: none; }
.k-left { display: flex; align-items: center; gap: 8px; flex: none; }
.k-div { width: 1.5px; height: 20px; margin-right: 2px; border-radius: 1px; background: color-mix(in srgb, var(--on-panel) 30%, transparent); }
.k-sec .k-tog, .k-sec .pillbtn { padding: 5px 10px; font-size: .78rem; white-space: nowrap; }
.k-sec .k-led { display: inline-block; width: 7px; height: 7px; margin-left: 7px; border-radius: 50%; vertical-align: 1px; background: #141414; transition: background .2s, box-shadow .2s; }
.k-tog.on .k-led { background: var(--acc); box-shadow: 0 0 6px var(--acc); }
.k-cnt { font-size: .7rem; }
.k-info { margin: 0; font-size: .92rem; line-height: 1.45; color: var(--on-panel-muted); }
.k-tog { border: 0; border-radius: 999px; padding: 9px 16px; background: var(--card); font-size: .88rem; cursor: pointer; }
.k-tog { color: var(--fg); }
.k-tog.on { background: var(--fg); color: var(--card); }
.k-cnt { display: inline-block; min-width: 1.5em; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: #e5484d; color: #fff; font-size: .78rem; font-weight: 600; text-align: center; }
.k-sec { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.k-sec h3 { margin: 0; font-size: .95rem; }
.k-kats { display: grid; gap: 6px; }
/* wie die Routen-Karten (.rt): dunkel, rund, links das Schraffur-Muster */
.k-kat { position: relative; overflow: hidden; display: grid; grid-template-columns: 52px 1fr auto; grid-template-rows: auto auto; gap: 5px 12px; align-items: center; text-align: left; border: 0; border-radius: 20px; padding: 10px 18px 10px 16px; background: color-mix(in srgb, var(--dark) 50%, transparent); cursor: pointer; font-size: 1rem; color: var(--dark-fg); }
.k-kat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 74px; opacity: .13; background:
  linear-gradient(115deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 34px 30px,
  linear-gradient(25deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 26px 38px;
  -webkit-mask: linear-gradient(90deg, #000 40%, transparent); mask: linear-gradient(90deg, #000 40%, transparent); }
.k-kat.on { background: var(--dark); }
.k-kat:hover { background: #242424; }
.k-check { position: relative; grid-row: 1 / span 2; justify-self: center; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--dark-muted); }
.k-kat.on .k-check { background: var(--acc); border-color: var(--acc); box-shadow: inset 0 0 0 3px var(--dark); }
.k-name { position: relative; font-weight: 500; } .k-n { position: relative; color: var(--dark-muted); font-size: .78rem; }
.k-bar { position: relative; grid-column: 2 / span 2; height: 4px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
.k-bar i { display: block; height: 100%; background: var(--acc); }
.k-reset { font-size: .82rem; }
.k-cnt.k-falsch { margin: 0 8px 0 0; vertical-align: 1px; }
.k-muendlich { margin: 8px 0 0 4px; font-size: .82rem; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; color: #141414; opacity: .75; }
.k-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
/* Alle auswählen/abwählen: umrandete Pille (ohne Füllung), damit sie sich von Mischen/Falsch (gefüllt) unterscheidet */
.k-link { display: inline-flex; align-items: center; gap: 6px; flex: none; border: 1.5px solid rgba(20,20,20,.55); background: none; border-radius: 999px; padding: 4px 10px 4px 6px; font: inherit; font-size: .78rem; font-weight: 500; color: #141414; cursor: pointer; transition: background .15s, border-color .15s; }
.k-link:hover { background: rgba(0,0,0,.07); border-color: #141414; }
/* Kästchen im „Alle“-Knopf: leer = keine, Strich = einige, Haken = alle Kategorien gewählt */
.k-box { position: relative; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid #141414; }
.k-link.all .k-box, .k-link.some .k-box { background: #141414; }
.k-link.all .k-box::after { content: ''; position: absolute; left: 3.5px; top: 0.5px; width: 3.5px; height: 7px; border: solid var(--acc); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.k-link.some .k-box::after { content: ''; position: absolute; left: 2px; right: 2px; top: 4.5px; height: 2px; border-radius: 1px; background: var(--acc); }
.k-src { margin: 0; font-size: .75rem; color: var(--on-panel-muted); }
/* --- Bilder (Modus „bilder“, gleiche Fläche wie die Karteikarten): Foto, darunter vier Namen --- */
.bq { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 14px; }
.bq-frage { margin: 0; color: rgba(242,241,237,.72); font-weight: 500; font-size: .95rem; }
.bq-img { flex: 1 1 auto; min-height: 140px; width: 100%; margin: 0; container-type: size; display: grid; place-items: center; }
/* das Foto genau so groß, wie es in den Platz passt (Seitenverhältnis --r aus bilder.js) – der Rand liegt am Foto */
.bq-img img { display: block; width: min(100cqw, 100cqh * var(--r)); height: min(100cqh, 100cqw / var(--r)); border-radius: 22px; object-fit: cover; box-shadow: 0 16px 40px rgba(0,0,0,.3); background: #1c1c1e; }
.bq-kopf { width: 100%; flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.bq-kopf .bq-frage { justify-self: center; }
.bq-nav { width: 46px; height: 46px; color: var(--fg); } .bq-nav svg { width: 22px; height: 22px; }
.bq-frage.bq-adr { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; column-gap: 10px; row-gap: 0; padding: 7px 16px; border-radius: 14px; background: var(--acc); color: #141414; text-align: center; animation: bqin .3s cubic-bezier(.2,.8,.2,1); }
.bq-adr b { font-size: 1rem; font-weight: 650; } .bq-adr span { font-size: .85rem; }
@keyframes bqin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bq-credit { margin: -6px 0 0; font-size: .7rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bq-credit a { color: rgba(242,241,237,.5); text-decoration: none; } .bq-credit a:hover { color: #f2f1ed; text-decoration: underline; }
.bq-opts { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.bq-opt { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 10px 14px; border: 0; border-radius: 18px; background: var(--card); color: var(--fg); font: inherit; font-size: 1rem; font-weight: 550; line-height: 1.2; text-align: left; overflow-wrap: break-word; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.14); transition: background .2s, color .2s, opacity .2s; }
.bq-opt:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--acc), 0 6px 18px rgba(0,0,0,.14); }
.bq-nr { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 600; background: color-mix(in srgb, var(--fg) 9%, transparent); }
.bq-opt:disabled { cursor: default; opacity: .45; }
.bq-opt.ok, .bq-opt.nein { opacity: 1; color: #fff; } .bq-opt.ok .bq-nr, .bq-opt.nein .bq-nr { background: rgba(255,255,255,.25); }
.bq-opt.ok { background: #1f8a45; }
.bq-opt.nein { background: #d23b2f; animation: seqNein .4s; }
.bq-frage, .bq-credit, .bq-opts { flex: none; }
/* Foto so groß wie möglich (vom Nutzer gewünscht): Titel „Bilder“ oben links weg (steht in der Leiste), Fläche beginnt
   direkt unter Logo und Modus-Knöpfen; Tasten-Hinweis und „Fehler melden“ (auch in der Fußzeile) nur in hohen Fenstern */
body.bilder .maphead h1, body.bilder .maphead p { display: none; }
body.bilder #cards { container-type: inline-size; padding-top: 100px; padding-bottom: 18px; }
body.bilder .fc-keys, body.bilder .fc-melden { display: none; }
@media (min-height: 980px) { body.bilder .fc-keys, body.bilder .fc-melden { display: block; } }
/* breite Fläche (nicht Fenster – links ist ja noch die Leiste): Foto über die ganze Höhe, die vier Namen darunter,
   ab 760 px in einer Reihe – die meisten Fotos sind quer, so werden sie am größten */
@container (min-width: 560px) {
  .fc-top { width: 100%; }
  .bq { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "kopf" "fig" "credit" "opts"; gap: 10px; margin-top: 8px; }
  .bq-kopf { grid-area: kopf; }
  .bq-img { grid-area: fig; min-height: 0; height: 100%; }
  .bq-credit { grid-area: credit; justify-self: center; margin: -4px 0 0; }
  .bq-opts { grid-area: opts; }
}
@container (min-width: 760px) { .bq-opts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
/* --- Theorie (Modus „theorie“): Karteikarten mit Frage vorne, Antwort als Liste hinten --- */
.fc-stage.th-stage { max-height: 560px; }
.th-face { padding: 26px 28px 30px; }
.th-face b.th-frage { font-size: clamp(1.15rem, 2.6vw, 1.6rem); line-height: 1.3; }
.th-face b.th-frage.th-lang { font-size: clamp(1rem, 2.1vw, 1.25rem); }
.th-back { justify-content: flex-start; align-items: stretch; text-align: left; overflow-y: auto; gap: 10px; }
.th-back small { text-align: center; }
.th-ans { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; font-size: clamp(.95rem, 2vw, 1.08rem); font-weight: 500; line-height: 1.38; }
.th-ans li.th-sub { list-style: none; margin-left: .4em; }
.th-ans li.th-sub::before { content: '– '; }
.th-eine { padding: 0; text-align: center; font-size: clamp(1.1rem, 2.6vw, 1.45rem); font-weight: 650; margin: auto 0; }
.th-quelle { margin-top: auto; padding-top: 6px; text-align: center; font-size: .74rem; font-weight: 500; opacity: .62; }
.th-quelle em { font-style: normal; }
/* --- Prüfungs-Simulation (Modus „pruefung“): Aufbau wie das Bilderspiel, Text-Fragen auf einer Karte --- */
.ps-sub { font-size: .85rem; }
.ps-frage-klein { margin: 0; flex: none; color: rgba(242,241,237,.85); text-align: center; font-weight: 500; }
.bq-img.ps-text { min-height: 110px; }
.ps-karte { max-width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 22px 26px; border-radius: 22px; background: var(--card); color: var(--fg); text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.ps-karte b { display: block; font-size: clamp(1.15rem, 2.6vw, 1.6rem); font-weight: 650; line-height: 1.3; text-wrap: balance; }
.ps-karte b.lang { font-size: clamp(1rem, 2vw, 1.2rem); }
.bq-opt.gewaehlt { background: var(--acc); color: #141414; }
.bq-opt.gewaehlt .bq-nr { background: rgba(20,20,20,.14); }
/* „Lösung sofort“: falsche Antwort blinkt zweimal rot, bleibt dann blass rot und gesperrt */
.bq-opt.blink { animation: psBlink .9s ease-in-out forwards; }
@keyframes psBlink { 0%, 50% { background: #d23b2f; color: #fff; } 25%, 75% { background: var(--card); color: var(--fg); } 100% { background: color-mix(in srgb, #d23b2f 30%, var(--card)); color: var(--fg); } }
.bq-opt.versucht, .bq-opt.versucht:disabled { opacity: 1; background: color-mix(in srgb, #d23b2f 30%, var(--card)); text-decoration: line-through; text-decoration-color: rgba(210,59,47,.7); }
.bq-opt.blink:disabled { opacity: 1; }
.ps-ende { align-self: center; margin-top: 10px; color: rgba(242,241,237,.7); text-decoration: underline; text-underline-offset: 3px; }
.ps-ende:hover { color: #f2f1ed; }
.bq-opts.lang { grid-template-columns: minmax(0, 1fr) !important; gap: 8px; }
.bq-opts.lang .bq-opt { min-height: 0; padding: 9px 14px; font-size: .92rem; font-weight: 500; }
.fc-stage.ps-erg { max-height: none; min-height: 0; overflow: auto; }
.ps-erg .fc-end { align-self: start; }
.fc-end b.ps-ok { color: var(--good); } .fc-end b.ps-nein { color: var(--bad); }
.ps-tab { display: grid; gap: 6px; width: 100%; margin-top: 8px; }
.ps-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 22px; gap: 12px; align-items: center; padding: 8px 14px; border-radius: 12px; background: color-mix(in srgb, var(--fg) 6%, transparent); text-align: left; }
.ps-name { font-weight: 600; } .ps-zahl { font-weight: 600; font-variant-numeric: tabular-nums; } .ps-min { color: var(--muted); font-size: .85rem; }
.ps-row.ok .ps-zeichen { color: var(--good); font-weight: 700; } .ps-row.nein .ps-zeichen { color: var(--bad); font-weight: 700; }
.ps-fehler { display: grid; gap: 8px; width: 100%; margin-top: 10px; text-align: left; }
.ps-f { display: grid; gap: 3px; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--fg) 6%, transparent); }
.fc-end .ps-f b { font-size: .98rem; font-weight: 600; line-height: 1.3; }
.ps-du { color: var(--bad); font-size: .88rem; } .ps-richtig { color: var(--good); font-size: .88rem; font-weight: 600; }
.ps-verlauf-t { margin: 4px 0 0; font-size: .95rem; }
.ps-verlauf { display: grid; gap: 6px; }
.ps-verlauf .b-row { font-size: .8rem; }
.b-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.b-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 14px; background: color-mix(in srgb, var(--dark) 50%, transparent); color: var(--dark-fg); font-size: .84rem; line-height: 1.2; }
.b-dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--dark-muted); opacity: .6; }
.b-row.on { background: var(--dark); }
.b-row.ok .b-dot { background: #6fd08d; opacity: 1; } .b-row.nein .b-dot { background: #ff8a80; opacity: 1; }
@media (max-width: 760px) {
  body.karten .mapwrap { height: 80vh; height: 80dvh; }
  body.karten #theme { top: calc(max(8px, env(safe-area-inset-top)) + 10px); right: 16px; }
  body.karten #cards { padding: 112px 16px 100px; } /* unten Platz für die Modus-Knöpfe */
  .fc-stage { margin: 12px 0; min-height: 180px; }
  .fc-seq .fc-face { padding: 12px 10px 10px; }
  .seq-in { gap: 10px; }
  .fc-seq .fc-face b { font-size: 1.15rem; line-height: 1.15; }
  .fc-seq .fc-face b.fc-mid { font-size: 1rem; }
  .fc-seq .fc-bez { font-size: .8rem; margin-top: -6px; }
  .seq-done, .seq-pool { gap: 7px; }
  .seq-done:not(:empty) + .seq-pool { padding-top: 10px; }
  .seq-chip { padding: 9px 14px; font-size: 1rem; }
  .seq-nr { width: 21px; height: 21px; margin-left: -6px; font-size: .72rem; }
  .fc-seqbtn { height: 42px; }
  .seq-fehler { font-size: .72rem; line-height: 1.25; }
  .seq-again { font-size: .8rem; padding: 5px 12px; }
  .fc-btn { width: 56px; height: 56px; }
  .fc-keys { display: none; }
  .bq { gap: 10px; margin-top: 10px; }
  body.bilder #cards { padding-top: 76px; padding-bottom: 100px; }
  .bq-opts { gap: 8px; }
  .bq-opt { min-height: 48px; padding: 8px 10px; font-size: .9rem; gap: 8px; border-radius: 16px; }
  .bq-nr { width: 20px; height: 20px; font-size: .68rem; }
}
/* kleine Handys (iPhone SE): Platz für die Karte – Fehler melden gibt es auch in der Fußzeile */
@media (max-width: 760px) and (max-height: 720px) { body.karten .fc-melden { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>
<div class="app">
  <main class="mapwrap">
    <div id="map"></div>
    <header class="maphead">
      <div class="brand"><span class="logo">TAXI LERNEN</span></div>
      <h1 id="modeTitle">Lernen</h1>
      <p id="modeSub"></p>
    </header>
    <nav class="tabs" aria-label="Modus">
      <button class="gbtn tab on" data-mode="lernen" type="button" title="Routen" aria-label="Routen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.2"/><path d="M8.2 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/><path d="M18 1.8c-1.7 0-3 1.3-3 2.9 0 2.2 3 4.8 3 4.8s3-2.6 3-4.8c0-1.6-1.3-2.9-3-2.9z"/></svg></button>
      <button class="gbtn tab" data-mode="karten" type="button" title="Karteikarten" aria-label="Karteikarten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="3"/><path d="M7 4h11a3 3 0 0 1 3 3v9"/><path d="M7 12.5h6M7 15.5h4"/></svg></button>
      <button class="gbtn tab" data-mode="bilder" type="button" title="Bilder" aria-label="Bilder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3.5"/><circle cx="8.6" cy="9.6" r="1.7"/><path d="M3.5 17l5-4.6 3.6 3.2 3.4-3 5 4.4"/></svg></button>
      <button class="gbtn tab" data-mode="theorie" type="button" title="Theorie" aria-label="Theorie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h8l4 4v14h-12z"/><path d="M14.5 3v4h4"/><path d="M9.5 12h6M9.5 15.5h6M9.5 19h3.5"/></svg></button>
      <button class="gbtn tab" data-mode="pruefung" type="button" title="Prüfung" aria-label="Prüfungs-Simulation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 2"/><path d="M9.5 2.5h5M12 2.5V6"/></svg></button>
    </nav>
    <div class="mapctl">
      <button class="gbtn" id="zarrow" type="button" title="Zum Pfeil" aria-label="Kamera zum Pfeil" hidden><svg viewBox="0 0 24 24" fill="var(--route)" stroke="var(--route)" stroke-width="1.9" stroke-linejoin="round"><path d="M4.5 11.2L19.5 4.5l-6.7 15-1.9-6.4z"/></svg></button>
      <button class="gbtn" id="zin" type="button" title="Näher" aria-label="Näher zoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="gbtn" id="zout" type="button" title="Weiter weg" aria-label="Weiter weg zoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    </div>
    <section id="cards" aria-label="Karteikarten"></section>
    <div id="quest" role="status" hidden><small>Wo startet die Route?</small><b></b><span class="qmsg"></span><button class="qskip" type="button">Überspringen</button></div>
    <button id="ffwd" type="button" title="Vorspulen: der Pfeil fährt schneller ans Ende der Straße" aria-label="Vorspulen" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.2v11.6L11.5 12zM12 6.2v11.6L20.5 12z"/></svg><span>Vorspulen</span></button>
    <div class="geo-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 15.5l2-7 5 3-7 4z"/></svg><span id="geo"></span></div>
  </main>
  <aside class="panel">
    <div class="scroll">
      <div id="stage">
        <div id="head"></div>
        <div id="score"></div>
        <div id="play"></div>
      </div>
      <!-- Kapitel-Auswahl unter Titel und Erklärung, direkt über der Liste, die sie filtert -->
      <div class="topbar">
        <label class="chapdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><select id="chap" aria-label="Kapitel wählen"></select><svg class="dd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></label>
        <button class="iconbtn" id="theme" type="button"></button>
      </div>
      <div class="sec"><h3>Routen <small id="count"></small></h3><button id="shuffle" class="pillbtn" type="button">Zufällig</button></div>
      <div id="routes"></div>
      <div class="foot"><span>Stand 02.11.2026 16:28 · Routen: WKO-Fragenkatalog 2026 · Daten: Stadt Wien, basemap.at, OpenStreetMap</span><span class="foot-btns"><button id="melden" type="button">Fehler melden</button><button id="reload" type="button">Straßennetz neu laden</button><button id="impressum" type="button">Impressum</button><button id="datenschutz" type="button">Datenschutz</button></span></div>
    </div>

const THEORIE = [{"nr":"II","name":"Betriebsordnung","fragen":[{"nr":"1","frage":"Welche Einrichtungen im Fahrzeug müssen sich in einem einwandfreien Zustand befinden?","antwort":"Alle Einrichtungen, die Fahrgäste benützen – vor allem Sitze, Sicherheitsgurte und Gepäckraum\nKeine wesentlichen Beschädigungen außen oder innen (nichts, woran man sich verletzen oder Kleidung beschädigen kann)\nHeizung, Klimaanlage und die Notzeichen-Anlage müssen funktionieren","richtig":"Alle Einrichtungen für die Fahrgäste (Sitze, Gurte, Gepäckraum); keine wesentlichen Beschädigungen","falsch":["Nur die Bremsen und die Beleuchtung","Nur der Taxameter und das Taxischild","Nur die Einrichtungen am Fahrersitz"],"quelle":"§ 4 Abs. 1 und 2 LBO"},{"nr":"2","frage":"Welche Pflichten haben Taxilenker bezüglich der Sauberkeit der Taxis?","antwort":"Das Fahrzeug außen und innen regelmäßig reinigen, je nach Witterung\nEs muss ein sauberes, gepflegtes Erscheinungsbild haben\nFlecken oder Schäden an Sitzbezügen und Verkleidung darf es nicht geben (dafür sorgt der Fahrzeughalter)","richtig":"Außen und innen regelmäßig reinigen – sauberes, gepflegtes Erscheinungsbild","falsch":["Nur einmal im Monat in die Waschstraße fahren","Nur den Innenraum sauber halten, außen ist egal","Für die Sauberkeit ist nur der Unternehmer zuständig"],"quelle":"§ 11 Z 6, § 4 Abs. 2 LBO"},{"nr":"3a","frage":"Dürfen Fahrgäste im Taxi rauchen?","antwort":"Nein – im Taxi gilt Rauchverbot\nWer trotzdem raucht, kann von der Beförderung ausgeschlossen werden","richtig":"Nein, im Taxi gilt Rauchverbot","falsch":["Ja, wenn der Lenker zustimmt","Ja, bei offenem Fenster","Ja, aber nur E-Zigaretten"],"quelle":"§ 10, § 12 Abs. 2 Z 2 LBO"},{"nr":"3b","frage":"Dürfen Taxilenker im Taxi rauchen?","antwort":"Nein – das Rauchverbot gilt auch für Lenker und Lenkerinnen, auch ohne Fahrgast","richtig":"Nein, auch nicht ohne Fahrgäste","falsch":["Ja, wenn kein Fahrgast im Taxi ist","Ja, in den Pausen am Standplatz","Ja, wenn der Fahrgast es erlaubt"],"quelle":"§ 10 LBO"},{"nr":"4","frage":"Wer ist für den technisch einwandfreien Zustand des Taxis verantwortlich?","antwort":"Der Zulassungsbesitzer bzw. Fahrzeughalter – also der Taxiunternehmer\nDer Lenker muss sich aber vor jeder Fahrt überzeugen, dass das Taxi in Ordnung ist","richtig":"Der Zulassungsbesitzer (Unternehmer); der Lenker prüft vor Fahrtantritt","falsch":["Nur die Werkstatt, die das Pickerl ausstellt","Nur der Fahrgast, der das Taxi bestellt","Die Wirtschaftskammer"],"quelle":"§ 103 und § 102 KFG; § 4 Abs. 2 LBO"},{"nr":"5","frage":"Für welche Hunde besteht Beförderungspflicht?","antwort":"Für Assistenzhunde (z. B. Blindenführhunde), auf die der Fahrgast angewiesen ist\nSie müssen keinen Maulkorb tragen\nAndere Hunde ohne Maulkorb kann man ablehnen","richtig":"Für Assistenzhunde, z. B. Blindenführhunde – auch ohne Maulkorb","falsch":["Für alle Hunde mit Leine","Für kleine Hunde bis 10 kg","Für gar keine Hunde"],"quelle":"§ 12 Abs. 3 LBO, § 39a BBG"},{"nr":"6","frage":"Welche Pflichten hat der Taxilenker bezüglich der Gepäckstücke der Fahrgäste?","antwort":"Beim Ein- und Ausladen des Gepäcks helfen\nKofferraum für das Gepäck der Fahrgäste freihalten","richtig":"Beim Ein- und Ausladen helfen, Kofferraum freihalten","falsch":["Keine – der Fahrgast trägt sein Gepäck selbst","Das Gepäck bis in die Wohnung tragen","Nur Gepäck unter 20 kg mitnehmen"],"quelle":"§ 11 Z 4 und 5 LBO"},{"nr":"7","frage":"Was hat der Taxiunternehmer dem Taxilenker nachweislich zur Verfügung zu stellen?","antwort":"Einen GISA-Auszug (Gewerbeinformationssystem) des Unternehmens\nEinen Abdruck der Wiener Landesbetriebsordnung und der BO 1994\nEinen Abdruck des Wiener Taxitarifs\nEin funktionierendes Navigationssystem mit aktuellen Karten","richtig":"GISA-Auszug, Abdruck von Betriebsordnung und Tarif, Navigationssystem","falsch":["Ein Handy mit Vertrag und eine Tankkarte","Eine Uniform und einen Stadtplan aus Papier","Eine Kopie des Führerscheins des Unternehmers"],"quelle":"§ 4 Abs. 4 und 5 LBO, § 18 BO 1994"},{"nr":"8a","frage":"Welche Unterlagen müssen Sie gemäß der Wiener Landesbetriebsordnung mitführen?","antwort":"GISA-Auszug des Unternehmens\nAbdruck der Wiener Landesbetriebsordnung\nAbdruck des Wiener Taxitarifs (nicht nötig in Fahrzeugen, die nur Fahrten außerhalb des Tarifs machen)\nDazu den Taxilenkerausweis (BO 1994)","richtig":"GISA-Auszug, Abdruck der Landesbetriebsordnung und des Tarifs","falsch":["Kaufvertrag und Servicebuch des Fahrzeugs","Meldezettel und Staatsbürgerschaftsnachweis","Fahrtenbuch der letzten 12 Monate"],"quelle":"§ 4 Abs. 4 LBO"},{"nr":"8b","frage":"Wem sind die Unterlagen, die Sie gemäß der Wiener Landesbetriebsordnung mitführen müssen, auf Verlangen vorzulegen?","antwort":"Den Fahrgästen – auf Verlangen zur Einsicht\n(Den Taxilenkerausweis: der Polizei bzw. der Straßenaufsicht)","richtig":"Den Fahrgästen","falsch":["Nur der Polizei","Nur dem Unternehmer","Niemandem, sie bleiben im Handschuhfach"],"quelle":"§ 4 Abs. 4 LBO; § 4 Abs. 3 BO 1994"},{"nr":"9","frage":"Wie hat sich der Taxilenker im Fahrdienst zu verhalten?","antwort":"Gewissenhaft und sorgfältig\nHilfsbereit, höflich und rücksichtsvoll (auch besonnen)\nKein standeswidriges Verhalten, das dem Ansehen des Berufs schadet","richtig":"Hilfsbereit, höflich, rücksichtsvoll und besonnen","falsch":["So schnell wie möglich, damit viele Fahrten möglich sind","Zurückhaltend – Gespräche mit Fahrgästen sind verboten","Nach eigenem Ermessen, es gibt keine Vorschrift"],"quelle":"§ 11 LBO, § 19 Abs. 1 BO 1994"},{"nr":"10","frage":"Was haben Sie als Taxilenker nach Dienstende zu tun?","antwort":"Kontrollieren, ob Gegenstände im Taxi liegen geblieben sind\nFundsachen, deren Besitzer man nicht findet, beim Fundamt abgeben\nDen Unternehmer (und bei vermittelten Fahrten den Vermittler) verständigen","richtig":"Das Taxi nach liegen gebliebenen Gegenständen kontrollieren und Fundsachen beim Fundamt abgeben","falsch":["Den Taxameter auf null stellen und die Einnahmen zählen","Das Taxi volltanken","Nichts – das macht der nächste Lenker"],"quelle":"§ 11 Z 7 LBO"},{"nr":"11","frage":"Was ist den Fahrgästen bei Taxifahrten untersagt?","antwort":"Rauchen\nDen Lenker beim Fahren behindern oder ablenken\nDie Türen während der Fahrt selbst öffnen\nDas Fahrzeug beschmutzen oder beschädigen – sie müssen es schonend benützen","richtig":"Rauchen, den Lenker behindern, Türen während der Fahrt öffnen, das Taxi beschmutzen","falsch":["Mit dem Lenker zu sprechen","Das Fenster zu öffnen","Mit Karte zu bezahlen"],"quelle":"§ 10, § 12 Abs. 1 LBO"},{"nr":"12","frage":"Was verstehen Sie unter „Beförderungspflicht“?","antwort":"Der Lenker muss Fahrgäste befördern, wenn sie\n– vom Taxistandplatz losfahren wollen,\n– ein Taxi auf dem Weg zum Standplatz anhalten oder\n– über eine Funkzentrale oder App vermittelt werden\nAusnahme: ein Ausschließungsgrund liegt vor","richtig":"Fahrgäste vom Standplatz, angehaltene und vermittelte Fahrten müssen befördert werden, außer es gibt einen Ausschließungsgrund","falsch":["Man muss nur Fahrgäste mitnehmen, die bar zahlen","Man muss jede Fahrt annehmen, auch wenn der Fahrgast droht","Man muss nur Fahrten über 5 km annehmen"],"quelle":"§ 9 LBO"},{"nr":"13","frage":"Welche Personen können Sie von der Beförderung ausschließen?","antwort":"Fahrgäste, die das Taxi nicht schonend benützen oder die Sicherheit und Ordnung stören\nFahrgäste, die rauchen\nWenn der Lenker Sicherheitsbedenken hat (z. B. wegen Tageszeit, Fahrziel oder Strecke)\nWenn die Fahrt gegen ein Gesetz verstoßen würde\nFahrgäste mit Tieren, die das Taxi beschmutzen, und Hunde ohne Maulkorb (außer Assistenzhunde)","richtig":"Störende oder rauchende Fahrgäste, bei Sicherheitsbedenken oder wenn die Fahrt gegen ein Gesetz verstößt","falsch":["Fahrgäste mit viel Gepäck","Fahrgäste, die nur eine kurze Strecke fahren wollen","Fahrgäste, die mit Karte zahlen wollen"],"quelle":"§ 12 LBO"},{"nr":"14","frage":"Wo finden Sie die maßgeblichen Bestimmungen für die Inbetriebnahme eines Taxi-Fahrzeuges?","antwort":"In der Bundes-Betriebsordnung (BO 1994) und in der Wiener Landesbetriebsordnung (LBO)\nDazu im Kraftfahrgesetz: Das Fahrzeug muss überprüft (§ 56 KFG) und von der Zulassungsbehörde als Taxi bestätigt werden","richtig":"In der Bundes-Betriebsordnung und der Wiener Landesbetriebsordnung","falsch":["In der Straßenverkehrsordnung","Im Kollektivvertrag","In der Gewerbeordnung"],"quelle":"§ 3 LBO"},{"nr":"15","frage":"Wie viel Platz muss betreffend des Gepäcks im Taxi vorhanden sein?","antwort":"Es muss genug Platz für das übliche Reisegepäck der Fahrgäste da sein\nDer Kofferraum ist für die Fahrgäste freizuhalten","richtig":"Ausreichend Platz für das übliche Reisegepäck","falsch":["Mindestens ein Dachträger","Platz für genau einen Koffer","Es gibt keine Vorschrift"],"quelle":"§ 11 Z 5 LBO (früher § 17 W-TMGB)","alt":true},{"nr":"16","frage":"Wie muss ein Taxi gekennzeichnet sein?","antwort":"Taxischild am Dach mit der Aufschrift „TAXI“, von vorne und hinten lesbar\nGelbe Schrift auf schwarzem Grund (Buchstaben mind. 60 mm hoch)\nDas Schild muss von innen beleuchtbar sein und darf nicht blenden","richtig":"Beleuchtetes Dachschild „TAXI“, gelb auf schwarz, von vorne und hinten lesbar","falsch":["Gelbe Lackierung des ganzen Fahrzeugs","Aufkleber „TAXI“ an beiden Vordertüren","Weißes Schild „TAXI“ hinter der Windschutzscheibe"],"quelle":"§ 6 Abs. 1 und 2 LBO"},{"nr":"17","frage":"Wo muss der Name und Standort des Gewerbetreibenden, sowie das behördliche Kennzeichen des Taxis ersichtlich gemacht werden?","antwort":"Auf einem Schild oder Aufkleber am Armaturenbrett, gut sicht- und lesbar für die Fahrgäste","richtig":"Am Armaturenbrett (Schild oder Aufkleber)","falsch":["Am Taxischild am Dach","Auf der Heckscheibe außen","Nur im GISA-Auszug im Handschuhfach"],"quelle":"§ 4 Abs. 3 Z 1 LBO"},{"nr":"18","frage":"Wie erkennt man ein Ersatztaxi?","antwort":"An der deutlich sichtbaren Aufschrift „ERSATZTAXI“ oder „ERSATZFAHRZEUG“ außen am Fahrzeug\nSonst muss es alle Vorschriften für Taxis erfüllen","richtig":"An der Aufschrift „ERSATZTAXI“ oder „ERSATZFAHRZEUG“","falsch":["An einem roten Taxischild","An einem Kennzeichen mit „E“","Man erkennt es nicht, es gibt keine Kennzeichnung"],"quelle":"§ 7 Abs. 2 LBO"},{"nr":"19","frage":"Was haben Sie beim Lenken eines Ersatztaxis zu beachten?","antwort":"Die Kennzeichentafeln des eigentlichen Taxis müssen im Ersatztaxi mitgeführt und der Straßenaufsicht auf Verlangen gezeigt werden\nEin Ersatztaxi darf höchstens 4 Wochen verwendet werden","richtig":"Die Kennzeichentafeln des eigentlichen Taxis mitführen","falsch":["Man darf damit nur am Standplatz warten","Man darf keine Fahrgäste mitnehmen","Man muss den Taxameter ausschalten"],"quelle":"§ 7 Abs. 1 und 3 LBO"},{"nr":"20","frage":"Wo muss der Taxilenkerausweis im Fahrdienst angebracht werden?","antwort":"Gut sichtbar am Armaturenbrett\nGeburtsdatum, Geburtsort und Wohnadresse darf man abdecken","richtig":"Gut sichtbar am Armaturenbrett","falsch":["In der Brieftasche des Lenkers","An der Heckscheibe","Im Handschuhfach"],"quelle":"§ 4 Abs. 3 Z 2 LBO"},{"nr":"21","frage":"Wann besteht innerhalb des Bundeslandes Wien keine Beförderungspflicht?","antwort":"Wenn ein Ausschließungsgrund vorliegt, z. B.\n– der Fahrgast stört die Sicherheit oder Ordnung oder benützt das Taxi nicht schonend,\n– der Fahrgast raucht,\n– der Lenker hat Sicherheitsbedenken (Tageszeit, Fahrziel, Strecke),\n– die Fahrt würde gegen ein Gesetz verstoßen","richtig":"Wenn ein Ausschließungsgrund vorliegt (z. B. Sicherheitsbedenken, Rauchen, störendes Verhalten)","falsch":["Bei Fahrten unter 2 km","Bei Regen oder Schnee","Wenn der Fahrgast mit Karte zahlen will"],"quelle":"§ 9 Abs. 2, § 12 LBO"},{"nr":"22","frage":"Welche Fahrstrecke hat der Taxilenker ab 1. Jänner 2024 zum Fahrziel zu wählen?","antwort":"Den zeitmäßig schnellsten Weg, außer der Fahrgast wünscht eine andere Strecke\nAuf Verlangen muss der Lenker das Navigationssystem verwenden","richtig":"Den zeitmäßig schnellsten Weg, außer der Fahrgast will es anders","falsch":["Immer den kürzesten Weg in Kilometern","Den Weg, den der Lenker am besten kennt","Immer über Gürtel oder Ring"],"quelle":"§ 9 Abs. 3 LBO"},{"nr":"23","frage":"Welche drei Auskünfte muss der Taxilenker dem Fahrgast geben?","antwort":"Auf Verlangen des Fahrgastes:\n– die Fahrtroute,\n– die geschätzte Fahrtzeit,\n– den geltenden Tarif und den voraussichtlichen Fahrpreis\n(dazu auch, wann der Taxameter eingeschaltet wird)","richtig":"Fahrtroute, geschätzte Fahrtzeit und Tarif bzw. voraussichtlicher Fahrpreis","falsch":["Name, Adresse und Alter des Lenkers","Kilometerstand, Tankfüllung und Baujahr","Wetter, Verkehrslage und Parkplätze am Ziel"],"quelle":"§ 11 Z 1 LBO"},{"nr":"24","frage":"Welche Verpflichtung hat der Taxilenker beim Ein- und Aussteigen der Fahrgäste?","antwort":"Bei Bedarf beim Ein- und Aussteigen helfen\nBeim Ein- und Ausladen des Gepäcks helfen","richtig":"Bei Bedarf beim Ein- und Aussteigen behilflich sein","falsch":["Keine – das ist Sache des Fahrgastes","Die Türe nur bei Regen öffnen","Den Fahrgast bis zur Haustür begleiten"],"quelle":"§ 11 Z 4 LBO"},{"nr":"25","frage":"Unter welchen Voraussetzungen müssen Sie Autofenster- bzw. Schiebedach öffnen und schließen?","antwort":"Auf Verlangen der Fahrgäste – dabei darf der Lenker auf die eigene Gesundheit Rücksicht nehmen","richtig":"Auf Verlangen der Fahrgäste, mit Rücksicht auf die eigene Gesundheit","falsch":["Nur wenn es über 25 Grad hat","Nie – das entscheidet allein der Lenker","Nur bei Fahrten über 10 km"],"quelle":"früher § 27 W-TMGB; heute § 11 Z 4 LBO (rücksichtsvoll und hilfsbereit)","alt":true},{"nr":"26","frage":"Wieviel Wechselgeld müssen Sie mit sich führen?","antwort":"So viel, dass man auf einen 50-Euro-Schein herausgeben kann","richtig":"So viel, dass man auf 50 € herausgeben kann","falsch":["So viel, dass man auf 100 € herausgeben kann","So viel, dass man auf 20 € herausgeben kann","Keines – Fahrgäste müssen passend zahlen"],"quelle":"§ 11 Z 3 LBO"},{"nr":"27","frage":"Wann darf die Taxileuchte nicht beleuchtet sein?","antwort":"Wenn das Taxi bestellt, besetzt oder außer Dienst ist","richtig":"Wenn das Taxi bestellt, besetzt oder außer Dienst ist","falsch":["Nur in der Nacht","Am Taxistandplatz","Wenn das Taxi frei ist"],"quelle":"§ 6 Abs. 2 LBO"},{"nr":"28","frage":"Wann befindet sich ein Taxi “Außer Dienst”?","antwort":"Wenn es deutlich als „außer Dienst“ gekennzeichnet ist: mit einem gut sichtbaren Schild „außer Dienst“ oder indem das Taxischild abgenommen wird\nDie Dachleuchte darf dann nicht leuchten","richtig":"Wenn ein gut sichtbares Schild „außer Dienst“ angebracht oder das Taxischild abgenommen ist","falsch":["Wenn der Motor abgestellt ist","Wenn der Lenker nicht im Taxi sitzt","Wenn das Taxi auf dem Standplatz steht"],"quelle":"§ 14 Abs. 1 Z 1, § 6 Abs. 2 LBO"},{"nr":"29","frage":"Wo dürfen Sie Fahrgäste aufnehmen?","antwort":"Am Taxistandplatz\nWenn ein Fahrgast das Taxi auf dem Weg zu einem Standplatz anhält\nBei Fahrten, die über Funk oder App vermittelt wurden, am bestellten Ort\nBei Veranstaltungen mit mindestens 1.000 Besuchern auch außerhalb von Standplätzen","richtig":"Am Standplatz, auf dem Weg zum Standplatz und am Ort einer vermittelten Bestellung","falsch":["Überall, wo man Fahrgäste sieht","Nur an Straßenbahn- und Bushaltestellen","Nur an Bahnhöfen und Flughäfen"],"quelle":"§ 9 Abs. 1, § 13, § 14 Abs. 2, § 15 Abs. 2 LBO"},{"nr":"30","frage":"Was verstehen Sie unter der “freien Standplatzwahl”?","antwort":"Man darf mit dem Taxi jeden Taxistandplatz in Wien anfahren – es gibt keine fixe Zuteilung","richtig":"Jeder Taxistandplatz in Wien darf angefahren werden","falsch":["Jeder Lenker hat einen fixen Standplatz","Man darf nur im eigenen Wohnbezirk warten","Man darf überall parken und warten"],"quelle":"§ 13 LBO (früher § 33 W-TMGB)","alt":true},{"nr":"31a","frage":"Dürfen Sie mit Ihrem Taxi umherfahren, um Fahrgäste zu gewinnen?","antwor
