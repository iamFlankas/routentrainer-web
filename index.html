<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaxiLernen Wien</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: große abgerundete Karte links (mit schwebenden Glas-Knöpfen), helle Leiste rechts; am Handy Karte oben, Leiste darunter */
:root {
  --page: #0e0e0e; --panel: rgba(250, 216, 96, .96); --on-panel: #141414; --on-panel-muted: rgba(20, 20, 20, .62); --card: #fbf8f0; --fg: #141414; --muted: #8a8984; --line: #dcdad4; --soft: #f1ede2;
  --dark: #151515; --dark-fg: #f4f3ef; --dark-muted: #9a9993;
  --acc: #f7c831; --acc-ink: #1a1a1a;
  --route: #1d3fbf; --route-ink: #fff; --warn: #ff6a00;
  --good: #1f8a45; --good-bg: #e2f3e8; --bad: #d23b2f; --bad-bg: #fbe5e2;
  --glass: rgba(28, 28, 28, .46); --glass-line: rgba(255, 255, 255, .22);
  --font: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --r: 30px; --gap: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0e0e0e; --card: #232325; --fg: #f2f1ed; --muted: #9b9a95; --line: #333335; --soft: #2b2b2e;
  --dark: #0f0f10; --good: #6fd08d; --good-bg: #1d3324; --bad: #ff8a80; --bad-bg: #3a1f1c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0e0e0e; --card: #232325; --fg: #f2f1ed; --muted: #9b9a95; --line: #333335; --soft: #2b2b2e;
  --dark: #0f0f10; --good: #6fd08d; --good-bg: #1d3324; --bad: #ff8a80; --bad-bg: #3a1f1c; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--fg); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: minmax(360px, 440px) 1fr; gap: var(--gap); padding: var(--gap); }
/* Menü links, Karte rechts (am Handy gilt die Reihenfolge weiter unten: Karte oben) */
.panel { grid-column: 1; grid-row: 1; }
.mapwrap { grid-column: 2; grid-row: 1; }

/* --- Karte --- */
.mapwrap { position: relative; border-radius: var(--r); overflow: hidden; background: #e7e5df; min-height: 0; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
#map { position: absolute; inset: 0; background: #e7e5df; }
#map { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.svpop .leaflet-popup-content-wrapper { padding: 0; border-radius: 999px; background: #141414; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.svpop .leaflet-popup-content { margin: 0; }
.svpop .leaflet-popup-tip { background: #141414; }
.svbtn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px 9px 12px; color: var(--acc) !important; font: 500 .95rem var(--font); text-decoration: none; white-space: nowrap; }
.svbtn svg { width: 18px; height: 18px; }
.leaflet-container { background: #e7e5df; font-family: var(--font); }
.maphead { position: absolute; left: 30px; top: 26px; z-index: 1002; color: #141414; pointer-events: none; max-width: 40%; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 1.5rem; letter-spacing: -.01em; }
.logo { font: 700 .95rem/1 var(--font); letter-spacing: .1em; background: var(--acc); color: var(--acc-ink); padding: 8px 11px; border-radius: 9px; white-space: nowrap; }
.maphead h1 { font-weight: 500; font-size: 1.75rem; letter-spacing: -.02em; margin: 30px 0 4px; }
.maphead p { margin: 0; font-size: .95rem; opacity: .9; }
.maphead { text-shadow: 0 0 2px #fff, 0 0 6px #fff, 0 0 12px rgba(255,255,255,.9); }
.logo { text-shadow: none; }
.tabs { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 1002; display: flex; gap: 8px; }
.gbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--glass-line); background: var(--glass); color: #fff; cursor: pointer; padding: 0; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); transition: background .2s, transform .15s; position: relative; }
.gbtn:hover { background: rgba(28,28,28,.62); }
.gbtn:active { transform: scale(.94); }
.gbtn svg { width: 20px; height: 20px; }
.tab.on { background: #fff; color: #141414; border-color: #fff; }
.tab.on::after { content: ""; position: absolute; bottom: -9px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #fff; }
.mapctl { position: absolute; right: 22px; bottom: 34px; z-index: 1002; display: flex; flex-direction: column; gap: 10px; }
#quest { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 1002; width: min(460px, calc(100% - 32px)); box-sizing: border-box; padding: 9px 10px 9px 16px; border-radius: 18px; background: color-mix(in srgb, var(--acc) 72%, transparent); -webkit-backdrop-filter: blur(6px) saturate(1.2); backdrop-filter: blur(6px) saturate(1.2); color: #141414; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 1px; align-items: center; text-align: left; box-shadow: 0 6px 18px rgba(0,0,0,.18); animation: ffin .3s ease-out; pointer-events: none; }
#quest[hidden] { display: none; }
#chapflash { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1003; pointer-events: none; display: grid; gap: 2px; text-align: center; padding: 22px 38px 20px; border-radius: 26px; background: color-mix(in srgb, var(--acc) 88%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #141414; box-shadow: 0 14px 40px rgba(0,0,0,.25); animation: chapin .45s cubic-bezier(.2,.8,.2,1); transition: opacity .45s, transform .45s; }
#chapflash small { font-size: 1rem; font-weight: 500; opacity: .7; letter-spacing: .04em; }
#chapflash b { font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
#chapflash span { font-size: .9rem; opacity: .75; }
#chapflash.out { opacity: 0; transform: translate(-50%, -50%) scale(.96); }
@keyframes chapin { from { opacity: 0; transform: translate(-50%, -50%) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
body.questing .maphead p { visibility: hidden; }
#quest small { grid-column: 1; color: rgba(20,20,20,.62); font-size: .74rem; font-weight: 500; letter-spacing: .02em; }
#quest b { grid-column: 1; font-weight: 600; font-size: 1rem; line-height: 1.2; }
#quest .qmsg { grid-column: 1; font-size: .8rem; opacity: .85; line-height: 1.3; }
#quest.bad .qmsg { color: #a3241a; opacity: 1; font-weight: 500; }
#quest .qskip { grid-column: 2; grid-row: 1 / span 3; pointer-events: auto; border: 0; border-radius: 999px; padding: 7px 14px; background: #141414; color: var(--acc); font: inherit; font-size: .8rem; font-weight: 500; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.18); transition: transform .12s; }
#quest .qskip:hover { background: #2a2a2a; }
#quest .qskip:active { transform: scale(.95); }
#ffwd { position: absolute; left: 50%; bottom: 82px; transform: translateX(-50%); z-index: 1002; display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px 10px 14px; border: 0; border-radius: 999px; background: #141414; color: var(--acc); font: 500 .95rem var(--font); cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: ffin .25s ease-out; }
#ffwd[hidden] { display: none; }
#ffwd svg { width: 18px; height: 18px; }
#ffwd:active { transform: translateX(-50%) scale(.95); }
@keyframes ffin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translateX(-50%); } }
.geo-pill { position: absolute; left: 22px; bottom: 26px; z-index: 1002; max-width: 46%; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); color: #fff; font-size: .85rem; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.geo-pill { transition: opacity .6s; }
.geo-pill.done { opacity: 0; pointer-events: none; }
.geo-pill svg { flex: none; width: 18px; height: 18px; opacity: .85; }
#geo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#geo.bad { color: #ffb4ac; }
.leaflet-top.leaflet-right { top: 14px; right: 14px; }
.leaflet-control-attribution { font-size: 10px; border-radius: 8px 0 0 0; }

.status { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
/* --- Leiste rechts --- */
.panel { background: var(--panel); color: var(--on-panel); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.chapdd, .iconbtn, .card, .chip, .btn, .opt, .choice, .pillbtn, .notice, .status { color: var(--fg); }
.topbar { display: flex; gap: 10px; align-items: center; padding: 22px 22px 6px; }
.chapdd { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 999px; padding: 0 16px; height: 48px; cursor: pointer; }
.chapdd svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.chapdd select { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: .95rem; font-weight: 500; -webkit-appearance: none; appearance: none; padding-right: 26px; cursor: pointer; text-overflow: ellipsis; }
.chapdd .dd-chev { position: absolute; right: 16px; pointer-events: none; color: var(--fg); }
.chapdd:focus-within { box-shadow: 0 0 0 2px #141414; }
.iconbtn { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:hover { box-shadow: inset 0 0 0 1px var(--line); }
.scroll { overflow-y: auto; padding: 18px 22px 26px; display: flex; flex-direction: column; gap: 16px; min-height: 0; flex: 1; }
.rbtn:focus-visible, .btn:focus-visible, .opt:focus-visible, .choice:focus-visible, .rt:focus-visible, .gbtn:focus-visible, .iconbtn:focus-visible, .pillbtn:focus-visible { outline: 2px solid #141414; outline-offset: 2px; }
#stage { display: flex; flex-direction: column; gap: 16px; }
#head { display: flex; flex-direction: column; gap: 14px; }
.h-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.h-left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.h-nav { flex: none; display: flex; gap: 8px; }
.rbtn { width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; background: #141414; color: var(--acc); display: grid; place-items: center; cursor: pointer; transition: transform .15s; }
.rbtn:hover { transform: translateY(-1px); }
.rbtn:active { transform: scale(.94); }
.rbtn svg { width: 22px; height: 22px; }
.h-title { font-weight: 500; font-size: 2rem; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
.h-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-weight: 500; font-size: .85rem; padding: 4px 11px; border-radius: 999px; background: #141414; color: #fff; }
.badge.soft { background: rgba(255,255,255,.55); color: #141414; }
.card { background: var(--card); border-radius: 26px; padding: 18px 20px; }
.card.lern { display: flex; flex-direction: column; gap: 14px; }
.card.lern .btn:not(.primary):not(.nav-b) { background: var(--soft); }
.tl-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.tl-top > span:first-child { color: var(--muted); font-size: 1.05rem; }
.tl-kat { flex: 1; min-width: 0; text-align: center; color: var(--muted); opacity: .55; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-line { position: relative; display: flex; align-items: center; justify-content: space-between; height: 40px; }
.tl-line::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 2px solid var(--acc); }
.tl-line i { position: relative; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--acc); background: var(--card); }
.tl-mid { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; box-shadow: 0 0 0 6px var(--card); }
.tl-mid svg { width: 20px; height: 20px; }
.tl-via { text-align: center; color: var(--muted); font-size: .88rem; margin-top: 2px; text-wrap: balance; }
.tl-hint { color: var(--muted); font-size: .8rem; line-height: 1.35; margin-top: 8px; text-wrap: pretty; }
.tl-names { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; font-size: .95rem; line-height: 1.25; }
.tl-names span { text-wrap: balance; justify-self: start; background: #141414; color: var(--acc); border-radius: 14px; padding: 6px 12px; font-weight: 500; }
.tl-names span:last-child { justify-self: end; text-align: right; }
.hint { margin: 0; color: var(--on-panel-muted); }
.card .hint { color: var(--muted); }
#score:empty { display: none; }
#score { align-self: flex-start; font-weight: 500; font-size: .85rem; color: var(--bad); background: var(--bad-bg); padding: 4px 12px; border-radius: 999px; }
#play { display: flex; flex-direction: column; gap: 12px; }
#play:empty { display: none; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--card); font-weight: 500; font-size: .92rem; }
.chip small { font-size: .74rem; color: var(--muted); font-weight: 400; }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.diff { background: var(--bad-bg); color: var(--bad); }
.chip.dest { background: var(--acc); color: var(--acc-ink); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; }
.chain:empty { display: none; }
.chain .chip:not(:last-child)::after { content: "›"; margin-left: 4px; color: var(--muted); }
.choice .chain .chip { background: var(--soft); }
.choice .chain .chip.diff { background: var(--bad-bg); }
.chain.small .chip { font-size: .82rem; padding: 3px 9px; }

/* Schritte als Zeitleiste */
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; counter-reset: s; }
ol.steps li { position: relative; display: flex; align-items: center; gap: 12px; padding: 5px 0; cursor: pointer; counter-increment: s; }
ol.steps li::before { content: counter(s); flex: none; position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 600; background: var(--card); border: 2px solid var(--line); color: var(--muted); }
ol.steps li:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 50%; height: 100%; border-left: 2px solid var(--line); }
ol.steps li .chip { background: none; padding: 2px 0; font-size: .98rem; }
ol.steps li.past::before { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
ol.steps li.past::after { border-color: var(--acc); }
ol.steps li.next::before { border-style: dashed; border-color: var(--fg); color: var(--fg); }
ol.steps li.now::before { background: var(--fg); border-color: var(--fg); color: var(--card); }
ol.steps li.now .chip { font-weight: 600; }
ol.steps li.dest::before { content: "★"; background: var(--fg); border-color: var(--fg); color: var(--card); }
ol.steps li.dest .chip { background: var(--acc); color: var(--acc-ink); padding: 4px 12px; }

.notice { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; background: var(--bad-bg); font-size: .9rem; }
.notice strong { color: var(--bad); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-weight: 500; font-size: .92rem; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--soft); cursor: pointer; }
.btn:hover { box-shadow: inset 0 0 0 1px var(--line); }
.btn.primary { background: var(--fg); color: var(--card); }
.btn:disabled { opacity: .4; cursor: default; }
.playbtn { display: inline-flex; align-items: center; gap: 8px; }
.btn > svg:only-child { width: 18px; height: 18px; display: block; margin: 0 auto; }
.rnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar.row3 { flex-wrap: nowrap; }
.bar.row3 .btn { flex: 1 1 0; min-width: 0; padding: 10px 8px; justify-content: center; white-space: nowrap; }
.btn.playbtn { background: #141414; color: var(--acc); }
.nav-b { width: 38px; height: 38px; padding: 0 0 3px; font-size: 1.3rem; line-height: 1; background: var(--acc); color: #141414; font-weight: 600; }
.nav-b:hover { box-shadow: inset 0 0 0 1.5px #141414; }
.nav-t { font-size: 1rem; font-weight: 600; letter-spacing: .01em; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { padding: 14px 16px; border: 0; border-radius: 20px; background: var(--card); cursor: pointer; text-align: left; }
.opt .chip { background: none; padding: 0; font-size: 1rem; }
.opt:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.opt.no { background: var(--bad-bg); color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.choice { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; text-align: left; padding: 14px; border: 0; border-radius: 22px; background: var(--card); cursor: pointer; }
.choice:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--fg); }
.choice .letter { font-weight: 600; font-size: 1.05rem; background: var(--acc); color: var(--acc-ink); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; }
.choice .why { grid-column: 2; font-size: .85rem; color: var(--bad); }
.choice.right { box-shadow: inset 0 0 0 2px var(--good); }
.choice.wrong { box-shadow: inset 0 0 0 2px var(--bad); }
.choice:disabled { cursor: default; }
.result { margin: 0; padding: 14px 16px; border-radius: 20px; display: flex; flex-direction: column; gap: 4px; }
.result.good { background: var(--good-bg); color: var(--good); }
.result.bad { background: var(--bad-bg); color: var(--bad); }
.feedback { margin: 0; color: var(--bad); font-weight: 500; }
.feedback:empty { display: none; }
.prog { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--acc); border-radius: 3px; transition: width .3s; }

/* Routenliste: dunkle Karten */
.sec { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.sec h3 { margin: 0; font-weight: 500; font-size: 1.4rem; letter-spacing: -.01em; }
.sec h3 small { font-size: .85rem; color: var(--on-panel-muted); font-weight: 400; margin-left: 4px; }
.pillbtn { border: 0; background: var(--card); border-radius: 999px; padding: 9px 16px; font-size: .88rem; cursor: pointer; }
.pillbtn:hover { box-shadow: inset 0 0 0 1px var(--line); }
#routes { display: flex; flex-direction: column; gap: 8px; }
.chap-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .85rem; color: var(--on-panel-muted); padding: 10px 6px 0; }
.chap-h b { font-weight: 600; color: var(--on-panel); }
.rt { display: grid; grid-template-columns: 52px 1fr; gap: 4px 12px; align-items: center; text-align: left; padding: 14px 18px 14px 16px; border: 0; border-radius: 24px; background: var(--dark); color: var(--dark-fg); cursor: pointer; position: relative; overflow: hidden; }
.rt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 74px; opacity: .13; background:
  linear-gradient(115deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 34px 30px,
  linear-gradient(25deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 26px 38px;
  -webkit-mask: linear-gradient(90deg, #000 40%, transparent); mask: linear-gradient(90deg, #000 40%, transparent); }
.rt:hover { background: #242424; }
.rt.on { box-shadow: 0 0 0 3px #fff; }
.rt-n { position: relative; font-weight: 500; font-size: 1.4rem; letter-spacing: -.02em; }
.rt-body { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rt-line { position: relative; display: flex; align-items: center; justify-content: space-between; height: 22px; }
.rt-line::before { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; border-top: 1.5px solid var(--acc); }
.rt-line > i { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--acc); }
.rt-mid { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--dark); font-size: .78rem; color: var(--dark-muted); }
.rt:hover .rt-mid { background: #242424; }
.rt-lv { display: inline-flex; gap: 3px; }
.rt-lv i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--dark-muted); }
.rt-lv i.f { background: var(--acc); border-color: var(--acc); }
.rt-names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: .9rem; line-height: 1.2; }
.rt-names span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rt-to { text-align: right; }
.empty { color: var(--on-panel-muted); text-align: center; padding: 20px 0; margin: 0; }

.resultcard { position: absolute; left: 0; bottom: 64px; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; padding: 14px 14px 14px 20px; border-radius: 24px; background: color-mix(in srgb, var(--acc) 78%, transparent); -webkit-backdrop-filter: blur(8px) saturate(1.2); backdrop-filter: blur(8px) saturate(1.2); color: #141414; box-shadow: 0 10px 28px rgba(0,0,0,.22); white-space: nowrap; font-family: var(--font); cursor: default; animation: rcin .45s cubic-bezier(.2,.8,.2,1); }

/* Ziel erreicht: Konfetti */
.confetti { position: absolute; left: 0; top: 0; pointer-events: none; }

.pinmarker { overflow: visible; }

/* --- Karteikarten (Modus „karten“): statt der Karte ein Kartenstapel, links die Kategorien --- */

.fc-top { width: min(560px, 100%); display: grid; gap: 8px; }

.fc-ok { color: var(--good); } .fc-bad { color: var(--bad); } .fc-pos { color: var(--muted); font-weight: 500; }

.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.14); }

  linear-gradient(115deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 34px 30px,

  const url = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latlng.lat.toFixed(6)},${latlng.lng.toFixed(6)}`;
  const a = el('a', 'svbtn'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.6" fill="currentColor"/><path d="M8.6 10.2h6.8l-1.2 6.3h-1.6l-.5 4h-1.8l-.5-4H9.8z" fill="currentColor"/></svg>Street View ↗';
  a.onclick = () => setTimeout(() => { if (svPop) { map.closePopup(svPop); svPop = null; } }, 50);
  if (svPop) map.closePopup(svPop);
  svPop = L.popup({ className: 'svpop', closeButton: false, autoClose: false, closeOnClick: false, autoPan: false, offset: [0, -4] })
    .setLatLng(latlng).setContent(a).openOn(map);
}
{
  const box = map.getContainer();
  const cancel = () => { clearTimeout(svTimer); svTimer = null; svStart = null; };
  box.addEventListener('pointerdown', e => {
    cancel();
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('.leaflet-control, .leaflet-popup, .leaflet-marker-icon, button, a, #quest')) return; // nicht auf Knöpfen, Ergebnis-Karte, Schildern
    svStart = [e.clientX, e.clientY];
    svTimer = setTimeout(() => {
      svTimer = null; svNoClick = Infinity; // bis zum Loslassen keinen Klick werten
      if (navigator.vibrate) navigator.vibrate(15);
      streetView(map.mouseEventToLatLng(e));
    }, SV_HOLD);
  });
  box.addEventListener('pointermove', e => { if (svStart && Math.hypot(e.clientX - svStart[0], e.clientY - svStart[1]) > 8) cancel(); });
  const up = () => { cancel(); if (svNoClick === Infinity) svNoClick = Date.now() + 400; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  box.addEventListener('touchstart', e => { if (e.touches.length > 1) cancel(); }, { passive: true });
  map.on('movestart zoomstart', () => { if (!ownCam) cancel(); });
  // Rechtsklick; das Kontextmenü des Browsers (bzw. das lange Drücken auf dem Handy) unterdrücken
  map.on('contextmenu', e => { if (e.originalEvent.pointerType !== 'touch' && svNoClick !== Infinity) streetView(e.latlng); });
  box.addEventListener('contextmenu', e => e.preventDefault());
}

function progress() { const d = el('div', 'prog'); const f = el('i'); f.style.width = (100 * state.step / state.route.steps.length) + '%'; d.append(f); return d; }
function finish(p) {
  showPoints(true);
  const r = state.route, perfect = state.errors === 0;
  if (!state.done) { state.done = true; record(r.n, perfect); }
  const box = el('div', 'result ' + (perfect ? 'good' : 'bad'));
  box.append(el('strong', '', perfect ? 'Fehlerfrei – Ziel erreicht.' : (state.errors >= 99 ? 'Lösung angezeigt.' : `Ziel erreicht mit ${state.errors} Fehler${state.errors === 1 ? '' : 'n'}.`)));
  box.append(el('div', '', 'Ziel: ' + r.to));
  p.append(box, nextBar()); fitRoute();
}
function nextBar() {
  const bar = el('div', 'bar');
  const again = el('button', 'btn', 'Nochmal'); again.onclick = reset;
  const nx = el('button', 'btn primary', 'Nächste Route'); nx.onclick = () => swipeRoute(1);
  const rnd = el('button', 'btn', 'Zufällig (schwache zuerst)'); rnd.onclick = () => nextRoute(true);
  bar.append(again, nx, rnd); return bar;
}

document.addEventListener('keydown', e => {
  if (!shown() || state.mode === 'karten' || (e.target instanceof Element && e.target.closest('input, textarea, select, button'))) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); swipeRoute(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); swipeRoute(-1); }
  if (state.mode !== 'lernen' || !STREETS || state.playing) return;
  if (e.key === 'ArrowRight' && state.step < state.route.steps.length) { e.preventDefault(); advanceStep(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepBack(); }
});
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.mode = t.dataset.mode; reset(); renderList(); $('#score').textContent = ''; });
$('#shuffle').onclick = () => { if (state.mode === 'lernen') state.open = true; nextRoute(true); scrollPanelTop(); };
$('#chap').onchange = e => setChap(+e.target.value);
// Knöpfe auf der Karte
$('#zin').onclick = () => { camSeq++; userZoom = true; map.zoomIn(); };
$('#zout').onclick = () => { camSeq++; userZoom = true; map.zoomOut(); };
$('#zarrow').onclick = () => {
  if (!curHead) return;
  userDrag = false; camSeq++; if (segRunning) userZoom = true; // während der Fahrt danach weiter mitfahren
  map.flyTo(curHead.getLatLng(), Math.max(map.getZoom(), 16), { duration: reduced() ? 0 : 0.7 });
  updateFollowBtn();
};
// Überspringen: in der 1. Stufe nur die Bezirkswahl (weiter zur Gegend), in der 2. direkt zum Start
$('#quest .qskip').onclick = async () => {
  const q = quest; if (!q) return;
  if (q.stage === 2) { questDone(); return; }
  const j = await bezirke(); if (quest !== q || q.stage !== 1) return;
  questZoom(bezirkAt(j, [q.r.start[0], q.r.start[1]]));
};
$('#ffwd').onclick = () => { if (ffwdFn) ffwdFn(); };
$('#zfit').onclick = () => { camSeq++; if (shown()) fitRoute(); else map.flyTo([48.2085, 16.3725], 13, { duration: reduced() ? 0 : 0.8 }); };
// Darstellung: hell oder dunkel (im Dunklen wird die Karte gefiltert). Ohne gespeicherte Wahl startet sie wie das System,
// der Knopf wechselt dann nur zwischen den beiden.
const THEME_KEY = 'taxi-theme-v1', THEME_NAME = { light: 'hell', dark: 'dunkel' };
const THEME_ICON = {
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
};
let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
try { const t = localStorage.getItem(THEME_KEY); if (t in THEME_NAME) theme = t; } catch (e) {}
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const b = $('#theme'); b.innerHTML = THEME_ICON[theme]; b.title = 'Darstellung: ' + THEME_NAME[theme]; b.setAttribute('aria-label', b.title);
}
$('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} applyTheme(); };
applyTheme();
$('#reload').onclick = async () => { await idbDel(IDB_KEY); STREETS = null; render(); loadStreets(); };
renderList(); render(); loadStreets();

// --- Karteikarten: Adressen aus dem Fragenkatalog (vorne der Ort, hinten die Adresse), ohne Karte ---
// Tippen/Leertaste dreht die Karte um, nach rechts wischen bzw. → = gewusst, nach links bzw. ← = nicht gewusst,
// ↓ bzw. ↶ = letzte Karte zurück. Lernstand je Karte und der laufende Stapel bleiben gespeichert.
const BEZIRKE = ['Innere Stadt', 'Leopoldstadt', 'Landstraße', 'Wieden', 'Margareten', 'Mariahilf', 'Neubau', 'Josefstadt', 'Alsergrund',
  'Favoriten', 'Simmering', 'Meidling', 'Hietzing', 'Penzing', 'Rudolfsheim-Fünfhaus', 'Ottakring', 'Hernals', 'Währing', 'Döbling',
  'Brigittenau', 'Floridsdorf', 'Donaustadt', 'Liesing'];
const KARTEN_ALL = KARTEN.flatMap((k, ki) => k.karten.map(([name, adr]) => ({ id: k.name + '|' + name, kat: ki, name, adr })));
const KARTEN_BY_ID = new Map(KARTEN_ALL.map(c => [c.id, c]));
const KSTAT_KEY = 'taxi-karten-v1', KSET_KEY = 'taxi-karten-auswahl-v1', KRUN_KEY = 'taxi-karten-stapel-v1';
const kLoad = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const kSave = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
// Lernstand je Karte: [wie oft gewusst, wie oft nicht, zuletzt gewusst?]
let kstat = kLoad(KSTAT_KEY, {});
// Auswahl: welche Kategorien, gemischt oder nur die falschen (nie beides zugleich)
let kset = Object.assign({ kat: KARTEN.map((_, i) => i), falsch: false, mischen: true }, kLoad(KSET_KEY, {}));
delete kset.offen;
if (kset.falsch && kset.mischen) kset.mischen = false;
// laufender Stapel: Karten-IDs, Position, Ergebnisse (id -> true/false) in der Reihenfolge der Antworten
let krun = kLoad(KRUN_KEY, null);
let kflip = false, kdrag = null;
const known = id => kstat[id] && kstat[id][2];
// falsch: zuletzt nicht gewusst
const wrong = id => !!kstat[id] && !kstat[id][2] && kstat[id][1] > 0;
const kWrongIds = () => KARTEN_ALL.filter(c => kset.kat.includes(c.kat) && wrong(c.id)).map(c => c.id);

function kDeck(ids) {
  const list = kset.mischen ? shuffle(ids.slice()) : ids.slice();
  krun = { ids: list, i: 0, hist: [] }; kflip = false; kSave(KRUN_KEY, krun);
}
function kNewDeck() {
  let ids = KARTEN_ALL.filter(c => kset.kat.includes(c.kat)).map(c => c.id);
  if (kset.falsch) ids = ids.filter(wrong);
  kDeck(ids);
}
function kValid() {
  if (!krun || !Array.isArray(krun.ids) || !Array.isArray(krun.hist)) return false;
  krun.ids = krun.ids.filter(id => KARTEN_BY_ID.has(id));
  krun.hist = krun.hist.filter(h => KARTEN_BY_ID.has(h[0]));
  krun.i = Math.min(krun.i, krun.ids.length);
  return true;
}
const kRight = () => krun.hist.filter(h => h[1]).length, kWrong = () => krun.hist.filter(h => !h[1]).map(h => h[0]);

function kAnswer(ok) {
  if (!krun || krun.i >= krun.ids.length) return;
  const id = krun.ids[krun.i], s = kstat[id] || [0, 0, false];
  s[ok ? 0 : 1]++; s[2] = ok; kstat[id] = s; kSave(KSTAT_KEY, kstat);
  krun.hist.push([id, ok]); krun.i++; kflip = false; kSave(KRUN_KEY, krun);
  sfx(ok ? 'ok' : 'wrong');
  if (krun.i >= krun.ids.length) sfx('goal');
  kFly(ok ? 1 : -1);
}
function kUndo() {
  if (!krun || !krun.hist.length) return;
  const [id, ok] = krun.hist.pop(), s = kstat[id];
  if (s) { s[ok ? 0 : 1] = Math.max(0, s[ok ? 0 : 1] - 1); s[2] = false; }
  kSave(KSTAT_KEY, kstat); krun.i = Math.max(0, krun.i - 1); kflip = false; kSave(KRUN_KEY, krun);
  drawKarten(); renderKartenPanel();
}
function kFlip() { if (!krun || krun.i >= krun.ids.length) return; kflip = !kflip; const f = $('#cards .fc'); if (f) f.classList.toggle('flipped', kflip); }
// Karte fliegt zur Seite hinaus, dann kommt die nächste
function kFly(dir) {
  const f = $('#cards .fc');
  if (!f || reduced()) { drawKarten(); renderKartenPanel(); return; }
  f.style.transition = 'transform .28s ease-in, opacity .28s ease-in';
  f.style.transform = `translateX(${dir * 120}%) rotate(${dir * 14}deg)`; f.style.opacity = '0';
  setTimeout(() => { drawKarten(); renderKartenPanel(); }, 230);
}

// Hausnummer weglassen (vom Nutzer gewünscht): „Schottenring 7-9“ -> „Schottenring“, „Rennweg 99 / Rinnböckstraße 1“ ->
// „Rennweg / Rinnböckstraße“; Nummern, die zum Namen gehören („7. Haidequerstraße“, „Objekt 1“), bleiben
const ohneNr = s => s.replace(/(?<!Objekt)\s+\d+[a-zA-Z]?(?:\s*[-\/]\s*\d+[a-zA-Z]?)*(?:\s+und\s+\d+)?(?=\s*(?:$|\/|\(|\)|bzw\.))/g, '').replace(/\s+bzw\.\s+/, ' bzw. ');
function bezirkText(adr) {
  const m = adr.match(/^(\d{1,2})\.,\s*(.*)$/);
  return m ? { bez: `${m[1]}. Bezirk · ${BEZIRKE[+m[1] - 1] || ''}`, str: ohneNr(m[2]) } : { bez: '', str: ohneNr(adr) };
}
// Kartenstapel in der Fläche der Karte
function drawKarten() {
  const box = $('#cards'); box.innerHTML = '';
  if (!kValid()) kNewDeck();
  const n = krun.ids.length, done = krun.i >= n, right = kRight(), wrong = kWrong();
  const top = el('div', 'fc-top');
  const prog = el('div', 'fc-prog'), bar = el('i'); bar.style.width = (n ? 100 * krun.i / n : 0) + '%'; prog.append(bar);
  const cnt = el('div', 'fc-cnt');
  cnt.append(el('span', 'fc-ok', `✓ ${right}`), el('span', 'fc-pos', n ? `${Math.min(krun.i + 1, n)} / ${n}` : '0 / 0'), el('span', 'fc-bad', `✕ ${wrong.length}`));
  top.append(prog, cnt); box.append(top);
  const stage = el('div', 'fc-stage'); box.append(stage);
  if (!n) {
    const e = el('div', 'fc-end'); e.append(el('b', '', 'Keine Karten'), el('span', '', kset.falsch ? 'In dieser Auswahl ist keine Karte mehr falsch. Schalte „Falsch“ aus oder wähle andere Kategorien.' : 'Wähle links mindestens eine Kategorie.'));
    stage.append(e); return;
  }
  if (done) {
    const e = el('div', 'fc-end');
    const pct = Math.round(100 * right / n);
    e.append(el('small', '', 'Stapel fertig'), el('b', '', `${right} von ${n} gewusst`), el('span', '', pct === 100 ? 'Alles gewusst – stark!' : `${pct} %`));
    const row = el('div', 'fc-endbtns');
    if (wrong.length) { const b = el('button', 'btn primary', `Falsche wiederholen (${wrong.length})`); b.type = 'button'; b.onclick = () => { kDeck(wrong); drawKarten(); renderKartenPanel(); }; row.append(b); }
    const all = el('button', 'btn', 'Ganzen Stapel nochmal'); all.type = 'button'; all.onclick = () => { kNewDeck(); drawKarten(); renderKartenPanel(); };
    row.append(all); e.append(row);
    if (krun.hist.length) { const u = el('button', 'fc-undo', '↶ Letzte Karte zurück'); u.type = 'button'; u.onclick = kUndo; e.append(u); }
    stage.append(e); return;
  }
  const c = KARTEN_BY_ID.get(krun.ids[krun.i]), b = bezirkText(c.adr);
  const fc = el('div', 'fc' + (kflip ? ' flipped' : '')); fc.tabIndex = 0; fc.setAttribute('role', 'button'); fc.setAttribute('aria-label', 'Karte umdrehen');
  const inner = el('div', 'fc-inner');
  const front = el('div', 'fc-face fc-front'); front.append(el('small', '', KARTEN[c.kat].name), el('b', '', c.name), el('span', 'fc-tip', 'Tippen zum Umdrehen'));
  const back = el('div', 'fc-face fc-back'); back.append(el('small', '', c.name), el('b', '', b.str), el('span', 'fc-bez', b.bez));
  inner.append(front, back); fc.append(inner, el('span', 'fc-stamp ok', 'Gewusst'), el('span', 'fc-stamp bad', 'Nochmal'));
  stage.append(fc);
  // nächste Karte schon darunter andeuten
  if (krun.i + 1 < n) stage.prepend(el('div', 'fc-next'));
  const btns = el('div', 'fc-btns');
  const no = el('button', 'fc-btn bad'); no.type = 'button'; no.title = 'Nicht gewusst (←)'; no.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>'; no.onclick = () => kAnswer(false);
  const un = el('button', 'fc-btn undo'); un.type = 'button'; un.title = 'Letzte Karte zurück (Pfeil nach unten)'; un.disabled = !krun.hist.length; un.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>'; un.onclick = kUndo;
  const yes = el('button', 'fc-btn ok'); yes.type = 'button'; yes.title = 'Gewusst (→)'; yes.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'; yes.onclick = () => kAnswer(true);
  btns.append(no, un, yes); box.append(btns);
  box.append(el('p', 'fc-keys', 'Leertaste: umdrehen · Pfeil rechts: gewusst · Pfeil links: nicht gewusst · Pfeil runter: zurück'));
  kDragInit(fc);
}
// Wischen: Karte folgt dem Finger, ab ~90 px zählt es als Antwort, sonst ist es ein Tipp zum Umdrehen
function kDragInit(fc) {
  fc.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    kdrag = { x: e.clientX, y: e.clientY, dx: 0, moved: false, id: e.pointerId }; fc.setPointerCapture(e.pointerId); fc.style.transition = 'none';
  });
  fc.addEventListener('pointermove', e => {
    if (!kdrag || e.pointerId !== kdrag.id) return;
    kdrag.dx = e.clientX - kdrag.x; if (Math.abs(kdrag.dx) > 6) kdrag.moved = true;
    fc.style.transform = `translateX(${kdrag.dx}px) rotate(${kdrag.dx / 22}deg)`;
    const k = Math.min(1, Math.abs(kdrag.dx) / 90);
    fc.querySelector('.fc-stamp.ok').style.opacity = kdrag.dx > 0 ? k : 0;
    fc.querySelector('.fc-stamp.bad').style.opacity = kdrag.dx < 0 ? k : 0;
  });
  const end = e => {
    if (!kdrag || e.pointerId !== kdrag.id) return;
    const { dx, moved } = kdrag; kdrag = null;
    if (Math.abs(dx) > 90) { kAnswer(dx > 0); return; }
    fc.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; fc.style.transform = '';
    fc.querySelectorAll('.fc-stamp').forEach(s => { s.style.opacity = 0; });
    if (!moved && e.type === 'pointerup') kFlip();
  };
  fc.addEventListener('pointerup', end); fc.addEventListener('pointercancel', end);
  fc.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); kFlip(); } });
}
document.addEventListener('keydown', e => {
  if (state.mode !== 'karten' || e.metaKey || e.ctrlKey || e.altKey || (e.target instanceof Element && e.target.closest('input, textarea, select'))) return;
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); kFlip(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); kAnswer(true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); kAnswer(false); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); kUndo(); }
});

// Leiste links: Kategorien wählen, Lernstand, Stapel neu mischen
function renderKarten(p) { p.append(el('div', 'kpanel')); renderKartenPanel(); drawKarten(); setTimeout(() => map.invalidateSize(), 0); }
function renderKartenPanel() {
  const p = $('#play .kpanel'); if (!p) return; p.innerHTML = '';
  const tot = KARTEN_ALL.length, kn = KARTEN_ALL.filter(c => known(c.id)).length;
  const head = el('div', 'k-head');
  head.append(el('h2', 'h-title', 'Adressen lernen'), el('p', 'hint', `${kn} von ${tot} Adressen gewusst`));
  const pb = el('div', 'prog'), pf = el('i'); pf.style.width = (100 * kn / tot) + '%'; pb.append(pf); head.append(pb);
  p.append(head);
  const opts = el('div', 'k-opts');
  const tog = (key, label) => {
    const b = el('button', 'k-tog' + (kset[key] ? ' on' : ''), label); b.type = 'button'; b.setAttribute('aria-pressed', !!kset[key]);
    b.onclick = () => {
      kset[key] = !kset[key];
      if (kset[key]) kset[key === 'mischen' ? 'falsch' : 'mischen'] = false;
      kSave(KSET_KEY, kset); kNewDeck(); drawKarten(); renderKartenPanel();
    };
    return b;
  };
  opts.append(tog('mischen', 'Gemischt'));
  // „Falsch“ erst, wenn eine Karte falsch beantwortet wurde
  const nf = kWrongIds().length;
  if (nf || kset.falsch) { const f = tog('falsch', 'Falsch '); f.append(el('span', 'k-cnt', String(nf))); opts.append(f); }
  p.append(opts);
  const sec = el('div', 'k-sec'); sec.append(el('h3', '', 'Kategorien'));
  const allOn = kset.kat.length === KARTEN.length;
  const ab = el('button', 'pillbtn', allOn ? 'Keine' : 'Alle'); ab.type = 'button';
  ab.onclick = () => { kset.kat = allOn ? [] : KARTEN.map((_, i) => i); kSave(KSET_KEY, kset); kNewDeck(); drawKarten(); renderKartenPanel(); };
  sec.append(ab); p.append(sec);
  const list = el('div', 'k-kats');
  KARTEN.forEach((k, i) => {
    const ids = k.karten.map(([name]) => k.name + '|' + name), kk = ids.filter(known).length, on = kset.kat.includes(i);
    const b = el('button', 'k-kat' + (on ? ' on' : '')); b.type = 'button'; b.setAttribute('aria-pressed', on);
    const dots = el('span', 'k-bar'), f = el('i'); f.style.width = (100 * kk / ids.length) + '%'; dots.append(f);
    b.append(el('span', 'k-check'), el('span', 'k-name', k.name), el('span', 'k-n', `${kk}/${ids.length}`), dots);
    b.onclick = () => { kset.kat = on ? kset.kat.filter(x => x !== i) : kset.kat.concat(i).sort((a, b2) => a - b2); kSave(KSET_KEY, kset); kNewDeck(); drawKarten(); renderKartenPanel(); };
    list.append(b);
  });
  p.append(list);
  const rs = el('button', 'btn k-reset', 'Lernstand der Karteikarten löschen'); rs.type = 'button';
  rs.onclick = () => { if (!confirm('Lernstand aller Karteikarten wirklich löschen?')) return; kstat = {}; kSave(KSTAT_KEY, kstat); kNewDeck(); drawKarten(); renderKartenPanel(); };
  p.append(rs, el('p', 'k-src', 'Quelle: WKO-Fragenkatalog 2026, Ortskunde – Adressen'));
}
