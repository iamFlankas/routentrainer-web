<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routentrainer Wien</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: große abgerundete Karte links (mit schwebenden Glas-Knöpfen), helle Leiste rechts; am Handy Karte oben, Leiste darunter */
:root {
  --page: #c9c8c4; --panel: #e9e8e4; --card: #ffffff; --fg: #141414; --muted: #8a8984; --line: #dcdad4; --soft: #f3f2ee;
  --dark: #151515; --dark-fg: #f4f3ef; --dark-muted: #9a9993;
  --acc: #f6b234; --acc-ink: #1a1a1a;
  --route: #f59f0b; --route-ink: #1a1a1a; --warn: #3d6bff;
  --good: #1f8a45; --good-bg: #e2f3e8; --bad: #d23b2f; --bad-bg: #fbe5e2;
  --glass: rgba(28, 28, 28, .46); --glass-line: rgba(255, 255, 255, .22);
  --font: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --r: 30px; --gap: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0b0b0c; --panel: #19191a; --card: #232325; --fg: #f2f1ed; --muted: #9b9a95; --line: #333335; --soft: #2b2b2e;
  --dark: #0f0f10; --good: #6fd08d; --good-bg: #1d3324; --bad: #ff8a80; --bad-bg: #3a1f1c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0b0b0c; --panel: #19191a; --card: #232325; --fg: #f2f1ed; --muted: #9b9a95; --line: #333335; --soft: #2b2b2e;
  --dark: #0f0f10; --good: #6fd08d; --good-bg: #1d3324; --bad: #ff8a80; --bad-bg: #3a1f1c; color-scheme: dark; }
/* Dark Mode: dieselbe basemap.at-Karte, nur dunkel gefiltert (Schrift bleibt lesbar) */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.55); } }
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.55); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--fg); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: 1fr minmax(360px, 440px); gap: var(--gap); padding: var(--gap); }

/* --- Karte --- */
.mapwrap { position: relative; border-radius: var(--r); overflow: hidden; background: #e7e5df; min-height: 0; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
#map { position: absolute; inset: 0; background: #e7e5df; }
.leaflet-container { background: #e7e5df; font-family: var(--font); }
.scrim { position: absolute; left: 0; right: 0; top: 0; height: 240px; background: linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.34) 55%, transparent); pointer-events: none; z-index: 1001; }
.maphead { position: absolute; left: 30px; top: 26px; z-index: 1002; color: #fff; pointer-events: none; max-width: 40%; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 1.5rem; letter-spacing: -.01em; }
.logo { font: 700 .62rem/1 var(--font); letter-spacing: .1em; background: var(--acc); color: var(--acc-ink); padding: 5px 6px; border-radius: 6px; }
.maphead h1 { font-weight: 500; font-size: 1.75rem; letter-spacing: -.02em; margin: 30px 0 4px; }
.maphead p { margin: 0; font-size: .95rem; opacity: .9; }
.maphead, .brand { text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.tabs { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 1002; display: flex; gap: 8px; }
.gbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--glass-line); background: var(--glass); color: #fff; cursor: pointer; padding: 0; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); transition: background .2s, transform .15s; position: relative; }
.gbtn:hover { background: rgba(28,28,28,.62); }
.gbtn:active { transform: scale(.94); }
.gbtn svg { width: 20px; height: 20px; }
.tab.on { background: #fff; color: #141414; border-color: #fff; }
.tab.on::after { content: ""; position: absolute; bottom: -9px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #fff; }
.mapctl { position: absolute; right: 22px; bottom: 34px; z-index: 1002; display: flex; flex-direction: column; gap: 10px; }
.geo-pill { position: absolute; left: 22px; bottom: 26px; z-index: 1002; max-width: 46%; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); color: #fff; font-size: .85rem; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.geo-pill svg { flex: none; width: 18px; height: 18px; opacity: .85; }
#geo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#geo.bad { color: #ffb4ac; }
.leaflet-top.leaflet-right { top: 14px; right: 14px; }
.leaflet-control-attribution { font-size: 10px; border-radius: 8px 0 0 0; }

/* schwebende Routenkarte auf der Karte */
.routecard { position: absolute; left: 30px; top: 214px; z-index: 1002; width: 340px; }
.rc { background: var(--card); color: var(--fg); border-radius: 26px; padding: 20px 22px 18px; box-shadow: 0 18px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 16px; }
.rc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.rc-top b { display: block; font-weight: 500; font-size: 1.3rem; letter-spacing: -.01em; }
.rc-top .sub { display: block; font-size: 1.02rem; line-height: 1.25; }
.status { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
.rc-stats { display: flex; align-items: flex-end; gap: 20px; }
.rc-stats > div { display: flex; flex-direction: column; gap: 6px; }
.rc-stats small { color: var(--muted); font-size: .8rem; }
.rc-len { margin-left: auto; text-align: right; font-size: .9rem; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--soft); font-weight: 500; font-size: .9rem; }
.tag.acc { background: var(--acc); color: var(--acc-ink); }
.tag svg { width: 16px; height: 16px; }
.rc-close { margin: 12px 0 0 147px; }

/* --- Leiste rechts --- */
.panel { background: var(--panel); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.topbar { display: flex; gap: 10px; align-items: center; padding: 22px 22px 6px; }
.search { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 999px; padding: 0 16px; height: 48px; }
.search svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: .95rem; }
.search input::placeholder { color: var(--muted); }
.search:focus-within { box-shadow: 0 0 0 2px var(--acc); }
.iconbtn { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:hover { box-shadow: inset 0 0 0 1px var(--line); }
.scroll { overflow-y: auto; padding: 18px 22px 26px; display: flex; flex-direction: column; gap: 16px; min-height: 0; flex: 1; }
.btn:focus-visible, .opt:focus-visible, .choice:focus-visible, .rt:focus-visible, .gbtn:focus-visible, .iconbtn:focus-visible, .chipbtn:focus-visible, .pillbtn:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

#head { display: flex; flex-direction: column; gap: 14px; }
.h-title { font-weight: 500; font-size: 2rem; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
.h-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-weight: 500; font-size: .85rem; padding: 4px 11px; border-radius: 999px; background: var(--acc); color: var(--acc-ink); }
.badge.soft { background: var(--card); color: var(--muted); }
.card { background: var(--card); border-radius: 26px; padding: 18px 20px; }
.card.lern { display: flex; flex-direction: column; gap: 14px; }
.card.lern .btn:not(.primary) { background: var(--soft); }
.tl-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.tl-top > span:first-child { color: var(--muted); font-size: 1.05rem; }
.tl-line { position: relative; display: flex; align-items: center; justify-content: space-between; height: 40px; }
.tl-line::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 2px solid var(--acc); }
.tl-line i { position: relative; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--acc); background: var(--card); }
.tl-mid { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; box-shadow: 0 0 0 6px var(--card); }
.tl-mid svg { width: 20px; height: 20px; }
.tl-names { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; font-size: .95rem; line-height: 1.25; }
.tl-names span:last-child { text-align: right; }
.hint { margin: 0; color: var(--muted); }
#score:empty { display: none; }
#score { align-self: flex-start; font-weight: 500; font-size: .85rem; color: var(--bad); background: var(--bad-bg); padding: 4px 12px; border-radius: 999px; }
#play { display: flex; flex-direction: column; gap: 12px; }
#play:empty { display: none; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--card); font-weight: 500; font-size: .92rem; }
.chip small { font-size: .74rem; color: var(--muted); font-weight: 400; }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.diff { background: var(--bad-bg); color: var(--bad); }
.chip.dest { background: var(--acc); color: var(--acc-ink); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; }
.chain:empty { display: none; }
.chain .chip:not(:last-child)::after { content: "›"; margin-left: 4px; color: var(--muted); }
.choice .chain .chip { background: var(--soft); }
.choice .chain .chip.diff { background: var(--bad-bg); }
.chain.small .chip { font-size: .82rem; padding: 3px 9px; }

/* Schritte als Zeitleiste */
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; counter-reset: s; }
ol.steps li { position: relative; display: flex; align-items: center; gap: 12px; padding: 5px 0; cursor: pointer; counter-increment: s; }
ol.steps li::before { content: counter(s); flex: none; position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 600; background: var(--card); border: 2px solid var(--line); color: var(--muted); }
ol.steps li:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 50%; height: 100%; border-left: 2px solid var(--line); }
ol.steps li .chip { background: none; padding: 2px 0; font-size: .98rem; }
ol.steps li.past::before { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
ol.steps li.past::after { border-color: var(--acc); }
ol.steps li.next::before { border-style: dashed; border-color: var(--fg); color: var(--fg); }
ol.steps li.now::before { background: var(--fg); border-color: var(--fg); color: var(--card); }
ol.steps li.now .chip { font-weight: 600; }
ol.steps li.dest::before { content: "★"; background: var(--fg); border-color: var(--fg); color: var(--card); }
ol.steps li.dest .chip { background: var(--acc); color: var(--acc-ink); padding: 4px 12px; }

.notice { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; background: var(--bad-bg); font-size: .9rem; }
.notice strong { color: var(--bad); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-weight: 500; font-size: .92rem; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--soft); cursor: pointer; }
.btn:hover { box-shadow: inset 0 0 0 1px var(--line); }
.btn.primary { background: var(--fg); color: var(--card); }
.btn:disabled { opacity: .4; cursor: default; }
.playbtn { display: inline-flex; align-items: center; gap: 8px; }
.rnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav-b { width: 38px; height: 38px; padding: 0 0 3px; font-size: 1.3rem; line-height: 1; }
.nav-t { font-size: .85rem; color: var(--muted); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { padding: 14px 16px; border: 0; border-radius: 20px; background: var(--card); cursor: pointer; text-align: left; }
.opt .chip { background: none; padding: 0; font-size: 1rem; }
.opt:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.opt.no { background: var(--bad-bg); color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.choice { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; text-align: left; padding: 14px; border: 0; border-radius: 22px; background: var(--card); cursor: pointer; }
.choice:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--fg); }
.choice .letter { font-weight: 600; font-size: 1.05rem; background: var(--acc); color: var(--acc-ink); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; }
.choice .why { grid-column: 2; font-size: .85rem; color: var(--bad); }
.choice.right { box-shadow: inset 0 0 0 2px var(--good); }
.choice.wrong { box-shadow: inset 0 0 0 2px var(--bad); }
.choice:disabled { cursor: default; }
.result { margin: 0; padding: 14px 16px; border-radius: 20px; display: flex; flex-direction: column; gap: 4px; }
.result.good { background: var(--good-bg); color: var(--good); }
.result.bad { background: var(--bad-bg); color: var(--bad); }
.feedback { margin: 0; color: var(--bad); font-weight: 500; }
.feedback:empty { display: none; }
.prog { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--acc); border-radius: 3px; transition: width .3s; }

/* Routenliste: dunkle Karten */
.sec { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.sec h3 { margin: 0; font-weight: 500; font-size: 1.4rem; letter-spacing: -.01em; }
.sec h3 small { font-size: .85rem; color: var(--muted); font-weight: 400; margin-left: 4px; }
.pillbtn { border: 0; background: var(--card); border-radius: 999px; padding: 9px 16px; font-size: .88rem; cursor: pointer; }
.pillbtn:hover { box-shadow: inset 0 0 0 1px var(--line); }
#chapbox { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -4px -22px 0; padding: 0 22px; }
#chapbox::-webkit-scrollbar { display: none; }
.chipbtn { flex: none; border: 0; background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: .85rem; cursor: pointer; white-space: nowrap; }
.chipbtn b { font-weight: 600; margin-right: 4px; }
.chipbtn.on { background: var(--fg); color: var(--card); }
#routes { display: flex; flex-direction: column; gap: 8px; }
.chap-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .85rem; color: var(--muted); padding: 10px 6px 0; }
.chap-h b { font-weight: 600; color: var(--fg); }
.rt { display: grid; grid-template-columns: 52px 1fr; gap: 4px 12px; align-items: center; text-align: left; padding: 14px 18px 14px 16px; border: 0; border-radius: 24px; background: var(--dark); color: var(--dark-fg); cursor: pointer; position: relative; overflow: hidden; }
.rt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 74px; opacity: .13; background:
  linear-gradient(115deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 34px 30px,
  linear-gradient(25deg, transparent 46%, #fff 47%, #fff 49%, transparent 50%) 0 0 / 26px 38px;
  -webkit-mask: linear-gradient(90deg, #000 40%, transparent); mask: linear-gradient(90deg, #000 40%, transparent); }
.rt:hover { background: #242424; }
.rt.on { box-shadow: 0 0 0 3px var(--acc); }
.rt-n { position: relative; font-weight: 500; font-size: 1.4rem; letter-spacing: -.02em; }
.rt-body { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rt-line { position: relative; display: flex; align-items: center; justify-content: space-between; height: 22px; }
.rt-line::before { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; border-top: 1.5px solid var(--acc); }
.rt-line > i { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--acc); }
.rt-mid { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--dark); font-size: .78rem; color: var(--dark-muted); }
.rt:hover .rt-mid { background: #242424; }
.rt-lv { display: inline-flex; gap: 3px; }
.rt-lv i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--dark-muted); }
.rt-lv i.f { background: var(--acc); border-color: var(--acc); }
.rt-names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: .9rem; line-height: 1.2; }
.rt-names span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rt-to { text-align: right; }
.empty { color: var(--muted); text-align: center; padding: 20px 0; margin: 0; }
.foot { font-size: .78rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
.foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: inherit; cursor: pointer; padding: 0; }

/* Filter (Leaflet-Steuerung oben rechts) */
.filterctl { font: 14px var(--font); color: #141414; display: flex; flex-direction: column; align-items: flex-end; }
.fbtn b { position: absolute; top: -3px; right: -3px; background: var(--acc); color: var(--acc-ink); border-radius: 9px; min-width: 18px; padding: 0 5px; font-size: 11px; line-height: 18px; text-align: center; }
.fbtn b:empty { display: none; }
.fpanel { margin-top: 8px; background: #fff; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,.25); padding: 8px; width: 280px; display: flex; flex-direction: column; }
.frow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; cursor: pointer; }
.frow:hover { background: #f3f2ee; }
.frow input { width: 18px; height: 18px; accent-color: #141414; margin: 0; }
.fl { display: block; font-weight: 500; }
.fs { display: block; font-size: 12px; color: #8a8984; }
.fst { font-size: 11px; color: #d23b2f; white-space: nowrap; }
.bez { display: inline-block; font: 600 12px var(--font); letter-spacing: .04em; text-transform: uppercase; color: #5b4b8a; background: rgba(255,255,255,.8); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }

/* Marker, Pfeile, Schilder auf der Karte */
.leaflet-marker-icon.arrow { background: none; border: 0; }
.arrow svg { display: block; transform-origin: 50% 50%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.arrow .pass { display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--route); border: 2px solid #fff; opacity: .9; }
.arrow .blink { display: block; width: 30px; height: 30px; border-radius: 50%; background: var(--warn); border: 3px solid #fff; animation: blink .5s ease-in-out 5 alternate; }
@keyframes blink { from { opacity: 1; transform: scale(1); } to { opacity: .15; transform: scale(.6); } }
.leaflet-tooltip.headlabel { background: var(--route); color: var(--route-ink); border: 0; border-radius: 999px; font: 600 13px var(--font); padding: 3px 10px; box-shadow: 0 2px 6px rgba(0,0,0,.3); opacity: .95 !important; }
.leaflet-tooltip.headlabel::before { display: none; }
.leaflet-tooltip { font-family: var(--font); border-radius: 10px; }
.skiplabel { position: absolute; transform: translate(-50%, -150%); background: var(--bad); color: #fff; font: 600 13px var(--font); padding: 3px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: opacity .5s ease; }
.fade .skiplabel { opacity: 0; }
.pinmarker { overflow: visible; }
.pinwrap { position: relative; display: block; width: 0; height: 0; }
.pindot { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.pindot.start { background: var(--acc); }
.pindot.goal { background: #141414; }
.pinstem { position: absolute; left: 0; top: -1px; height: 2px; background: rgba(20,20,20,.75); transform-origin: 0 50%; }
.pinwrap .pin { position: absolute; transform: translate(-50%, -50%); cursor: pointer; }
.pin { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 3px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.3); white-space: nowrap; font: 600 10px/1 var(--font); letter-spacing: .08em; }
.pin.start { background: #fff; color: #141414; }
.pin.goal { background: #141414; color: #fff; }
.ico { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; border-radius: 999px; }
.ico.taxi { background: var(--acc); color: var(--acc-ink); padding: 0 5px; font: 700 9px/1 var(--font); letter-spacing: .06em; }
.ico.hotel { background: #1d5fbf; color: #fff; }
.ico.ort { background: #7a4b2a; color: #fff; }
.ico.klinik { background: #c4262e; color: #fff; }
.ico.bahn { background: #2f6b3a; color: #fff; }
.ico.flug { background: #44506b; color: #fff; }
.ico.lm { height: 24px; min-width: 24px; }

/* Handy: Karte oben (sticky), Leiste darunter, Modus-Knöpfe unten auf der Karte */
@media (max-width: 760px) {
  :root { --gap: 0px; }
  .app { display: flex; flex-direction: column; height: auto; min-height: 100%; padding: 0; }
  .mapwrap { position: sticky; top: 0; z-index: 1; height: 56vh; height: 56dvh; flex: none; border-radius: 0 0 28px 28px; }
  .maphead { left: max(18px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); max-width: 62%; }
  .brand { font-size: 1.15rem; }
  .maphead h1 { font-size: 1.35rem; margin-top: 10px; }
  .maphead p { font-size: .85rem; }
  .scrim { height: 160px; }
  .tabs { top: auto; bottom: 40px; }
  .tab.on::after { display: none; }
  .mapctl { right: 14px; bottom: 98px; gap: 8px; }
  .mapctl .gbtn { width: 40px; height: 40px; }
  .geo-pill { left: 14px; bottom: 98px; max-width: 62%; }
  .leaflet-control-attribution { font-size: 9px; }
  .geo-pill:has(#geo:not(.bad)) { display: none; }
  .routecard { display: none; }
  .leaflet-top.leaflet-right { top: max(8px, env(safe-area-inset-top)); right: 6px; }
  .panel { border-radius: 0; overflow: visible; }
  .topbar { padding: 16px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .scroll { overflow: visible; padding: 16px max(16px, env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #chapbox { margin: -4px -16px 0; padding: 0 16px; }
  .h-title { font-size: 1.6rem; }
  .opts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

  state.errors++; $('#score').textContent = state.errors + ' Fehler';
  const fb = $('#fb');
  if (fb) fb.textContent = wrongSide ? `Richtige Straße, aber falsche Richtung – die Route fährt den anderen Teil von ${prettyKey(want)}.` : near ? `Das ist ${prettyKey(near)} – nicht die nächste Straße.` : 'Da ist keine Straße. Zoom näher heran und tipp direkt auf die Straße.';
}
function prettyKey(k) { return POOL.get(k) || k; }
map.on('click', onMapClick);

function progress() { const d = el('div', 'prog'); const f = el('i'); f.style.width = (100 * state.step / state.route.steps.length) + '%'; d.append(f); return d; }
function finish(p) {
  showPoints(true);
  const r = state.route, perfect = state.errors === 0;
  if (!state.done) { state.done = true; record(r.n, perfect); }
  const box = el('div', 'result ' + (perfect ? 'good' : 'bad'));
  box.append(el('strong', '', perfect ? 'Fehlerfrei – Ziel erreicht.' : (state.errors >= 99 ? 'Lösung angezeigt.' : `Ziel erreicht mit ${state.errors} Fehler${state.errors === 1 ? '' : 'n'}.`)));
  box.append(el('div', '', 'Ziel: ' + r.dest));
  p.append(box, nextBar()); fitRoute();
}
function nextBar() {
  const bar = el('div', 'bar');
  const again = el('button', 'btn', 'Nochmal'); again.onclick = reset;
  const nx = el('button', 'btn primary', 'Nächste Route'); nx.onclick = () => nextRoute(false);
  const rnd = el('button', 'btn', 'Zufällig (schwache zuerst)'); rnd.onclick = () => nextRoute(true);
  bar.append(again, nx, rnd); return bar;
}

document.addEventListener('keydown', e => {
  if (state.mode !== 'lernen' || !state.open || e.target.closest('input, textarea, select')) return;
  const V = inChap(), i = V.indexOf(state.route);
  if (e.key === 'ArrowRight') { e.preventDefault(); openRoute(V[(i + 1) % V.length]); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); openRoute(V[(i - 1 + V.length) % V.length]); }
});
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.mode = t.dataset.mode; reset(); renderList(); $('#score').textContent = ''; });
$('#shuffle').onclick = () => { if (state.mode === 'lernen') state.open = true; nextRoute(true); scrollPanelTop(); };
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
// Knöpfe auf der Karte
$('#zin').onclick = () => { camSeq++; map.zoomIn(); };
$('#zout').onclick = () => { camSeq++; map.zoomOut(); };
$('#zfit').onclick = () => { camSeq++; if (shown()) fitRoute(); else map.flyTo([48.2085, 16.3725], 13, { duration: reduced() ? 0 : 0.8 }); };
// Darstellung: wie das System, hell oder dunkel (im Dunklen wird die Karte gefiltert)
const THEME_KEY = 'taxi-theme-v1', THEMES = ['auto', 'light', 'dark'];
const THEME_NAME = { auto: 'wie das System', light: 'hell', dark: 'dunkel' };
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
};
let theme = 'auto';
try { const t = localStorage.getItem(THEME_KEY); if (THEMES.includes(t)) theme = t; } catch (e) {}
function applyTheme() {
  if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  const b = $('#theme'); b.innerHTML = THEME_ICON[theme]; b.title = 'Darstellung: ' + THEME_NAME[theme]; b.setAttribute('aria-label', b.title);
}
$('#theme').onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} applyTheme(); };
applyTheme();
$('#reload').onclick = async () => { try { localStorage.removeItem(GEO_KEY); } catch (e) {} await idbDel(IDB_KEY); await idbDel('strassennetz-1bez-v3'); STREETS = null; render(); loadStreets(); };
idbDel('strassennetz-1bez-v3');
renderList(); render(); loadStreets();

</script>
