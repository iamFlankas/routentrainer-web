t":"Nein – das Umherfahren, um Fahrgäste zu gewinnen, ist verboten","richtig":"Nein","falsch":["Ja, in der ganzen Stadt","Ja, aber nur in der Nacht","Ja, aber nur im 1. Bezirk"],"quelle":"§ 15 Abs. 1 LBO"},{"nr":"31b","frage":"Dürfen Sie Fahrgäste an Straßenbahn- und Omnibushaltestellen anwerben?","antwort":"Nein – außer ein Gesetz erlaubt Taxis ausdrücklich als Ersatz für Bahn oder Bus","richtig":"Nein (außer bei gesetzlich erlaubtem Ersatzverkehr)","falsch":["Ja, immer","Ja, wenn die Straßenbahn Verspätung hat","Ja, aber nur am Wochenende"],"quelle":"§ 15 Abs. 1 LBO"},{"nr":"31c","frage":"Dürfen Sie Fahrgäste ablehnen?","antwort":"Nein – nur wenn ein Ausschließungsgrund vorliegt (Beförderungspflicht)","richtig":"Nein, nur bei einem Ausschließungsgrund","falsch":["Ja, ohne Begründung","Ja, wenn man keine Lust hat","Ja, wenn der Fahrgast kein Deutsch spricht"],"quelle":"§ 9, § 12 LBO"},{"nr":"31d","frage":"Dürfen Sie Fahrgäste wegen einer kurzen Fahrt ablehnen?","antwort":"Nein – eine kurze Strecke ist kein Ausschließungsgrund","richtig":"Nein","falsch":["Ja, unter 2 km","Ja, wenn man lange am Standplatz gewartet hat","Ja, in der Nacht"],"quelle":"§ 9, § 12 LBO"},{"nr":"32","frage":"Wie haben sich Taxis auf den Standplätzen aufzustellen?","antwort":"In der Reihenfolge der Ankunft hinter den schon wartenden Taxis anstellen\nPlatzsparend, sodass jedes Taxi ohne Behinderung oder Gefährdung aus der Reihe fahren kann","richtig":"Nach der Ankunft hinten anreihen, platzsparend","falsch":["Beliebig, wo gerade Platz ist","Das neueste Taxi immer ganz vorne","Schräg, damit man schnell wegkommt"],"quelle":"§ 13 Abs. 2 Z 2 LBO"},{"nr":"33","frage":"Was haben Sie als Taxilenker zu tun, wenn am Taxistandplatz ein Taxi weggefahren ist?","antwort":"Nachrücken (anschließen)\nAn Taxis, die nicht nachrücken, darf man vorbeifahren","richtig":"Nachrücken; an nicht nachrückenden Taxis darf man vorbeifahren","falsch":["Stehen bleiben, bis der Lenker davor zurückkommt","Den Standplatz verlassen","Hupen, damit alle aufrücken"],"quelle":"§ 13 Abs. 2 Z 3 LBO"},{"nr":"34","frage":"Wer darf das Standplatztelefon bedienen?","antwort":"Der Lenker des ersten Taxis in der Reihe\nIst er verhindert oder nicht berechtigt, der Lenker des nächsten berechtigten Taxis","richtig":"Der Lenker des ersten Taxis, sonst der nächste berechtigte","falsch":["Jeder, der gerade in der Nähe ist","Nur der Lenker des letzten Taxis","Nur der Unternehmer"],"quelle":"früher § 34 Abs. 2 W-TMGB (in der LBO nicht mehr geregelt)","alt":true},{"nr":"35","frage":"Wo müssen sich Taxilenker, welche ihr Taxi am Taxistandplatz abgestellt haben, aufhalten?","antwort":"Beim Taxi oder in leicht erreichbarer Nähe – das Taxi muss stets fahrbereit sein","richtig":"Beim Taxi oder in leicht erreichbarer Nähe","falsch":["Irgendwo, Hauptsache das Handy ist eingeschaltet","Im Taxi mit laufendem Motor","Im nächsten Kaffeehaus"],"quelle":"§ 13 Abs. 2 Z 4 LBO"},{"nr":"36","frage":"Welches Taxi kann der Fahrgast wählen bzw. in welches Taxi kann der Fahrgast einsteigen?","antwort":"Jedes beliebige Taxi aus der Reihe – nicht nur das erste","richtig":"Ein beliebiges Taxi aus der Reihe","falsch":["Nur das erste Taxi","Nur das letzte Taxi","Das Taxi, das der Lenker am Standplatz zuweist"],"quelle":"§ 13 Abs. 3 LBO"},{"nr":"37","frage":"Welche Mindestangaben hat das Taxiunternehmerschild zu enthalten?","antwort":"Name und Standort des Unternehmens\nDas behördliche Kennzeichen des Taxis","richtig":"Name und Standort des Unternehmens sowie das Kennzeichen des Taxis","falsch":["Name und Foto des Lenkers","Telefonnummer und Öffnungszeiten","Die Tarifsätze"],"quelle":"§ 4 Abs. 3 Z 1 LBO"},{"nr":"38","frage":"Dürfen Sie mit dem Taxi bei Großveranstaltungen in einer Halteverbotszone stehen?","antwort":"Nein – die Betriebsordnung erlaubt bei großen Veranstaltungen nur, auch außerhalb von Standplätzen aufzufahren\nDie Verbote der StVO (Halte- und Parkverbote) gelten trotzdem","richtig":"Nein, Halteverbote der StVO gelten auch dann","falsch":["Ja, bei Veranstaltungen mit über 1.000 Besuchern","Ja, mit eingeschalteter Alarmblinkanlage","Ja, wenn der Lenker im Taxi bleibt"],"quelle":"§ 14 Abs. 2 LBO; StVO"},{"nr":"39","frage":"Welche Verpflichtung hat der Taxilenker bei Verunreinigung des Taxi-Kfz – soweit die Gefahr einer Beschmutzung der Fahrgäste oder deren Bekleidung besteht – zu erfüllen?","antwort":"Schmutz, der Fahrgäste oder ihre Kleidung beschmutzen könnte, sofort beseitigen","richtig":"Die Verunreinigung sofort beseitigen","falsch":["Bis zum Dienstende warten und dann reinigen","Den Fahrgast darauf hinweisen und weiterfahren","Eine Decke auf den Sitz legen"],"quelle":"§ 11 Z 6 LBO (früher § 2 Abs. 3 W-TMGB)","alt":true},{"nr":"40","frage":"Welcher Verpflichtung hat der Taxilenker bei einem Reifenschaden des Taxis nachzukommen?","antwort":"Ein funktionierendes Ersatzrad oder gleichwertiges Hilfsmittel (z. B. Reifenreparaturset) mitführen, damit die Fahrt fortgesetzt werden kann","richtig":"Ersatzrad oder gleichwertiges Hilfsmittel mitführen und verwenden","falsch":["Den Fahrgast aussteigen lassen und Feierabend machen","Mit dem kaputten Reifen langsam weiterfahren","Nichts – dafür ist der Pannendienst zuständig"],"quelle":"früher § 2 Abs. 4 W-TMGB; § 4 KDV","alt":true},{"nr":"41","frage":"Wenn ein Fahrgast das Taxi beschmutzt, wie verhalten Sie sich?","antwort":"Ruhig und höflich bleiben\nDer Fahrgast muss das Taxi schonend benützen – wer das nicht tut, kann von der Weiterfahrt ausgeschlossen werden\nDie Reinigungskosten kann man vom Fahrgast verlangen (Schadenersatz)\nVor der nächsten Fahrt das Taxi reinigen","richtig":"Höflich bleiben, Reinigungskosten verlangen, notfalls von der Weiterfahrt ausschließen","falsch":["Den Fahrgast sofort anzeigen","Nichts – das gehört zum Berufsrisiko","Den Fahrpreis verdoppeln"],"quelle":"§ 12 Abs. 1 und 2 LBO; Schadenersatz (ABGB)"},{"nr":"42","frage":"Dürfen Sie als Taxilenker Ihren eigenen Hund im Taxi mitbefördern?","antwort":"Nein – Sitzplätze, Fußraum und Kofferraum müssen für die Fahrgäste frei bleiben","richtig":"Nein, die Plätze müssen für Fahrgäste frei bleiben","falsch":["Ja, im Kofferraum","Ja, mit Maulkorb","Ja, wenn der Fahrgast zustimmt"],"quelle":"§ 11 Z 5 LBO"},{"nr":"43","frage":"Welche Angaben muss eine Taxirechnung enthalten?","antwort":"Wegstrecke in Kilometern\nFahrpreis\nDatum\nBehördliches Kennzeichen des Taxis\nName und Standort des Unternehmens mit Telefonnummer oder E-Mail\nKennnummer des Lenkers","richtig":"Wegstrecke, Fahrpreis, Datum, Kennzeichen, Unternehmen mit Kontakt und Kennnummer des Lenkers","falsch":["Name des Fahrgastes und Fahrtgrund","Nur den Fahrpreis und das Datum","Start- und Zieladresse und Unterschrift des Fahrgastes"],"quelle":"§ 11 Z 2 LBO"},{"nr":"44","frage":"Der gesamte Fahrpreis wird vom Fahrgast direkt nach Beendigung der Taxifahrt bezahlt. Müssen Sie dem Fahrgast – ohne Aufforderung – einen Beleg ausfolgen?","antwort":"Ja – eine Rechnung ist auszufolgen, außer der Fahrgast verzichtet darauf","richtig":"Ja, außer der Fahrgast verzichtet","falsch":["Nein, nur auf Verlangen","Nur bei Fahrten über 50 €","Nur bei Kartenzahlung"],"quelle":"§ 11 Z 2 LBO"},{"nr":"45","frage":"Muss der Fahrgast die Taxifahrt immer mit Bargeld bezahlen?","antwort":"Nein – bargeldloses Zahlen muss möglich sein, zumindest mit Bankomatkarte","richtig":"Nein, mindestens Bankomatkarte muss möglich sein","falsch":["Ja, Taxis nehmen nur Bargeld","Nein, aber nur Kreditkarten","Ja, außer bei Fahrten zum Flughafen"],"quelle":"§ 4 Abs. 6 LBO"},{"nr":"46","frage":"Welche Fahrzeuge dürfen ab 1. Jänner 2025 kraftfahrrechtlich erstmalig als Taxi zugelassen werden?","antwort":"Nur Fahrzeuge mit reinem Elektroantrieb – Strom aus Akku oder Wasserstoff-Brennstoffzelle\nAusnahme: rollstuhlgerechte Fahrzeuge","richtig":"Nur Fahrzeuge mit reinem Elektroantrieb (Akku oder Brennstoffzelle)","falsch":["Alle Fahrzeuge mit Euro-6-Norm","Auch Hybrid-Fahrzeuge","Nur Diesel-Fahrzeuge ab Baujahr 2020"],"quelle":"§ 4 Abs. 1a und 1b LBO"},{"nr":"47","frage":"Wie lange dürfen Ersatztaxis verwendet werden?","antwort":"Nur vorübergehend, höchstens 4 Wochen","richtig":"Höchstens 4 Wochen","falsch":["Höchstens 1 Woche","Höchstens 3 Monate","Unbegrenzt, solange das Taxi in der Werkstatt ist"],"quelle":"§ 7 Abs. 1 LBO"},{"nr":"48","frage":"Welche Kleidung haben Taxilenker zu tragen?","antwort":"Saubere, gepflegte Kleidung, die dem Beruf angemessen ist","richtig":"Saubere, gepflegte, dem Beruf angemessene Kleidung","falsch":["Eine gelbe Uniform mit Kappe","Anzug und Krawatte","Es gibt keine Vorschrift"],"quelle":"§ 11 Z 8 LBO"},{"nr":"49","frage":"In welcher Form muss der Text gemäß Anlage 1 (wesentliche Informationen für Fahrgäste), § 11a der aktuell gültigen Wiener Landesbetriebsordnung, im Innenraum des Fahrzeuges zur Verfügung stehen?","antwort":"Ausgedruckt und zusätzlich als QR-Code, der von jedem Sitzplatz aus gut sichtbar ist","richtig":"Ausgedruckt und als QR-Code, von jedem Sitzplatz gut sichtbar","falsch":["Nur als QR-Code am Taxischild","Nur auf der Website des Unternehmens","Nur auf Verlangen per E-Mail"],"quelle":"§ 11a LBO"}]},{"nr":"III","name":"Tarif","fragen":[{"nr":"1a","frage":"Wie hoch ist die Grundtaxe am Tag?","antwort":"3,80 € (werktags 6–23 Uhr, inkl. Umsatzsteuer)","richtig":"3,80 €","falsch":["4,30 €","3,20 €","2,50 €"],"quelle":"§ 3 Abs. 2 Wiener Taxitarif"},{"nr":"1b","frage":"Wie hoch ist die Grundtaxe in der Nacht?","antwort":"4,30 € (werktags 23–6 Uhr sowie an Sonn- und Feiertagen)","richtig":"4,30 €","falsch":["3,80 €","5,00 €","4,80 €"],"quelle":"§ 4 Abs. 2 Wiener Taxitarif"},{"nr":"2","frage":"Wie hoch ist die Zeittaxe für eine Stunde Wartezeit?","antwort":"Tag: 0,58 € pro Minute × 60 = 34,80 €\nNacht, Sonn- und Feiertag: 0,67 € pro Minute × 60 = 40,20 €","richtig":"Tag 34,80 €, Nacht/Sonn- und Feiertag 40,20 €","falsch":["Tag 20,00 €, Nacht 25,00 €","Tag 58,00 €, Nacht 67,00 €","Wartezeit wird nicht verrechnet"],"quelle":"§ 3 Abs. 4, § 4 Abs. 2 Wiener Taxitarif"},{"nr":"3a","frage":"Wie hoch ist die Streckentaxe am Tag pro Kilometer für die ersten 5 Kilometer und für die nachfolgenden Kilometer ab dem 5. Kilometer?","antwort":"Bis einschließlich 5 km: 0,95 € pro km\nAb dem 5. km: 0,58 € pro km\n(Fortschaltung in Schritten zu 20 Cent)","richtig":"0,95 € bis 5 km, danach 0,58 € pro km","falsch":["1,09 € bis 5 km, danach 0,67 € pro km","0,58 € bis 5 km, danach 0,95 € pro km","1,20 € pro km, egal wie weit"],"quelle":"§ 3 Abs. 3 Wiener Taxitarif"},{"nr":"3b","frage":"Wie hoch ist die Streckentaxe pro Kilometer für die ersten 5 Kilometer und für die nachfolgenden Kilometer ab dem 5. Kilometer in der Nacht bzw. an Sonn- und Feiertagen?","antwort":"Bis einschließlich 5 km: 1,09 € pro km\nAb dem 5. km: 0,67 € pro km\n(Tagtarif plus 15 %)","richtig":"1,09 € bis 5 km, danach 0,67 € pro km","falsch":["0,95 € bis 5 km, danach 0,58 € pro km","1,90 € bis 5 km, danach 1,16 € pro km","1,50 € pro km, egal wie weit"],"quelle":"§ 4 Abs. 2 Wiener Taxitarif"},{"nr":"4a","frage":"Wie hoch ist ein Zuschlag?","antwort":"2 € pro Zuschlag","richtig":"2 €","falsch":["1 €","3,80 €","10 % des Fahrpreises"],"quelle":"§ 5 Wiener Taxitarif"},{"nr":"4b","frage":"Wie viele Zuschläge verrechnen Sie für mittels Kommunikationsdiensten bestellte Fahrten?","antwort":"Einen Zuschlag von 2 € für die Bestellung\n(Bei mehr als 4 Fahrgästen kommt ein zweiter Zuschlag von 2 € dazu)","richtig":"Einen Zuschlag (2 €)","falsch":["Zwei Zuschläge (4 €)","Keinen","Einen Zuschlag pro Fahrgast"],"quelle":"§ 5 Z 1 Wiener Taxitarif"},{"nr":"5a","frage":"Sonn- und Feiertagstarif: In welcher Zeitspanne gilt er?","antwort":"An Sonn- und Feiertagen den ganzen Tag (0–24 Uhr) – für jede Fahrt, die in dieser Zeit beginnt","richtig":"Ganztägig von 0 bis 24 Uhr","falsch":["Von 6 bis 23 Uhr","Von 23 bis 6 Uhr","Ab 12 Uhr mittags"],"quelle":"§ 4 Abs. 1 Wiener Taxitarif"},{"nr":"5b","frage":"Wie setzt sich der Sonn- und Feiertagstarif zusammen?","antwort":"Wie der Nachttarif: Tagtarif plus 15 %\nGrundtaxe 4,30 €\nWegstrecke 1,09 € pro km bis 5 km, danach 0,67 €\nZeit 0,67 € pro Minute\nDazu allfällige Zuschläge (je 2 €)","richtig":"Grundtaxe 4,30 €, 1,09 €/0,67 € pro km, 0,67 € pro Minute","falsch":["Grundtaxe 3,80 €, 0,95 €/0,58 € pro km, 0,58 € pro Minute","Doppelter Tagtarif","Tagtarif plus 5 € Feiertagszuschlag"],"quelle":"§ 4 Abs. 2 Wiener Taxitarif"},{"nr":"6","frage":"Nachttarif: In welcher Zeitspanne gilt er?","antwort":"An Werktagen von 23 bis 6 Uhr – für jede Fahrt, die in dieser Zeit beginnt","richtig":"Werktags von 23 bis 6 Uhr","falsch":["Werktags von 22 bis 6 Uhr","Werktags von 20 bis 6 Uhr","Werktags von 0 bis 5 Uhr"],"quelle":"§ 4 Abs. 1 Wiener Taxitarif"},{"nr":"7","frage":"Was sind „bestellte Fahrten“?","antwort":"Fahrten, die über einen Kommunikationsdienst bestellt werden – per Telefon, Funkzentrale oder App/Internet","richtig":"Fahrten, die per Telefon, Funk oder App bestellt werden","falsch":["Fahrten, die am Standplatz beginnen","Fahrten, bei denen der Fahrgast das Taxi auf der Straße anhält","Nur Fahrten zum Flughafen"],"quelle":"§ 5 Z 1, § 6 Wiener Taxitarif"},{"nr":"8","frage":"Wer verordnet den Wiener Taxitarif?","antwort":"Der Landeshauptmann von Wien (zugleich Bürgermeister) – durch Verordnung","richtig":"Der Landeshauptmann von Wien","falsch":["Die Wirtschaftskammer Wien","Der Verkehrsminister","Jeder Taxiunternehmer selbst"],"quelle":"§ 14 Abs. 1 GelverkG"},{"nr":"9","frage":"Sie fahren mit einem Fahrgast auf eine Wiener Zieladresse. Die Streckenführung führt aber eine kurze Strecke über Niederösterreich. Welchen Fahrpreis verrechnen Sie?","antwort":"Den Fahrpreis laut Taxameter nach dem Wiener Taxitarif – Start und Ziel liegen in Wien","richtig":"Den Wiener Taxitarif laut Taxameter","falsch":["Einen frei vereinbarten Preis","Den Tarif von Niederösterreich","Den doppelten Kilometerpreis für die Strecke in Niederösterreich"],"quelle":"§ 1, § 2 Wiener Taxitarif"},{"nr":"10a","frage":"Sie erhalten einen Fahrtauftrag nach Korneuburg. Wie berechnen Sie den Fahrpreis?","antwort":"Fahrten über die Landesgrenze unterliegen nicht dem Wiener Taxitarif – der Preis wird frei vereinbart\nDen Fahrgast vorher darauf hinweisen","richtig":"Freie Preisvereinbarung","falsch":["Nach dem Wiener Taxitarif bis Korneuburg","Wiener Tarif plus 50 %","Nach dem Tarif von Korneuburg"],"quelle":"§ 14 Abs. 1a Z 6 GelverkG, § 11 Z 1 LBO"},{"nr":"10b","frage":"Sie erhalten einen Fahrtauftrag nach Korneuburg. Wann vereinbaren Sie den Fahrpreis?","antwort":"Vor Beginn der Fahrt","richtig":"Vor Fahrtantritt","falsch":["An der Stadtgrenze","Am Ziel in Korneuburg","Gar nicht, es gilt der Taxameter"],"quelle":"§ 11 Z 1 LBO"},{"nr":"11","frage":"Sie erhalten einen Fahrtauftrag zu einem Zielort außerhalb des Tarifgebietes. Müssen Sie diesen Fahrtauftrag annehmen?","antwort":"Nein – Fahrten über das Tarifgebiet hinaus unterliegen nicht dem Tarif und damit nicht der Beförderungspflicht","richtig":"Nein","falsch":["Ja, immer","Ja, bis 20 km nach der Stadtgrenze","Ja, wenn der Fahrgast im Voraus zahlt"],"quelle":"§ 9 Abs. 1 LBO, § 14 Abs. 1a Z 6 GelverkG"},{"nr":"12","frage":"Wann schalten Sie den Taxameter ein, wenn Sie einen Fahrtauftrag vom Standplatztelefon übernehmen?","antwort":"Es ist eine bestellte Fahrt: Den Taxameter erst einschalten, wenn der Fahrgast eingestiegen ist\nMuss man am Bestellort nach der vereinbarten Zeit warten, nach 2 Minuten einschalten\n(Früher: schon bei der Abfahrt vom Standplatz)","richtig":"Wenn der Fahrgast eingestiegen ist (bei Wartezeit nach 2 Minuten)","falsch":["Sofort beim Abheben des Telefons","Bei der Abfahrt vom Standplatz","Erst am Ziel"],"quelle":"§ 6 Abs. 1 und 2 Wiener Taxitarif (früher § 29 Abs. 2 W-TMGB)","alt":true},{"nr":"13","frage":"Wie setzt sich der Wiener Taxitarif zusammen?","antwort":"Grundtaxe (fester Betrag)\nWegstreckentarif (nach Kilometern)\nZeittarif (nach Minuten)\nDazu allfällige Zuschläge\nWeg- und Zeittarif laufen während der ganzen Fahrt gleichzeitig","richtig":"Grundtaxe, Wegstreckentarif, Zeittarif und Zuschläge","falsch":["Nur Grundtaxe und Kilometerpreis","Pauschale je nach Bezirk","Kilometerpreis und Trinkgeld"],"quelle":"§ 2 Abs. 1 Wiener Taxitarif"},{"nr":"14","frage":"Wo verliert der Wiener Taxitarif seine Gültigkeit?","antwort":"Bei Fahrten über die Wiener Landesgrenze hinaus\n(Außerdem gilt er nicht für Botenfahrten, Pauschal- und bestimmte Vertragsfahrten)","richtig":"Bei Fahrten über die Wiener Landesgrenze","falsch":["Am Gürtel","Ab 20 km Fahrtstrecke","In der Nacht"],"quelle":"§ 14 Abs. 1a GelverkG, § 1 Wiener Taxitarif"},{"nr":"15","frage":"Welcher Betrag darf für eine mittels Kommunikationsdienst bestellte Fahrt verrechnet werden, wenn das Taxi ordnungsgemäß erscheint, aber der Fahrgast die Fahrt aus eigenem Verschulden nicht antritt?","antwort":"Den Preis, den der Taxameter nach insgesamt 10 Minuten Wartezeit anzeigt, inklusive Zuschlag (2 €)\n(Voraussetzung: Das Taxi war pünktlich, die Fahrt wurde nicht abbestellt und der Lenker ist nicht schuld)","richtig":"Den Taxameterpreis nach 10 Minuten Wartezeit inkl. Zuschlag","falsch":["Nichts","Nur die Grundtaxe","Eine Pauschale von 20 €"],"quelle":"§ 6 Abs. 3 Wiener Taxitarif"},{"nr":"16a","frage":"Wie werden „Botenfahrten“ verrechnet?","antwort":"Nach freier Preisvereinbarung – sie unterliegen nicht dem Taxitarif\nDen Auftraggeber über die freie Preisvereinbarung aufklären","richtig":"Nach freier Vereinbarung","falsch":["Nach dem Taxameter","Wiener Taxitarif plus 2 € Zuschlag","Nur pauschal 10 €"],"quelle":"§ 14 Abs. 1a Z 7 GelverkG, § 11 Z 1 LBO"},{"nr":"16b","frage":"Unterliegen „Botenfahrten“ dem amtlichen Wiener Taxitarif?","antwort":"Nein – bei Botenfahrten werden nur Sachen befördert, die man ohne Hilfsmittel tragen kann","richtig":"Nein","falsch":["Ja, immer","Ja, aber nur in der Nacht","Nur bei Sendungen über 25 kg"],"quelle":"§ 14 Abs. 1a Z 7 GelverkG"},{"nr":"16c","frage":"Welchen Steuersatz enthält eine sogenannte „Botenfahrt“?","antwort":"20 % Umsatzsteuer (Personenbeförderung: 10 %)","richtig":"20 %","falsch":["10 %","13 %","0 %"],"quelle":"UStG (Normalsteuersatz)"},{"nr":"17","frage":"Welche Taxen verändern sich gegenüber Tag und Nacht?","antwort":"Alle drei: Grundtaxe, Wegstreckentarif und Zeittarif (in der Nacht jeweils um 15 % höher)\nDie Zuschläge bleiben gleich (2 €)","richtig":"Grundtaxe, Wegstreckentarif und Zeittarif","falsch":["Nur die Grundtaxe","Nur die Zuschläge","Nur der Zeittarif"],"quelle":"§ 4 Abs. 2 Wiener Taxitarif"},{"nr":"18","frage":"Der Fahrgast hat Gepäcksstücke und ersucht Sie diese in den Hausflur zur tragen. Dürfen Sie einen Zuschlag verlangen?","antwort":"Nein – Zuschläge gibt es nur für die Bestellung über einen Kommunikationsdienst und für mehr als 4 Fahrgäste","richtig":"Nein","falsch":["Ja, 2 € pro Gepäckstück","Ja, 5 € pauschal","Ja, wenn es über 20 kg sind"],"quelle":"§ 5 Wiener Taxitarif"},{"nr":"19","frage":"Sie führen eine Taxifahrt in einem Großraumtaxi laut Taxameter durch. Im Taxi befördern Sie 5, 6, 7 oder 8 Fahrgäste. Dürfen Sie zusätzlich zum Fahrpreis einen Zuschlag verrechnen?","antwort":"Ja – für die Beförderung von mehr als 4 Fahrgästen (in einem dafür zugelassenen Fahrzeug) einen Zuschlag von 2 €","richtig":"Ja, einen Zuschlag von 2 €","falsch":["Nein","Ja, 2 € pro zusätzlichem Fahrgast","Ja, 10 % des Fahrpreises"],"quelle":"§ 5 Z 2 Wiener Taxitarif"},{"nr":"20","frage":"Wie hoch ist laut Wiener Taxitarif der Zuschlag bei der Beförderung von mehr als 4 Personen im Großraumtaxi?","antwort":"2 € (einmal pro Fahrt, unabhängig von der Zahl der Fahrgäste über 4)","richtig":"2 €","falsch":["2 € pro Person","5 €","4 €"],"quelle":"§ 5 Z 2 Wiener Taxitarif"},{"nr":"21","frage":"Erklären Sie das sogenannte „Preisband“ im Wiener Taxitarif bei einer Fahrt innerhalb von Wien.","antwort":"Gilt für Fahrten, die über einen Kommunikationsdienst (App, Telefon) bestellt werden und einen vereinbarten Fixpreis haben\nDer Preis darf höchstens 20 % unter oder über dem Tarifpreis derselben Fahrt liegen (berechnet mit dem Routenplaner des Ministeriums)\nVor der Fahrt muss der Fahrgast eine schriftliche oder elektronische Bestätigung des Preises bekommen","richtig":"Bei bestellten Fahrten darf der Fixpreis höchstens 20 % unter oder über dem Tarif liegen","falsch":["Der Preis darf höchstens 10 % über dem Tarif liegen","Der Lenker darf den Preis frei wählen","In der Nacht gilt 20 % Aufschlag"],"quelle":"§ 8 Wiener Taxitarif, § 14 Abs. 1b GelverkG"},{"nr":"22","frage":"Ein Fahrgast ist am Taxistandplatz eingestiegen. Das Fahrziel ist innerhalb von Wien. Wie berechnen Sie den Fahrpreis?","antwort":"Nach dem Wiener Taxitarif mit dem Taxameter: Grundtaxe, Weg- und Zeittarif (dazu 2 € bei mehr als 4 Fahrgästen)\nKein Bestellzuschlag – die Fahrt wurde nicht bestellt","richtig":"Nach dem Taxameter (Wiener Taxitarif)","falsch":["Nach freier Vereinbarung","Mit dem Preisband ±20 %","Taxameter plus 2 € Bestellzuschlag"],"quelle":"§ 2, § 3 Wiener Taxitarif"},{"nr":"23","frage":"Bei welchen Taxifahrten innerhalb von Wien darf das sogenannte „Preisband“ für die Ermittlung des Fahrpreises angewendet werden?","antwort":"Nur bei Fahrten, die über einen Kommunikationsdienst (z. B. App, Telefon, Funk) bestellt werden und für die vorher ein Fixpreis vereinbart wurde","richtig":"Nur bei über einen Kommunikationsdienst bestellten Fahrten mit vereinbartem Preis","falsch":["Bei allen Fahrten vom Standplatz","Bei Fahrten in der Nacht","Bei Fahrten über 20 km"],"quelle":"§ 8 Wiener Taxitarif, § 14 Abs. 1b GelverkG"}]},{"nr":"IV","name":"Straßenverkehrsordnung","fragen":[{"nr":"1","frage":"„Dürfen Taxis durch Wohnstraßen durchfahren und was ist in Wohnstraßen zu beachten?“","antwort":"Durchfahren ist verboten – erlaubt ist nur das Zu- und Abfahren\nNur Schrittgeschwindigkeit\nFußgänger und Radfahrer dürfen nicht behindert oder gefährdet werden (Fußgänger dürfen auf der Fahrbahn gehen und spielen)\nBeim Ausfahren hat der fließende Verkehr Vorrang\nParken nur an gekennzeichneten Stellen","richtig":"Nein, nur zu- und abfahren – Schrittgeschwindigkeit, Fußgänger nicht behindern","falsch":["Ja, mit höchstens 30 km/h","Ja, wenn ein Fahrgast im Taxi sitzt","Nein, Taxis dürfen gar nicht hineinfahren"],"quelle":"§ 76b StVO"},{"nr":"2","frage":"Was ist ein Einsatzfahrzeug und wie verhalten Sie sich gegenüber einem Einsatzfahrzeug?","antwort":"Ein Fahrzeug mit Blaulicht und Folgetonhorn – solange eines dieser Signale eingeschaltet ist\nIhm Platz machen und Vorrang geben\nNicht unmittelbar hinterherfahren und nicht vor ihm in eine Kreuzung einfahren","richtig":"Fahrzeug mit Blaulicht/Folgetonhorn – Platz machen und Vorrang geben","falsch":["Jedes Fahrzeug der Polizei – nur bei grünem Licht vorlassen","Ein Fahrzeug mit gelbem Licht – überholen","Ein Rettungsfahrzeug ohne Signal – hinterherfahren"],"quelle":"§ 2 Abs. 1 Z 25, § 19 Abs. 2, § 26 Abs. 5 StVO"},{"nr":"3","frage":"Was verstehen Sie unter „Halten“?","antwort":"Eine freiwillige Fahrtunterbrechung (nicht durch den Verkehr erzwungen) bis zu 10 Minuten oder für die Dauer einer Ladetätigkeit","richtig":"Freiwillige Fahrtunterbrechung bis zu 10 Minuten oder für eine Ladetätigkeit","falsch":["Jedes Stehenbleiben, auch vor einer roten Ampel","Stehenbleiben bis zu 30 Minuten","Stehenbleiben mit laufendem Motor"],"quelle":"§ 2 Abs. 1 Z 27 StVO"},{"nr":"4","frage":"Was verstehen Sie unter „Parken“?","antwort":"Das Stehenlassen eines Fahrzeugs länger als 10 Minuten (bzw. länger als die Ladetätigkeit dauert)","richtig":"Ein Fahrzeug länger als 10 Minuten stehen lassen","falsch":["Ein Fahrzeug länger als 3 Minuten stehen lassen","Jedes Abstellen, bei dem der Lenker aussteigt","Stehenbleiben im Stau"],"quelle":"§ 2 Abs. 1 Z 28 StVO"},{"nr":"5","frage":"Wann liegt ein „Vorbeifahren“ vor?","antwort":"Wenn man an einer Person oder Sache vorbeifährt, die sich auf der Fahrbahn befindet und nicht fortbewegt – z. B. an einem haltenden oder parkenden Fahrzeug","richtig":"Vorbeibewegen an einem stehenden Hindernis, z. B. an einem parkenden Auto","falsch":["Vorbeibewegen an einem fahrenden Fahrzeug","Nebeneinanderfahren auf zwei Fahrstreifen","Fahren an einem Gehsteig entlang"],"quelle":"§ 2 Abs. 1 Z 30 StVO"},{"nr":"6","frage":"Was verstehen Sie unter „Überholen“?","antwort":"Das Vorbeibewegen an einem Fahrzeug, das auf derselben Fahrbahn in dieselbe Richtung fährt\nKein Überholen ist z. B. das Nebeneinanderfahren auf Fahrbahnen mit mehreren Fahrstreifen","richtig":"Vorbeibewegen an einem in gleicher Richtung fahrenden Fahrzeug","falsch":["Vorbeibewegen an einem parkenden Fahrzeug","Vorbeibewegen an einem entgegenkommenden Fahrzeug","Jeder Fahrstreifenwechsel"],"quelle":"§ 2 Abs. 1 Z 29 StVO"},{"nr":"7","frage":"Was bedeutet der Vertrauensgrundsatz und wer ist davon ausgenommen?","antwort":"Man darf darauf vertrauen, dass sich die anderen an die Verkehrsregeln halten\nAusgenommen sind:\n– Kinder,\n– Menschen mit Sehbehinderung (weißer Stock, gelbe Armbinde),\n– Menschen mit offensichtlicher körperlicher Beeinträchtigung,\n– Personen, die erkennbar die Gefahren nicht einschätzen können (z. B. Betrunkene)\nIhnen gegenüber: langsamer fahren und bremsbereit sein","richtig":"Man darf auf richtiges Verhalten der anderen vertrauen – außer bei Kindern, Sehbehinderten, Beeinträchtigten und erkennbar Unfähigen","falsch":["Man muss allen anderen misstrauen – ausgenommen Polizisten","Man darf allen vertrauen – ohne Ausnahme","Er gilt nur für ältere Personen"],"quelle":"§ 3 StVO"},{"nr":"8","frage":"Welche Personen müssen sich um Unfallverletzte kümmern?","antwort":"Alle, deren Verhalten mit dem Unfall zusammenhängt – sie müssen Hilfe leisten oder holen\nAuch Zeugen und alle, die die Unfallfolgen sehen, müssen zumutbare Hilfe leisten, wenn sonst niemand hilft","richtig":"Alle Unfallbeteiligten – und Zeugen, wenn sonst niemand hilft","falsch":["Nur die Rettung","Nur der Unfallverursacher","Nur Personen mit Erste-Hilfe-Kurs"],"quelle":"§ 4 Abs. 2 und 3 StVO"},{"nr":"9","frage":"Wie verhalten Sie sich, wenn Sie beim Ausparken ein anderes KFZ beschädigen?","antwort":"Sofort anhalten und die Unfallstelle sichern\nDen Besitzer des anderen Autos ausfindig machen und Name und Anschrift austauschen\nIst das nicht möglich: ohne unnötigen Aufschub die Polizei verständigen","richtig":"Anhalten; Namen und Anschrift mit dem Geschädigten tauschen, sonst sofort die Polizei verständigen","falsch":["Einen Zettel hinter den Scheibenwischer klemmen und weiterfahren","Weiterfahren, wenn der Schaden klein ist","Nur die eigene Versicherung verständigen"],"quelle":"§ 4 Abs. 1 und 5 StVO"},{"nr":"10","frage":"Wann darf die Verständigung der Polizei nach einem Unfall unterbleiben?","antwort":"Wenn nur Sachschaden entstanden ist und die Beteiligten (bzw. der Geschädigte) einander Namen und Anschrift nachgewiesen haben","richtig":"Bei reinem Sachschaden, wenn Namen und Anschrift ausgetauscht wurden","falsch":["Wenn niemand schwer verletzt ist","Wenn der Schaden unter 1.000 € liegt","Wenn beide Fahrzeuge noch fahren können"],"quelle":"§ 4 Abs. 5 StVO"},{"nr":"11","frage":"Wann gilt der Taxilenker beim Lenken eines Taxi΄s als vom Alkohol beeinträchtigt?","antwort":"Taxilenker dürfen den Fahrdienst nicht antreten, wenn der Blutalkohol über 0,1 Promille liegt (Atemluft über 0,05 mg/l)\n(Für alle Lenker gilt: ab 0,8 Promille jedenfalls beeinträchtigt)","richtig":"Ab 0,1 Promille","falsch":["Ab 0,5 Promille","Ab 0,8 Promille","Ab 0,3 Promille"],"quelle":"§ 3 Z 2 BO 1994, § 5 Abs. 1 StVO"},{"nr":"12","frage":"Wann darf ein Polizist die Atemluft von Personen auf den Alkoholgehalt untersuchen?","antwort":"Jederzeit bei Personen, die ein Fahrzeug lenken oder in Betrieb nehmen (oder es versuchen)\nAußerdem bei Verdacht, alkoholisiert gefahren zu sein, oder bei Beteiligung an einem Unfall","richtig":"Jederzeit bei Personen, die ein Fahrzeug lenken oder in Betrieb nehmen","falsch":["Nur nach einem Unfall","Nur wenn man Schlangenlinien fährt","Nur mit Zustimmung des Lenkers"],"quelle":"§ 5 Abs. 2 StVO"},{"nr":"13","frage":"Dürfen Sie einen Mopedfahrer auf einer Eisenbahnkreuzung überholen?","antwort":"Nein – auf Eisenbahnkreuzungen ist jedes Überholen verboten (auch von einspurigen Fahrzeugen)","richtig":"Nein","falsch":["Ja, einspurige Fahrzeuge darf man überholen","Ja, wenn der Schranken offen ist","Ja, wenn kein Zug zu sehen ist"],"quelle":"§ 16 Abs. 3 StVO, § 96 EisbKrV"},{"nr":"14","frage":"Dürfen Sie auf einer Schienenstraße links zufahren?","antwort":"Nein – auf Fahrbahnen mit Gleisen ist das Zufahren zum linken Fahrbahnrand verboten, außer in Einbahnstraßen","richtig":"Nein (außer in Einbahnstraßen)","falsch":["Ja, immer","Ja, wenn keine Straßenbahn kommt","Nur in der Nacht"],"quelle":"§ 7 Abs. 4 StVO"},{"nr":"15","frage":"Dürfen Sie auf einer Vorrangstraße im Ortsgebiet links zufahren?","antwort":"Nein – auf Vorrangstraßen im Ortsgebiet ist das Zufahren zum linken Fahrbahnrand verboten, außer in Einbahnstraßen","richtig":"Nein (außer in Einbahnstraßen)","falsch":["Ja, immer","Ja, mit eingeschaltetem Blinker","Ja, wenn wenig Verkehr ist"],"quelle":"§ 7 Abs. 4 StVO"},{"nr":"16","frage":"Was verstehen Sie unter der „freien Wahl des Fahrstreifens“?","antwort":"Im Ortsgebiet darf man auf Straßen mit mindestens zwei markierten Fahrstreifen in eine Richtung jeden Fahrstreifen benützen – man muss nicht rechts fahren","richtig":"Im Ortsgebiet bei mindestens zwei markierten Fahrstreifen darf jeder Fahrstreifen benützt werden","falsch":["Man darf überall die Fahrbahnseite frei wählen","Man darf auch die Busspur benützen","Man darf den Fahrstreifen ohne Blinken wechseln"],"quelle":"§ 7 Abs. 3a StVO"},{"nr":"17","frage":"Unter welchen Voraussetzungen muss man in Einbahnstraßen mit entgegenkommenden Radfahrern rechnen?","antwort":"Wenn beim Einbahnschild eine Zusatztafel „ausgenommen Radfahrer“ angebracht ist\noder ein Radfahrstreifen gegen die Einbahn markiert ist","richtig":"Bei der Zusatztafel „ausgenommen Radfahrer“ oder einem Radfahrstreifen gegen die Einbahn","falsch":["In jeder Einbahnstraße","Nur in der Nacht","Nie, Radfahrer dürfen nie gegen die Einbahn fahren"],"quelle":"§ 52 lit. a Z 2, § 54 StVO"},{"nr":"18","frage":"Wann dürfen Sie mit einem KFZ den Gehsteig benützen?","antwort":"Nur zum Überqueren an den dafür vorgesehenen Stellen (z. B. Haus- oder Grundstückseinfahrt) – ohne Fußgänger zu gefährden oder zu behindern\nAbstellen nur, wenn es durch Bodenmarkierungen erlaubt ist","richtig":"Nur zum Überqueren an vorgesehenen Stellen, z. B. bei Einfahrten","falsch":["Zum Aus- und Einsteigenlassen von Fahrgästen","Wenn die Fahrbahn verstellt ist","Mit Warnblinkanlage bis zu 5 Minuten"],"quelle":"§ 8 Abs. 4 StVO"},{"nr":"19","frage":"Unter welchen Voraussetzungen dürfen Sie eine Sperrlinie überfahren?","antwort":"Grundsätzlich nie\nAusnahme: auf Anordnung eines Polizisten (Organ der Straßenaufsicht)\nLiegen Sperrlinie und Leitlinie nebeneinander, gilt die Linie, die dem eigenen Fahrstreifen näher ist","richtig":"Nur auf Anordnung eines Polizisten","falsch":["Zum Überholen eines langsamen Fahrzeugs","Zum Umkehren","Wenn kein Gegenverkehr kommt"],"quelle":"§ 9 Abs. 1, § 97 Abs. 4 StVO"},{"nr":"20","frage":"Was ist eine Haltelinie?","antwort":"Eine weiße Querlinie (z. B. vor einer Ampel oder beim Zeichen „Halt“), bis zu der man beim Anhalten heranfahren darf","richtig":"Weiße Querlinie, bis zu der beim Anhalten herangefahren werden darf","falsch":["Linie, an der man immer stehen bleiben muss","Linie, die den Taxistandplatz begrenzt","Gelbe Linie am Fahrbahnrand"],"quelle":"§ 9 Abs. 3 und 4, § 55 StVO"},{"nr":"21","frage":"Was verstehen Sie unter dem „Reißverschlusssystem“?","antwort":"Endet ein Fahrstreifen oder ist er blockiert, wechseln die Fahrzeuge abwechselnd auf den verbleibenden Fahrstreifen – je eines vom endenden und eines vom durchgehenden Fahrstreifen","richtig":"Abwechselndes Einordnen, wenn ein Fahrstreifen endet","falsch":["Wer zuerst kommt, fährt zuerst","Der linke Fahrstreifen hat immer Vorrang","Man ordnet sich schon 500 m vorher ein"],"quelle":"§ 11 Abs. 5 StVO"},{"nr":"22","frage":"Dürfen Sie beim Gebotszeichen „Vorgeschriebene Fahrtrichtung geradeaus“ umkehren?","antwort":"Nein – im Bereich von „Vorgeschriebene Fahrtrichtung“ ist das Umkehren verboten","richtig":"Nein","falsch":["Ja, wenn kein Gegenverkehr kommt","Ja, nach 50 m","Ja, auf geregelten Kreuzungen"],"quelle":"§ 14 Abs. 2 lit. a StVO"},{"nr":"23","frage":"Dürfen Sie beim Verkehrszeichen „Einbiegen nach rechts verboten“ umkehren?","antwort":"Ja – „Einbiegen nach rechts verboten“ verbietet das Umkehren nicht (anders als „Einbiegen nach links verboten“), solange niemand gefährdet oder behindert wird","richtig":"Ja","falsch":["Nein","Nur in der Nacht","Nur mit Einweiser"],"quelle":"§ 14 Abs. 1 und 2 StVO"},{"nr":"24","frage":"Dürfen Sie in einer Schienenstraße umkehren?","antwort":"Ja, grundsätzlich – wenn niemand gefährdet oder behindert wird und kein Umkehrverbot gilt (z. B. keine Sperrlinie, keine Vorrangstraße im Ortsgebiet, kein starker Verkehr)","richtig":"Ja, wenn niemand gefährdet oder behindert wird","falsch":["Nein, nie","Nur über die Gleise hinweg","Nur wenn eine Straßenbahn kommt"],"quelle":"§ 14 StVO"},{"nr":"25","frage":"Wann dürfen Sie erlaubterweise rechts überholen?","antwort":"Fahrzeuge, die links eingeordnet sind und nach links einbiegen oder zum linken Fahrbahnrand fahren wollen\nSchienenfahrzeuge (wenn genug Platz zum rechten Fahrbahnrand ist)\nFahrzeuge des Straßendienstes bei Arbeitsfahrten links, wenn links nicht genug Platz ist","richtig":"Bei Linksabbiegern und bei Straßenbahnen","falsch":["Bei jedem langsamen Fahrzeug","Auf der Autobahn bei Stau","Bei Lastwagen"],"quelle":"§ 15 Abs. 2 und 2a StVO"},{"nr":"26","frage":"Auf welcher Seite überholen Sie eine Straßenbahn?","antwort":"Rechts (wenn genug Abstand zum rechten Fahrbahnrand ist)\nIn Einbahnstraßen auch links","richtig":"Rechts (in Einbahnstraßen auch links)","falsch":["Immer links","Gar nicht","Nur links mit Hupen"],"quelle":"§ 15 Abs. 2 lit. b StVO"},{"nr":"27","frage":"Welche Fahrzeuge dürfen Sie beim Verkehrszeichen „Überholen verboten“ nicht überholen?","antwort":"Mehrspurige Kraftfahrzeuge (Autos, Lkw, Busse)\nEinspurige Fahrzeuge (Motorräder, Mopeds, Fahrräder) darf man überholen\nRechts überholen (z. B. Linksabbieger) bleibt erlaubt","richtig":"Mehrspurige Kraftfahrzeuge","falsch":["Alle Fahrzeuge","Nur Lastwagen","Nur Motorräder"],"quelle":"§ 16 Abs. 2 lit. a StVO"},{"nr":"28","frage":"Dürfen Sie auf einem ungeregelten Schutzweg einen Fiaker überholen?","antwort":"Nein – auf und unmittelbar vor ungeregelten Schutzwegen ist jedes Überholen verboten","richtig":"Nein","falsch":["Ja, ein Fiaker ist kein Kraftfahrzeug","Ja, wenn kein Fußgänger zu sehen ist","Ja, mit Schrittgeschwindigkeit"],"quelle":"§ 16 Abs. 1 lit. d StVO"},{"nr":"29","frage":"Dürfen Sie auf einem geregelten Schutzweg einen Motorradfahrer überholen?","antwort":"Ja – das Überholverbot gilt nur bei ungeregelten Schutzwegen; bei Ampel oder Polizist darf man überholen (wenn sonst nichts dagegen spricht)","richtig":"Ja","falsch":["Nein, nie","Nur bei gelbem Licht","Nur Fahrräder"],"quelle":"§ 16 Abs. 1 lit. d StVO"},{"nr":"30","frage":"Müssen Sie auf Weisung eines Polizisten eine Sperrlinie überfahren?","antwort":"Ja – Anordnungen eines Polizisten gehen den Bodenmarkierungen vor\n(Dabei niemanden gefährden)","richtig":"Ja","falsch":["Nein, die Sperrlinie geht immer vor","Nur wenn er es schriftlich anordnet","Nur in Einbahnstraßen"],"quelle":"§ 97 Abs. 4 StVO"},{"nr":"31","frage":"Wo ist bei Vorhandensein des Verkehrszeichens „Halt“ anzuhalten?","antwort":"An der Haltelinie\nOhne Haltelinie: vor der Kreuzung an einer Stelle mit guter Übersicht","richtig":"An der Haltelinie, sonst vor der Kreuzung mit guter Übersicht","falsch":["Direkt beim Verkehrszeichen","In der Mitte der Kreuzung","Nur wenn Verkehr kommt"],"quelle":"§ 9 Abs. 4, § 19 Abs. 4, § 52 StVO"},{"nr":"32","frage":"Was verstehen Sie unter der „Gegenverkehrsregel“?","antwort":"Wer geradeaus fährt oder rechts einbiegt, hat Vorrang vor entgegenkommenden Linksabbiegern","richtig":"Geradeausfahrer und Rechtsabbieger haben Vorrang vor entgegenkommenden Linksabbiegern","falsch":["Linksabbieger haben Vorrang vor dem Gegenverkehr","Wer schneller ist, hat Vorrang","Im Gegenverkehr gilt immer Rechtsregel"],"quelle":"§ 19 Abs. 5 StVO"},{"nr":"33","frage":"Wo gilt das „Stehenbleiben“ der Straßenbahn nicht als Vorrangverzicht?","antwort":"In Haltestellen – dort gilt das Stehenbleiben der Straßenbahn nicht als Verzicht auf den Vorrang","richtig":"In Haltestellen","falsch":["Bei roter Ampel","Vor Schutzwegen","In Remisen"],"quelle":"§ 19 Abs. 8 StVO"},{"nr":"34","frage":"Ist es erlaubt, wegen einer am Fahrbahnrand winkenden Person das Taxifahrzeug abrupt zum Stillstand zu bringen?","antwort":"Nein – plötzlich bremsen darf man nur, wenn es die Verkehrssicherheit erfordert","richtig":"Nein","falsch":["Ja, Fahrgäste haben Vorrang","Ja, mit Warnblinkanlage","Ja, wenn kein Bus kommt"],"quelle":"§ 21 Abs. 1 StVO"},{"nr":"35","frage":"Unter welchen Voraussetzungen dürfen Sie in Wien erlaubterweise hupen?","antwort":"In Wien gilt Hupverbot: nur wenn es das einzige Mittel ist, um eine Gefahr für Personen abzuwenden","richtig":"Nur wenn es das einzige Mittel ist, eine Gefahr für Personen abzuwenden","falsch":["Um Fahrgäste auf sich aufmerksam zu machen","Zum Grüßen von Kollegen","Wenn die Ampel grün wird und der Vordermann nicht fährt"],"quelle":"§ 22, § 43 Abs. 2 StVO"},{"nr":"36","frage":"Dürfen Sie bei Dunkelheit weiterfahren, wenn das Abblendlicht und das Fernlicht ausgefallen sind?","antwort":"Grundsätzlich nein – ohne Scheinwerfer ist das Taxi nicht verkehrssicher\nHöchstens vorsichtig bis zur nächsten Reparaturmöglichkeit, wenn die Straße ausreichend beleuchtet ist (bzw. mit Nebelscheinwerfern)","richtig":"Nein – höchstens vorsichtig bis zur nächsten Reparaturmöglichkeit bei ausreichender Straßenbeleuchtung","falsch":["Ja, mit Warnblinkanlage","Ja, mit Standlicht","Ja, bis zum Dienstende"],"quelle":"§ 99, § 102 KFG"},{"nr":"37","frage":"Wann dürfen Sie mit einem Taxi in 2. Spur halten?","antwort":"Zum Aus- oder Einsteigenlassen, kurz – wenn\n– der Verkehr dadurch nicht beeinträchtigt wird und\n– innerhalb von 50 m kein Platz zum Halten am Fahrbahnrand ist","richtig":"Kurz zum Aus- oder Einsteigenlassen, wenn innerhalb von 50 m kein Platz ist und der Verkehr nicht beeinträchtigt wird","falsch":["Immer, wenn die Warnblinkanlage eingeschaltet ist","Bis zu 10 Minuten zum Warten auf Fahrgäste","Nie"],"quelle":"§ 23 Abs. 3a StVO"},{"nr":"38","frage":"Wie weit reicht der Haltestellenbereich?","antwort":"15 m vor und 15 m nach der Haltestellentafel (sofern Bodenmarkierungen nichts anderes zeigen)","richtig":"15 m vor und nach der Haltestellentafel","falsch":["5 m vor und nach der Tafel","30 m vor der Tafel","10 m nach der Tafel"],"quelle":"§ 24 Abs. 1 lit. e StVO"},{"nr":"39","frage":"Dürfen Sie im Haltestellenbereich halten?","antwort":"Halten und Parken ist dort während der Betriebszeiten verboten\nKurz zum Aus- oder Einsteigen darf man aber halten","richtig":"Nur kurz zum Aus- oder Einsteigen","falsch":["Ja, bis zu 10 Minuten","Nein, nie","Ja, in der Nacht immer"],"quelle":"§ 24 Abs. 1 lit. e und Abs. 2a StVO"},{"nr":"40","frage":"Dürfen Sie 3 Meter vor einem ungeregelten Schutzweg parken?","antwort":"Nein – 5 m vor einem ungeregelten Schutzweg ist Halten und Parken verboten","richtig":"Nein (5 m Halte- und Parkverbot)","falsch":["Ja","Ja, mit Warnblinkanlage","Nur in der Nacht"],"quelle":"§ 24 Abs. 1 lit. c StVO"},{"nr":"41","frage":"Dürfen Sie im Bereich von 5 m vom Schnittpunkt einander kreuzender Fahrbahnränder halten, um einen Fahrgast aufzunehmen?","antwort":"Mit einem Taxi ja, kurz zum Ein- oder Aussteigenlassen – wenn der Verkehr nicht beeinträchtigt wird und innerhalb von 50 m kein Platz zum Halten ist (nicht auf Schutzwegen)","richtig":"Ja, kurz – wenn innerhalb von 50 m kein Platz ist und der Verkehr nicht beeinträchtigt wird","falsch":["Nein, nie","Ja, bis zu 10 Minuten","Nur bei Nacht"],"quelle":"§ 23 Abs. 3a, § 24 Abs. 1 lit. d StVO"},{"nr":"42","frage":"Darf ein PKW (kein Taxi) auf einem Taxistandplatz halten, um Personen aus- oder einsteigen zu lassen?","antwort":"Ja – auf einem Taxistandplatz darf jedes Fahrzeug kurz zum Aus- oder Einsteigen halten","richtig":"Ja, kurz zum Aus- oder Einsteigen","falsch":["Nein, nur Taxis","Ja, bis zu 10 Minuten","Nur mit Behindertenausweis"],"quelle":"§ 24 Abs. 2a StVO"},{"nr":"43","frage":"Unter welchen Voraussetzungen darf ein Taxi vor einer Haus- oder Grundstückeinfahrt halten?","antwort":"Halten ist erlaubt, aber der Lenker muss im Fahrzeug bleiben und die Einfahrt sofort freimachen, wenn jemand ein- oder ausfahren will\nParken ist verboten","richtig":"Lenker bleibt im Taxi und macht die Einfahrt sofort frei","falsch":["Nur mit Warnblinkanlage","Bis zu 10 Minuten, auch ohne Lenker","Gar nicht"],"quelle":"§ 23 Abs. 3, § 24 Abs. 3 lit. b StVO"},{"nr":"44","frage":"Dürfen Sie mit einem Taxi in einer Ladezone halten, um Fahrgäste aufzunehmen?","antwort":"Ja – in einer Ladezone darf man kurz zum Aus- oder Einsteigen halten","richtig":"Ja, kurz zum Aus- oder Einsteigen","falsch":["Nein","Ja, bis zu 30 Minuten","Nur mit Ladetätigkeit"],"quelle":"§ 24 Abs. 2a StVO"},{"nr":"45","frage":"Dürfen Sie auf einem Radweg halten?","antwort":"Nein – auf Radwegen, Radfahrstreifen und Geh- und Radwegen ist Halten und Parken verboten","richtig":"Nein","falsch":["Ja, kurz zum Aus- oder Einsteigen","Ja, mit Warnblinkanlage","Ja, in der Nacht"],"quelle":"§ 24 Abs. 1 lit. k StVO"},{"nr":"46","frage":"Dürfen Taxis durch Fußgängerzonen durchfahren und was ist in Fußgängerzonen zu beachten?","antwort":"Nur wenn es dort (Zusatztafel) für Taxis erlaubt ist – und nur zum Zubringen oder Abholen von Fahrgästen, nicht zum Durchfahren\nNur an den vorgesehenen Stellen einfahren, Schrittgeschwindigkeit, Abstand halten\nHalten nur zum Aus- und Einsteigenlassen","richtig":"Nur wenn für Taxis erlaubt, zum Zubringen/Abholen – Schrittgeschwindigkeit","falsch":["Ja, immer mit 20 km/h","Ja, in der Nacht","Nein, nie – auch nicht mit Erlaubnis"],"quelle":"§ 76a, § 24 Abs. 1 lit. i StVO"},{"nr":"47","frage":"Sind Taxilenker verpflichtet, in Kurzparkzonen einen Parkschein auszufüllen?","antwort":"Beim Halten (z. B. Fahrgäste aus- oder einsteigen lassen, bis zu 10 Minuten) nein\nWer parkt (länger als 10 Minuten), braucht wie jeder andere einen Parkschein bzw. ein Handyparkticket","richtig":"Nur beim Parken, nicht beim kurzen Halten für Fahrgäste","falsch":["Nein, Taxis sind immer befreit","Ja, auch für 1 Minute Halten","Nur in der Nacht"],"quelle":"§ 25 StVO; Wiener Parkometerabgabeverordnung"},{"nr":"48","frage":"Wann ist eine Kreuzung geregelt?","antwort":"Wenn der Verkehr durch Lichtzeichen (Ampel) oder durch Armzeichen eines Polizisten geregelt wird\nGelbes Blinklicht gilt nicht als Regelung","richtig":"Bei Ampel oder Armzeichen eines Polizisten","falsch":["Bei gelbem Blinklicht","Bei Vorrangzeichen","Wenn ein Schutzweg vorhanden ist"],"quelle":"§ 2 Abs. 1 Z 23 StVO"},{"nr":"49","frage":"Mit welcher Geschwindigkeit nähern Sie sich einem in der Haltestelle stehenden Linienbus?","antwort":"Langsam und bremsbereit\nAuf der Seite, auf der Fahrgäste ein- und aussteigen, nicht vorbeifahren, solange die Türen offen sind; danach nur mit Schrittgeschwindigkeit","richtig":"Langsam und bremsbereit, an der Einstiegsseite nur mit Schrittgeschwindigkeit","falsch":["Mit 50 km/h, der Bus steht ja","Mit Hupen und gleichbleibender Geschwindigkeit","Schneller, um vor dem Bus wegzukommen"],"quelle":"§ 17 Abs. 2 StVO"},{"nr":"50","frage":"Wo ist beim Aufleuchten des gelben Lichtes einer Ampel anzuhalten?","antwort":"Vor der Haltelinie\nOhne Haltelinie: vor dem Schutzweg bzw. der Radfahrerüberfahrt\nSonst vor der Kreuzung bzw. vor der Ampel\n(Wer nicht mehr sicher anhalten kann, fährt weiter)","richtig":"Vor der Haltelinie, sonst vor Schutzweg, Kreuzung oder Ampel","falsch":["Mitten in der Kreuzung","Erst bei rotem Licht","Gar nicht, Gelb heißt schnell weiterfahren"],"quelle":"§ 38 Abs. 1 StVO"},{"nr":"51","frage":"Was bedeutet gelbes blinkendes Licht?","antwort":"„Vorsicht“ – die Kreuzung ist nicht geregelt, es gelten die Vorrangregeln","richtig":"Vorsicht","falsch":["Halt","Freie Fahrt","Gleich kommt Grün"],"quelle":"§ 38 Abs. 3 StVO"},{"nr":"52","frage":"Was bedeutet die rote Fläche einer Signalscheibe?","antwort":"„Halt“ – anhalten","richtig":"Halt","falsch":["Freie Fahrt","Langsamer fahren","Vorsicht"],"quelle":"§ 37 StVO"},{"nr":"53","frage":"Dürfen Taxis in Begegnungszonen einfahren und was ist hier zu beachten?","antwort":"Ja\nHöchstens 20 km/h (kann auf 30 km/h erhöht sein)\nFußgänger und Radfahrer weder gefährden noch behindern – Fußgänger dürfen die ganze Fahrbahn benützen\nParken nur an gekennzeichneten Stellen","richtig":"Ja – höchstens 20 km/h, Fußgänger und Radfahrer nicht gefährden oder behindern","falsch":["Nein, nur zum Zu- und Abfahren","Ja, mit Schrittgeschwindigkeit","Ja, mit 50 km/h"],"quelle":"§ 76c StVO"},{"nr":"54","frage":"Wann und wie bilden Sie eine Rettungsgasse und wer darf Sie benützen?","antwort":"Sobald der Verkehr auf Autobahn oder Autostraße stockt (mind. zwei Fahrstreifen)\nBei zwei Fahrstreifen: in der Mitte; bei mehr: zwischen dem ganz linken und dem daneben\nBenützen dürfen sie nur Einsatzfahrzeuge, Straßendienst, Pannendienst und Leichenwagen","richtig":"Bei stockendem Verkehr – zwischen dem linken und dem daneben liegenden Fahrstreifen; nur für Einsatz-, Straßen- und Pannendienst","falsch":["Erst wenn ein Einsatzfahrzeug kommt – am Pannenstreifen","Nur bei Unfällen – ganz rechts","Bei jedem Stau – auch Taxis dürfen sie nützen"],"quelle":"§ 46 Abs. 6 StVO"},{"nr":"55","frage":"Was ist eine Radfahrerüberfahrt und wie verhalten Sie sich vor dieser?","antwort":"Eine markierte Stelle, an der Radfahrer die Fahrbahn queren\nMan nähert sich so, dass man davor anhalten kann, und lässt Radfahrer, die sie benützen oder erkennbar benützen wollen, sicher queren","richtig":"Markierte Querungsstelle für Radfahrer – so annähern, dass man anhalten kann, und sie queren lassen","falsch":["Radweg entlang der Fahrbahn – Radfahrer haben keinen Vorrang","Fahrradabstellplatz – dort darf man halten","Schutzweg nur für Fußgänger"],"quelle":"§ 9 Abs. 2 StVO"},{"nr":"56","frage":"Was ist ein Schutzweg und wie verhalten Sie sich vor einem Schutzweg?","antwort":"Eine durch Querstreifen (Zebrastreifen) markierte Stelle für Fußgänger zum Queren der Fahrbahn\nMan nähert sich so, dass man davor anhalten kann, und lässt Fußgänger, die queren oder erkennbar queren wollen, ungehindert gehen","richtig":"Zebrastreifen – so annähern, dass man anhalten kann, und Fußgänger queren lassen","falsch":["Fußgänger müssen warten, bis kein Auto kommt","Man darf mit Hupen durchfahren","Gilt nur bei Ampel"],"quelle":"§ 2 Abs. 1 Z 12, § 9 Abs. 2 StVO"},{"nr":"57","frage":"Dürfen Sie auf Vorrangstraßen im Ortsgebiet umkehren?","antwort":"Nein – außer auf geregelten Kreuzungen","richtig":"Nein, außer auf geregelten Kreuzungen","falsch":["Ja, immer","Ja, wenn kein Gegenverkehr kommt","Nur nachts"],"quelle":"§ 14 Abs. 2 lit. d StVO"},{"nr":"58","frage":"Auf welcher Seite überholen Sie andere Fahrzeuge?","antwort":"Links (außer in den Fällen, in denen rechts zu überholen ist)","richtig":"Links","falsch":["Rechts","Auf beiden Seiten","Nur auf der Autobahn links"],"quelle":"§ 15 Abs. 1 StVO"},{"nr":"59","frage":"Welche Fahrzeuge dürfen Sie rechts überholen?","antwort":"Links eingeordnete Linksabbieger (bzw. Fahrzeuge, die zum linken Fahrbahnrand fahren)\nSchienenfahrzeuge\nStraßendienstfahrzeuge bei Arbeitsfahrten, wenn links kein Platz ist","richtig":"Linksabbieger, Straßenbahnen und Straßendienstfahrzeuge bei Arbeitsfahrten","falsch":["Alle langsamen Fahrzeuge","Lastwagen","Busse in der Haltestelle"],"quelle":"§ 15 Abs. 2 und 2a StVO"},{"nr":"60","frage":"Dürfen Sie auf und unmittelbar vor Schutzwegen überholen?","antwort":"Nein – außer der Verkehr dort wird durch Ampel oder Polizisten geregelt","richtig":"Nein, außer bei geregelten Schutzwegen","falsch":["Ja, immer","Ja, wenn kein Fußgänger zu sehen ist","Nur einspurige Fahrzeuge"],"quelle":"§ 16 Abs. 1 lit. d StVO"},{"nr":"61","frage":"Dürfen Sie an Fahrzeugen, die vor einem Schutzweg halten, vorbeifahren?","antwort":"Nein – an Fahrzeugen, die anhalten, um Fußgänger oder Radfahrer queren zu lassen, darf man nicht vorbeifahren","richtig":"Nein","falsch":["Ja, langsam","Ja, wenn man hupt","Ja, auf dem Fahrstreifen daneben"],"quelle":"§ 17 Abs. 3 StVO"},{"nr":"62","frage":"Was bedeutet der senkrecht nach oben gehaltene Arm eines Polizisten?","antwort":"„Halt“ – vor dem Polizisten anhalten; auf einer Kreuzung vor Schutzweg, Haltelinie oder Kreuzung (wie gelbes Licht)","richtig":"Halt","falsch":["Freie Fahrt","Langsamer fahren","Rechts abbiegen"],"quelle":"§ 37 Abs. 1 StVO"},{"nr":"63","frage":"Ein Polizist bewegt den Arm auf und ab, was bedeutet das?","antwort":"Die Geschwindigkeit ist zu verringern","richtig":"Langsamer fahren","falsch":["Halt","Freie Fahrt","Schneller fahren"],"quelle":"§ 37 Abs. 7 StVO"},{"nr":"64","frage":"Was bedeutet rotes und gelbes Licht gemeinsam?","antwort":"„Halt“ wie bei Rot – und gleich folgt Grün („Freie Fahrt“)","richtig":"Halt – gleich kommt Grün","falsch":["Freie Fahrt","Vorsicht, gleich kommt Rot","Nur Linksabbieger dürfen fahren"],"quelle":"§ 38 Abs. 2a StVO"},{"nr":"65","frage":"Was bedeutet grün blinkendes Licht?","antwort":"Das grüne Licht („Freie Fahrt“) endet gleich – es blinkt viermal, dann kommt Gelb","richtig":"Grün endet gleich","falsch":["Freie Fahrt für Linksabbieger","Vorsicht, Kreuzung ungeregelt","Halt"],"quelle":"§ 38 Abs. 6 StVO"},{"nr":"66","frage":"Welche Fahrzeuge haben Vorrang, auch wenn sie von links kommen?","antwort":"Schienenfahrzeuge (Straßenbahn) – im Rechtsvorrang haben sie Vorrang auch von links\nEinsatzfahrzeuge haben immer Vorrang\n(Außerdem Fahrzeuge auf einer Vorrangstraße)","richtig":"Schienenfahrzeuge (und Einsatzfahrzeuge)","falsch":["Busse","Taxis","Lastwagen"],"quelle":"§ 19 Abs. 1 und 2 StVO"}]},{"nr":"V","name":"Kraftfahrgesetz","fragen":[{"nr":"1","frage":"Wie viel Mindestprofiltiefe hat der Sommerreifen bei PKW?","antwort":"1,6 mm","richtig":"1,6 mm","falsch":["3 mm","4 mm","1 mm"],"quelle":"§ 4 Abs. 4 KDV"},{"nr":"2","frage":"Wie viel Mindestprofiltiefe hat der „Radial“ Winterreifen bei PKW?","antwort":"4 mm (bei Diagonalreifen 5 mm)","richtig":"4 mm","falsch":["1,6 mm","3 mm","5 mm"],"quelle":"§ 4 Abs. 4 KDV"},{"nr":"3","frage":"In welchem Zeitraum besteht Winterreifenpflicht für Taxis?","antwort":"Vom 1. November bis 15. April – wenn winterliche Fahrbahnverhältnisse herrschen (Schnee, Schneematsch, Eis); dann an allen Rädern","richtig":"1. November bis 15. April bei winterlichen Fahrbahnverhältnissen","falsch":["1. Oktober bis 31. März, immer","1. Dezember bis 28. Februar","Nur wenn es schneit, das ganze Jahr"],"quelle":"§ 102 Abs. 8a KFG"},{"nr":"4","frage":"Wie viele Kinder zwischen 6 und 14 Jahren dürfen auf einer 3er Sitzbank in der 2. Reihe eines Taxis befördert werden?","antwort":"3 – so viele, wie Sitzplätze vorhanden sind (Kinder zählen im Pkw voll, jedes auf einem eigenen Sitzplatz)","richtig":"3","falsch":["4","5","2"],"quelle":"§ 106 Abs. 1 KFG"},{"nr":"5","frage":"Wann dürfen Sie im Ortsgebiet bei Dunkelheit das Fernlicht verwenden?","antwort":"Im Ortsgebiet grundsätzlich nicht\nErlaubt nur als optisches Warnzeichen oder wenn schneller als 50 km/h gefahren werden darf und die Fahrbahn unzureichend beleuchtet ist – ohne andere zu blenden","richtig":"Nur als Warnzeichen oder wenn über 50 km/h erlaubt sind und die Fahrbahn schlecht beleuchtet ist","falsch":["Immer, wenn kein Gegenverkehr kommt","Nie, auch nicht als Warnzeichen","Immer in Nebenstraßen"],"quelle":"§ 99 Abs. 3 KFG"},{"nr":"6","frage":"Im Ortsgebiet herrscht am Tag Sichtbehinderung durch Regen. Welches Licht verwenden Sie?","antwort":"Abblendlicht, Nebellicht oder beide zusammen","richtig":"Abblendlicht (oder Nebellicht)","falsch":["Standlicht","Fernlicht","Nebelschlussleuchte allein"],"quelle":"§ 99 Abs. 5 KFG"},{"nr":"7","frage":"Wann dürfen Sie die Lichthupe verwenden?","antwort":"Als optisches Warnzeichen, wenn es die Verkehrssicherheit erfordert – andere dürfen dabei nicht geblendet werden","richtig":"Als Warnzeichen, wenn es die Verkehrssicherheit erfordert","falsch":["Zum Grüßen anderer Taxis","Um Vorrang zu verlangen","Um Fahrgäste auf sich aufmerksam zu machen"],"quelle":"§ 22 Abs. 1 StVO, § 99 Abs. 3 KFG"},{"nr":"8","frage":"Wann ist ein Taxilenker von der Gurtenanlegepflicht befreit?","antwort":"Während er einen Fahrgast gewerbsmäßig befördert (nicht bei Schülertransporten)\nOhne Fahrgast muss er sich anschnallen","richtig":"Bei der gewerbsmäßigen Beförderung eines Fahrgastes","falsch":["Immer, Taxilenker sind ganz befreit","Nur in der Nacht","Nie"],"quelle":"§ 106 Abs. 3 Z 4 KFG"},{"nr":"9","frage":"Müssen Kinder unter 14 Jahren und unter 135 cm Größe im Taxi in einem Kindersitz befördert werden?","antwort":"Nein – im Taxi gilt die Kindersitzpflicht nicht (außer bei Schülertransporten)\nOhne Kindersitz dürfen Kinder aber nicht vorne sitzen","richtig":"Nein – aber ohne Kindersitz nicht auf dem Vordersitz","falsch":["Ja, immer","Ja, nur unter 3 Jahren","Nein, und sie dürfen auch vorne sitzen"],"quelle":"§ 106 Abs. 5 und 6 KFG"},{"nr":"10","frage":"Nennen Sie Ausnahmen von der Gurtenpflicht?","antwort":"Bei ganz geringer Gefahr (z. B. Einparken, langsames Rückwärtsfahren)\nWenn der Gurt wegen Körpergröße oder schwerster Beeinträchtigung nicht passt\nEinsatzfahrzeuge\nTaxilenker beim gewerbsmäßigen Befördern eines Fahrgastes","richtig":"Einparken/geringe Gefahr, Körpergröße oder schwere Beeinträchtigung, Einsatzfahrzeuge, Taxilenker mit Fahrgast","falsch":["Fahrten unter 5 km","Fahrten im Ortsgebiet","Für alle Fahrgäste auf der Rückbank"],"quelle":"§ 106 Abs. 3 KFG"},{"nr":"11","frage":"Sie führen mit Ihrem Taxi eine Besorgungsfahrt durch. Sind Sie von der Gurtenanlegepflicht befreit?","antwort":"Nein – die Ausnahme gilt nur, wenn ein Fahrgast befördert wird","richtig":"Nein","falsch":["Ja, im Taxi immer","Ja, im Ortsgebiet","Ja, wenn der Taxameter läuft"],"quelle":"§ 106 Abs. 3 Z 4 KFG"},{"nr":"12","frage":"Was müssen Sie tun, wenn eine Kennzeichentafel beschädigt wird?","antwort":"Der Lenker muss dafür sorgen, dass das Kennzeichen lesbar ist\nIst die Tafel unlesbar oder stark beschädigt: bei der Zulassungsstelle eine neue Kennzeichentafel anfertigen lassen","richtig":"Bei der Zulassungsstelle eine neue Tafel anfertigen lassen","falsch":["Mit Klebeband reparieren und weiterfahren","Das Kennzeichen mit Filzstift auf Karton schreiben – unbegrenzt","Nichts, solange eine Tafel vorhanden ist"],"quelle":"§ 102 Abs. 2, § 49 KFG"},{"nr":"13","frage":"Wie verhalten Sie sich bei Verlust der Kennzeichentafel?","antwort":"Unverzüglich bei der Behörde oder Polizei anzeigen\nMit der Bestätigung und einer behelfsmäßigen Ersatztafel darf man höchstens eine Woche weiterfahren\nDie Zulassungsstelle teilt ein neues Kennzeichen zu","richtig":"Sofort anzeigen; mit Ersatztafel höchstens eine Woche weiterfahren","falsch":["Erst beim nächsten Pickerl melden","Mit Ersatztafel vier Wochen weiterfahren","Nur der Versicherung melden"],"quelle":"§ 51 KFG"},{"nr":"14","frage":"Wie ist die Lenkberechtigung der Klasse B eingeschränkt?","antwort":"Kraftwagen bis 3.500 kg höchstes zulässiges Gesamtgewicht\nMit höchstens 8 Plätzen außer dem Lenkerplatz\nAnhänger bis 750 kg (schwerere nur, wenn der Zug insgesamt 3.500 kg nicht übersteigt)","richtig":"Bis 3.500 kg und höchstens 8 Plätze außer dem Lenker","falsch":["Bis 7.500 kg und 16 Plätze","Bis 3.500 kg und beliebig viele Plätze","Bis 2.500 kg und 4 Plätze"],"quelle":"§ 2 FSG"},{"nr":"15","frage":"Wann sind Sie verpflichtet, sich einen Duplikatführerschein zu lösen?","antwort":"Wenn der Führerschein verloren oder gestohlen wurde\nWenn er ungültig ist: Eintragungen unkenntlich, Lichtbild fehlt oder zeigt einen nicht mehr erkennbar, beschädigt","richtig":"Bei Verlust, Diebstahl oder wenn er ungültig ist (z. B. Foto nicht mehr erkennbar)","falsch":["Alle 5 Jahre","Bei jedem Umzug","Wenn man ein neues Auto kauft"],"quelle":"§ 14 Abs. 4, § 15 FSG"},{"nr":"16","frage":"Wie setzt sich der Anhalteweg zusammen?","antwort":"Anhalteweg = Reaktionsweg + Bremsweg","richtig":"Reaktionsweg + Bremsweg","falsch":["Bremsweg × 2","Reaktionsweg − Bremsweg","Geschwindigkeit × Reaktionszeit"],"quelle":"Fahrphysik"},{"nr":"17","frage":"Wie viel Meter in der Sekunde legt ein Kfz bei 60 km/h zurück?","antwort":"Etwa 16,7 m (60 : 3,6)","richtig":"Etwa 16,7 m","falsch":["6 m","60 m","36 m"],"quelle":"km/h ÷ 3,6 = m/s"},{"nr":"18","frage":"Was verstehen Sie unter dem „Fahren auf halbe Sicht?“","antwort":"So langsam fahren, dass man innerhalb der halben Sichtweite anhalten kann – z. B. auf engen Straßen, wo einem Fahrzeuge entgegenkommen können","richtig":"Innerhalb der halben Sichtweite anhalten können","falsch":["Nur mit Abblendlicht fahren","Halb so schnell wie erlaubt fahren","Nur die rechte Fahrbahnhälfte beachten"],"quelle":"§ 20 Abs. 1 StVO"},{"nr":"19","frage":"Wie lautet die Formel für den Bremsweg?","antwort":"Faustregel: (Geschwindigkeit ÷ 10) × (Geschwindigkeit ÷ 10)\nz. B. 50 km/h: 5 × 5 = 25 m","richtig":"(km/h ÷ 10) × (km/h ÷ 10)","falsch":["(km/h ÷ 10) × 3","km/h ÷ 3,6","km/h × 2"],"quelle":"Faustregel Fahrschule"},{"nr":"20","frage":"Wie lautet die Formel für den Reaktionsweg?","antwort":"Faustregel: (Geschwindigkeit ÷ 10) × 3\nz. B. 50 km/h: 5 × 3 = 15 m","richtig":"(km/h ÷ 10) × 3","falsch":["(km/h ÷ 10) × (km/h ÷ 10)","km/h × 3","km/h ÷ 2"],"quelle":"Faustregel Fahrschule"},{"nr":"21","frage":"Welche Dokumente müssen Sie beim Lenken eines Taxis mitführen?","antwort":"Führerschein\nZulassungsschein\nTaxilenkerausweis\nDie gewerberechtlichen Unterlagen (GISA-Auszug, Abdruck von Betriebsordnung und Tarif)","richtig":"Führerschein, Zulassungsschein, Taxilenkerausweis und Gewerbeunterlagen","falsch":["Nur den Führerschein","Reisepass und Meldezettel","Kaufvertrag des Taxis"],"quelle":"§ 14 FSG, § 102 Abs. 5 KFG, § 4 BO 1994, § 4 LBO"},{"nr":"22","frage":"Dürfen Sie vor Antritt der Fahrt in Wien die Hupe überprüfen?","antwort":"Nein – in Wien gilt Hupverbot; die Hupe darf dort nicht geprüft werden","richtig":"Nein (Hupverbot)","falsch":["Ja, kurz","Ja, vor jeder Fahrt Pflicht","Nur in der Nacht"],"quelle":"§ 102 Abs. 1 KFG, § 43 Abs. 2 StVO"},{"nr":"23","frage":"Wie verhalten Sie sich bei Verlust des Führerscheines?","antwort":"Sofort bei der Behörde oder Polizei anzeigen\nDie Bestätigung über die Anzeige gilt bis zum neuen Führerschein, höchstens 8 Wochen\nEinen neuen Führerschein (Duplikat) beantragen","richtig":"Sofort anzeigen – die Bestätigung gilt höchstens 8 Wochen","falsch":["Weiterfahren und beim nächsten Amt melden","Die Bestätigung gilt 1 Woche","Ohne Führerschein darf man gar nicht mehr fahren"],"quelle":"§ 14 Abs. 3, § 15 FSG"},{"nr":"24","frage":"Beim Lenken welcher Fahrzeuge müssen Sie ein Verbandszeug mitführen?","antwort":"Bei allen Kraftfahrzeugen","richtig":"Bei allen Kraftfahrzeugen","falsch":["Nur bei Taxis und Bussen","Nur bei Lkw","Nur bei Fahrten außerhalb des Ortsgebietes"],"quelle":"§ 102 Abs. 10 KFG"},{"nr":"25","frage":"Unter welchen Voraussetzungen dürfen Sie als Lenker ein KFZ weitergeben?","antwort":"Nur mit Zustimmung des Zulassungsbesitzers\nUnd nur an jemanden mit der passenden Lenkberechtigung","richtig":"Nur mit Zustimmung des Zulassungsbesitzers an jemanden mit Lenkberechtigung","falsch":["An jeden Kollegen mit Taxischein","An jeden Fahrgast mit Führerschein","Nie"],"quelle":"§ 102 Abs. 8, § 103 KFG"},{"nr":"26","frage":"Das Abschleppen von Fahrzeugen mit einem Seil – ist unter welchen Bedingungen zulässig?","antwort":"Das abgeschleppte Fahrzeug muss lenkbar sein und mindestens eine wirksame Bremse haben\nEs muss gelenkt werden (vom Lenker mit Lenkberechtigung)\nDas Seil höchstens 8 m lang und gut sichtbar gekennzeichnet (z. B. mit einem Lappen)\nNur ein Fahrzeug auf einmal abschleppen","richtig":"Lenkung und eine Bremse wirksam, gelenkt, Seil höchstens 8 m und gut sichtbar","falsch":["Seil höchstens 15 m, Bremse egal","Nur mit Abschleppwagen erlaubt","Ohne Lenker im abgeschleppten Auto"],"quelle":"§ 105 KFG"},{"nr":"27","frage":"Wann schalten Sie die Alarmblinkanlage ein?","antwort":"Bei stillstehendem Fahrzeug zur Warnung bei Pannen\nAls Notsignal zum Schutz des Taxilenkers (Überfall)\nWenn man andere gefährdet oder vor Gefahren warnen will (z. B. Stauende)","richtig":"Bei Pannen, als Notsignal des Taxilenkers oder zur Warnung vor Gefahren","falsch":["Beim Halten in zweiter Spur","Beim Warten auf Fahrgäste","Beim Parken im Halteverbot"],"quelle":"§ 102 Abs. 2 KFG"},{"nr":"28","frage":"Wann nimmt die Polizei Zulassungsschein und Kennzeichentafel ab?","antwort":"Wenn die Verkehrssicherheit durch das Fahrzeug gefährdet wird (Gefahr im Verzug) – z. B. bei schweren technischen Mängeln","richtig":"Wenn das Fahrzeug die Verkehrssicherheit gefährdet (Gefahr im Verzug)","falsch":["Bei jedem Strafzettel","Wenn das Pickerl einen Monat abgelaufen ist","Bei Überschreitung der Parkzeit"],"quelle":"§ 57 Abs. 8, § 58 KFG"},{"nr":"29","frage":"Welches Licht verwenden Sie beim Befahren eines Tunnels?","antwort":"Immer Abblendlicht","richtig":"Abblendlicht","falsch":["Standlicht","Fernlicht","Kein Licht, der Tunnel ist beleuchtet"],"quelle":"§ 99 Abs. 1a KFG"},{"nr":"30","frage":"Dürfen Sie während der Fahrt telefonieren?","antwort":"Nur mit Freisprecheinrichtung\nDas Handy darf sonst nur als befestigtes Navigationsgerät verwendet werden","richtig":"Nur mit Freisprecheinrichtung","falsch":["Ja, kurz am Ohr","Ja, beim Stehen an der Ampel ohne Freisprecheinrichtung","Nein, auch nicht mit Freisprecheinrichtung"],"quelle":"§ 102 Abs. 3 KFG"},{"nr":"31","frage":"Dürfen Sie den Motor warmlaufen lassen?","antwort":"Nein – „Warmlaufenlassen“ ist eine vermeidbare Luftverunreinigung","richtig":"Nein","falsch":["Ja, im Winter","Ja, bis zu 10 Minuten","Ja, am Taxistandplatz"],"quelle":"§ 102 Abs. 4 KFG"},{"nr":"32","frage":"In welchen Fahrzeugen muss man Pannendreieck und Warnweste mitführen?","antwort":"In allen mehrspurigen Kraftfahrzeugen","richtig":"In allen mehrspurigen Kraftfahrzeugen","falsch":["Nur in Lkw","Nur auf Autobahnfahrten","Nur in Taxis"],"quelle":"§ 102 Abs. 10 KFG"},{"nr":"33","frage":"Wann und wo muss man Warnkleidung tragen?","antwort":"Beim Aufstellen des Pannendreiecks\nAuf Autobahnen und Autostraßen, wenn man sich außerhalb des Fahrzeugs aufhält","richtig":"Beim Aufstellen des Pannendreiecks und außerhalb des Fahrzeugs auf Autobahn/Autostraße","falsch":["Immer beim Aussteigen","Nur in der Nacht","Nur bei Unfällen mit Verletzten"],"quelle":"§ 102 Abs. 10 KFG"},{"nr":"34","frage":"Wer ist verantwortlich, dass das Taxi den gesetzlichen Vorschriften entspricht?","antwort":"Der Zulassungsbesitzer (Unternehmer)\nDer Lenker muss sich vor der Fahrt überzeugen, soweit zumutbar","richtig":"Der Zulassungsbesitzer – der Lenker prüft vor der Fahrt","falsch":["Nur der Lenker","Die Werkstatt","Die Polizei"],"quelle":"§ 103 Abs. 1, § 102 Abs. 1 KFG"},{"nr":"35","frage":"Muss der Zulassungsbesitzer gegenüber der Behörde Auskunft über den Fahrzeuglenker erteilen?","antwort":"Ja – er muss Namen und Anschrift des Lenkers bekannt geben (Lenkerauskunft) oder die Person nennen, die Auskunft geben kann","richtig":"Ja (Lenkerauskunft)","falsch":["Nein, das ist Datenschutz","Nur bei Unfällen mit Verletzten","Nur mit Zustimmung des Lenkers"],"quelle":"§ 103 Abs. 2 KFG"},{"nr":"36","frage":"Darf ich bei winterlichen Fahrbahnverhältnissen Sommer und Winterreifen mischen?","antwort":"Nein – bei winterlichen Verhältnissen müssen an allen Rädern Winterreifen sein","richtig":"Nein, an allen Rädern Winterreifen","falsch":["Ja, Winterreifen nur hinten","Ja, Winterreifen nur auf der Antriebsachse","Ja, wenn Schneeketten mitgeführt werden"],"quelle":"§ 102 Abs. 8a KFG"},{"nr":"37","frage":"Was sind die Voraussetzungen für das Lenken eines Kraftfahrzeugs?","antwort":"Eine Lenkberechtigung für die Fahrzeugklasse (Führerschein mitführen)\nVerkehrszuverlässig und gesundheitlich geeignet\nNicht durch Alkohol, Drogen oder Medikamente beeinträchtigt\nDas Fahrzeug entspricht den Vorschriften","richtig":"Passende Lenkberechtigung, gesundheitliche Eignung und nicht beeinträchtigt","falsch":["Nur ein Führerschein, egal welche Klasse","Ein eigenes Fahrzeug","Ein Mindestalter von 21 Jahren"],"quelle":"§ 1, § 3, § 14 FSG; § 102 KFG"}]},{"nr":"VI","name":"Arbeits- und Sozialrecht","fragen":[{"nr":"1","frage":"Welche Pflichten haben Sie als Taxilenker:in vor Inbetriebnahme des Taxis in Bezug auf die Fahrtüchtigkeit des Fahrzeugs?","antwort":"Prüfen, ob das Taxi betriebsfähig ist – vor allem Bremsen, Lichtanlage, Motoröl und Kühlwasser","richtig":"Bremsen, Licht, Ölstand und Kühlwasser prüfen","falsch":["Nur nachtanken","Nur den Taxameter einschalten","Keine – das macht die Werkstatt"],"quelle":"KV Taxi 2026, IV.1"},{"nr":"2","frage":"Welche Pflichten haben Sie als Taxilenker:in in Bezug auf den Zustand des Taxis und ihres Auftretens?","antwort":"Das Taxi sorgfältig behandeln und sauber halten, Vor- und Abschlussarbeiten erledigen\nGegenüber Fahrgästen höflich, hilfsbereit und gepflegt auftreten","richtig":"Taxi sorgfältig behandeln und sauber halten, höflich und gepflegt auftreten","falsch":["Nur einmal pro Woche reinigen","Das Auftreten ist Privatsache","Die Reinigung macht nur der Unternehmer"],"quelle":"KV Taxi 2026, IV.4 und 10; § 11 LBO"},{"nr":"3","frage":"Welche Pflichten haben Sie als Taxilenker:in vor Inbetriebnahme des Taxis in Bezug auf die erforderlichen Unterlagen und Papiere und Taxameter?","antwort":"Den Taxameter auf Funktion prüfen\nAlle vorgeschriebenen Prüfplaketten (z. B. Pickerl) kontrollieren\nAlle mitzuführenden Unterlagen kontrollieren (z. B. europäischer Unfallbericht)","richtig":"Taxameter, Prüfplaketten und mitzuführende Unterlagen kontrollieren","falsch":["Nur den Führerschein einstecken","Nur die Tankfüllung prüfen","Nichts – das macht der Unternehmer"],"quelle":"KV Taxi 2026, IV.1"},{"nr":"4","frage":"Welche Verpflichtung haben Sie als Taxilenker:in beim Tanken?","antwort":"Regelmäßig den Reifendruck und die Profiltiefe kontrollieren","richtig":"Reifendruck und Profiltiefe kontrollieren","falsch":["Nur die Scheiben waschen","Den Ölwechsel machen","Die Tankrechnung privat zahlen"],"quelle":"KV Taxi 2026, IV.1"},{"nr":"5","frage":"Was haben Sie zu tun, wenn Mängel am Fahrzeug festgestellt werden, die nicht sofort behoben werden können?","antwort":"Sofort dem Arbeitgeber melden\nDas Taxi darf man dann nur in Betrieb nehmen, wenn der Arbeitgeber es ausdrücklich schriftlich erlaubt","richtig":"Sofort melden – weiterfahren nur mit schriftlicher Erlaubnis des Arbeitgebers","falsch":["Bis Dienstende weiterfahren und dann melden","Selbst in eine Werkstatt fahren und reparieren lassen","Nichts tun, wenn das Taxi noch fährt"],"quelle":"KV Taxi 2026, IV.1 und 5"},{"nr":"6","frage":"Dürfen Sie das Fahrzeug für private oder andere Zwecke verwenden?","antwort":"Nein – während der Dienstzeit nur für den Betriebszweck\nAndere Fahrten nur mit vorheriger schriftlicher Genehmigung des Arbeitgebers","richtig":"Nur mit vorheriger schriftlicher Genehmigung","falsch":["Ja, nach Dienstschluss immer","Ja, wenn man selbst tankt","Ja, für kurze private Wege"],"quelle":"KV Taxi 2026, IV.3"},{"nr":"7","frage":"Müssen Sie den/die Arbeitgeber:in im Falle eines Verkehrsunfalles informieren?","antwort":"Ja – die Unfallmeldung vollständig ausfüllen und dem Arbeitgeber unverzüglich, spätestens nach 48 Stunden übergeben (auch wenn die Polizei den Unfall aufgenommen hat)","richtig":"Ja, spätestens nach 48 Stunden mit ausgefüllter Unfallmeldung","falsch":["Nur bei Verletzten","Nur bei Schäden über 1.000 €","Nein, das macht die Polizei"],"quelle":"KV Taxi 2026, IV.5; § 102 Abs. 7 KFG"},{"nr":"8","frage":"Müssen Sie an einem von Ihrem/Ihrer Arbeitgeber:in bezahlten weiterbildenden berufsfördernden Kurs in der Arbeitszeit teilnehmen?","antwort":"Ja – und die Kurszeit zählt als Arbeitszeit","richtig":"Ja, die Kurszeit zählt als Arbeitszeit","falsch":["Nein, das ist freiwillig","Ja, aber in der Freizeit","Nur wenn man selbst zahlt"],"quelle":"KV Taxi 2026, IV.7"},{"nr":"9","frage":"Wo lassen Sie sich beraten, wenn sie arbeitsrechtliche Probleme mit Ihrem/Ihrer Arbeitgeber:in haben?","antwort":"Bei der Arbeiterkammer (AK Wien)\nBei der Gewerkschaft vida\n(oder beim Betriebsrat, wenn es einen gibt)","richtig":"Bei der Arbeiterkammer oder der Gewerkschaft vida","falsch":["Bei der Wirtschaftskammer","Beim Finanzamt","Bei der Polizei"],"quelle":"AKG, ArbVG"},{"nr":"10","frage":"Müssen Sie sich beim Taxifahren an gesetzliche Bestimmungen (StVO, KFG, Bundes- oder Landesbetriebsordnung) halten?","antwort":"Ja – StVO, KFG, Bundes- und Landesbetriebsordnung sind korrekt einzuhalten","richtig":"Ja","falsch":["Nein, im Taxi gelten Sonderrechte","Nur die StVO","Nur wenn ein Fahrgast im Taxi sitzt"],"quelle":"KV Taxi 2026, IV.2"},{"nr":"11","frage":"Dürfen sie an den Assistenzsystemen, wie beispielsweise Taxameter , Veränderungen vornehmen?","antwort":"Nein – es ist verboten, Vorrichtungen einzubauen oder zu betätigen, die Assistenzsysteme außer Kraft setzen oder ihre Wirkung aufheben","richtig":"Nein","falsch":["Ja, wenn sie stören","Ja, mit Zustimmung des Fahrgastes","Ja, in der Nacht"],"quelle":"KV Taxi 2026, IV.12"},{"nr":"12","frage":"Wie entsteht ein Arbeitsverhältnis?","antwort":"Durch einen Arbeitsvertrag – eine Vereinbarung zwischen Arbeitgeber und Arbeitnehmer (mündlich, schriftlich oder durch schlüssiges Verhalten)\nDer Arbeitgeber muss einen Dienstzettel ausstellen","richtig":"Durch eine Vereinbarung (Arbeitsvertrag) zwischen Arbeitgeber und Arbeitnehmer","falsch":["Erst durch die Anmeldung beim AMS","Nur durch einen notariellen Vertrag","Durch die Taxilenkerprüfung"],"quelle":"§ 1151 ABGB, § 2 AVRAG"},{"nr":"13","frage":"Welche Hauptpflichten hat Ihr/Ihre Arbeitgeber:in?","antwort":"Den Lohn zahlen\nFürsorgepflicht (Gesundheit und Sicherheit schützen)\nBei der Sozialversicherung anmelden\nUrlaub gewähren, Dienstzettel ausstellen","richtig":"Lohn zahlen, Fürsorge, Anmeldung zur Sozialversicherung, Urlaub gewähren","falsch":["Ein Auto für private Fahrten stellen","Die Wohnung bezahlen","Trinkgelder garantieren"],"quelle":"§ 1154, § 1157 ABGB; ASVG; UrlG"},{"nr":"14","frage":"Welche Hauptpflichten haben Sie Ihrem/Ihrer Arbeitgeber:in gegenüber?","antwort":"Die Arbeit persönlich und sorgfältig leisten\nWeisungen befolgen\nTreuepflicht (Interessen des Arbeitgebers wahren, Verschwiegenheit)","richtig":"Arbeitspflicht, Weisungen befolgen, Sorgfalt und Treue","falsch":["Selbst Fahrgäste suchen und abrechnen","Das Taxi auf eigene Kosten warten","Die Sozialversicherung selbst bezahlen"],"quelle":"§ 1153 ABGB"},{"nr":"15","frage":"Was muss Ihr Arbeitgeber/ihre Arbeitgeberin zu Beginn des Arbeitsverhältnisses tun?","antwort":"Den Arbeitnehmer vor Arbeitsbeginn bei der Österreichischen Gesundheitskasse (ÖGK) anmelden\nEinen Dienstzettel ausstellen","richtig":"Vor Arbeitsbeginn bei der ÖGK anmelden und einen Dienstzettel ausstellen","falsch":["Den Lohn im Voraus zahlen","Den Führerschein einbehalten","Nichts, das hat ein Monat Zeit"],"quelle":"§ 33 ASVG, § 2 AVRAG"},{"nr":"16","frage":"Haben Sie Anspruch auf einen Dienstzettel?","antwort":"Ja – eine schriftliche Aufzeichnung der wesentlichen Rechte und Pflichten (z. B. Beginn, Arbeitszeit, Lohn, Arbeitsort, Urlaub, Kündigungsfrist)\nLaut KV auch mit Hinweis auf Arbeitszeitgesetz und Arbeitsruhegesetz","richtig":"Ja","falsch":["Nur bei Teilzeit","Nur nach der Probezeit","Nein, mündlich reicht"],"quelle":"§ 2 AVRAG, KV Taxi 2026, XIV"},{"nr":"17","frage":"Was bedeutet es, sozialversichert zu sein und warum ist eine korrekte Anmeldung bei der Sozialversicherung für Sie so wichtig?","antwort":"Man ist kranken-, unfall-, pensions- und arbeitslosenversichert\nNur bei richtiger Anmeldung (mit dem tatsächlichen Lohn und der tatsächlichen Arbeitszeit) bekommt man im Ernstfall volles Krankengeld, Arbeitslosengeld und später die richtige Pension","richtig":"Kranken-, Unfall-, Pensions- und Arbeitslosenversicherung – richtige Anmeldung sichert volle Leistungen","falsch":["Nur eine private Unfallversicherung","Nur für Unternehmer wichtig","Nur für die Steuer wichtig"],"quelle":"ASVG"},{"nr":"18","frage":"Wie hoch ist der Überstundenzuschlag im Taxigewerbe und wo ist er geregelt?","antwort":"50 % – geregelt im Kollektivvertrag","richtig":"50 %, im Kollektivvertrag","falsch":["25 %, im ABGB","100 %, im Arbeitszeitgesetz","10 %, in der Betriebsordnung"],"quelle":"KV Taxi 2026, VI.4"},{"nr":"19","frage":"Wann und in welcher Höhe muss das Urlaubsgeld ausbezahlt werden? Wo ist dies geregelt?","antwort":"Urlaubszuschuss: 1 Brutto-KV-Mindestmonatslohn, fällig am 1. Juni (bei weniger als einem Jahr anteilig)\nGeregelt im Kollektivvertrag","richtig":"1 Monatslohn (KV), fällig 1. Juni – im Kollektivvertrag","falsch":["Ein halber Monatslohn im Dezember","Freiwillig, wann der Chef will","Bei Urlaubsantritt, im Urlaubsgesetz"],"quelle":"KV Taxi 2026, XV.A"},{"nr":"20","frage":"Wann und in welcher Höhe muss das Weihnachtsgeld bezahlt werden? Wo ist das geregelt?","antwort":"Weihnachtsremuneration: 1 Brutto-KV-Mindestmonatslohn, fällig am 1. Dezember (bei weniger als einem Jahr anteilig)\nGeregelt im Kollektivvertrag","richtig":"1 Monatslohn (KV), fällig 1. Dezember – im Kollektivvertrag","falsch":["Am 24. Dezember, freiwillig","Ein halber Monatslohn im Juni","Nur nach 5 Dienstjahren"],"quelle":"KV Taxi 2026, XV.B"},{"nr":"21","frage":"Wo schauen Sie nach, wenn Sie wissen wollen, was rechtlich für sie gilt?","antwort":"In den Gesetzen (z. B. ABGB, Arbeitszeitgesetz, Arbeitsruhegesetz, Urlaubsgesetz)\nIm Kollektivvertrag für das Taxigewerbe\nIm Arbeitsvertrag bzw. Dienstzettel (und in Betriebsvereinbarungen)\nBeratung: Arbeiterkammer, Gewerkschaft","richtig":"Gesetze, Kollektivvertrag und Arbeitsvertrag/Dienstzettel","falsch":["Nur in der StVO","In der Taxameter-Anleitung","Nur beim Arbeitgeber fragen"],"quelle":"ArbVG"},{"nr":"22","frage":"Wer verhandelt den Kollektivvertrag für das Taxigewerbe und wer von den Verhandler:innen vertritt Sie als Taxilenker:in?","antwort":"Die Wirtschaftskammer (Fachverband für die Beförderungsgewerbe mit Pkw) und die Gewerkschaft vida (ÖGB)\nDie Gewerkschaft vida vertritt die Taxilenker","richtig":"WKÖ-Fachverband und Gewerkschaft vida – vida vertritt die Lenker","falsch":["Arbeiterkammer und Stadt Wien – die Stadt vertritt die Lenker","Nur die Wirtschaftskammer","Die Taxifunkzentralen"],"quelle":"KV Taxi 2026, I"},{"nr":"23","frage":"Sind Bestimmungen im Arbeitsvertrag / Dienstzettel, die Sie schlechter stellen als der Kollektivvertrag zulässig?","antwort":"Nein – Vereinbarungen, die schlechter sind als der Kollektivvertrag, sind unwirksam; es gilt der Kollektivvertrag","richtig":"Nein","falsch":["Ja, wenn man unterschreibt","Ja, in der Probezeit","Ja, bei Teilzeit"],"quelle":"§ 3 ArbVG"},{"nr":"24","frage":"Wie viele Stunden beträgt Ihre wöchentliche bzw. tägliche Arbeitszeit?","antwort":"Laut Kollektivvertrag für Lenker (mit Arbeitsbereitschaft): täglich 12 Stunden, wöchentlich 55 Stunden Normalarbeitszeit\n(Lenker bei Krankentransporten, Schülertransporten u. Ä.: 45 Stunden pro Woche)\nMit Überstunden höchstens 13 Stunden täglich und 60 Stunden pro Woche","richtig":"12 Stunden täglich, 55 Stunden wöchentlich","falsch":["8 Stunden täglich, 40 Stunden wöchentlich","10 Stunden täglich, 50 Stunden wöchentlich","14 Stunden täglich, 70 Stunden wöchentlich"],"quelle":"KV Taxi 2026, V.1 und VI.3"},{"nr":"25","frage":"Müssen Sie auch an Sonn- und Feiertagen arbeiten?","antwort":"Ja – mindestens zweimal pro Monat, im Rahmen des Arbeitsruhegesetzes","richtig":"Ja, mindestens zweimal pro Monat","falsch":["Nein, nie","Nur freiwillig","Jeden Sonntag"],"quelle":"KV Taxi 2026, V.1a"},{"nr":"26","frage":"Lenkzeit: Wie lang darf die tägliche bzw. wöchentliche Lenkzeit betragen? Kann die tägliche Lenkzeit darüber hinaus erhöht werden? Wie viele Stunden Lenkzeit darf maximal in 2 Wochen geleistet werden?","antwort":"Höchstens 9 Stunden zwischen zwei Ruhezeiten und 56 Stunden pro Woche\nZweimal pro Woche darf sie auf 10 Stunden verlängert werden\nIn zwei Wochen zusammen höchstens 90 Stunden","richtig":"9 h täglich (zweimal 10 h), 56 h pro Woche, 90 h in zwei Wochen","falsch":["8 h täglich, 40 h pro Woche, 80 h in zwei Wochen","12 h täglich, 60 h pro Woche, 120 h in zwei Wochen","10 h täglich, 50 h pro Woche, 100 h in zwei Wochen"],"quelle":"KV Taxi 2026, V.3"},{"nr":"27","frage":"Wann müssen Sie eine Lenkpause einlegen und wie lange hat diese mindestens zu dauern?","antwort":"Nach höchstens 4 Stunden Lenkzeit – mindestens 30 Minuten","richtig":"Nach höchstens 4 Stunden, mindestens 30 Minuten","falsch":["Nach 6 Stunden, 15 Minuten","Nach 4,5 Stunden, 45 Minuten","Nach 8 Stunden, 1 Stunde"],"quelle":"KV Taxi 2026, V.4"},{"nr":"28","frage":"Wann und wie lange haben Sie Anspruch auf eine Ruhepause?","antwort":"Bei 6 bis 9 Stunden Arbeitszeit: mindestens 30 Minuten\nBei mehr als 9 Stunden: mindestens 45 Minuten\nSpätestens nach 6 Stunden; teilbar in Teile von mindestens 15 Minuten\nNur eine Pause, wenn man sich vom Taxi entfernen kann","richtig":"30 Minuten ab 6 Stunden, 45 Minuten über 9 Stunden – spätestens nach 6 Stunden","falsch":["15 Minuten ab 8 Stunden","1 Stunde ab 4 Stunden","Keine, wenn man Lenkpausen macht"],"quelle":"KV Taxi 2026, V.5"},{"nr":"29","frage":"Wird die Ruhepause bezahlt?","antwort":"Nein – die Ruhepause ist unbezahlt","richtig":"Nein","falsch":["Ja, voll","Ja, zur Hälfte","Nur in der Nacht"],"quelle":"KV Taxi 2026, V.5"},{"nr":"30","frage":"Wie lange ist die tägliche Ruhezeit grundsätzlich nach Beendigung des Arbeitstages? Wo schauen Sie nach, wenn sie wissen wollen, ob diese verkürzt werden darf?","antwort":"Grundsätzlich 11 Stunden – auf höchstens 10 Stunden verkürzbar (innerhalb von 10 Tagen auszugleichen)\nNachschauen: im Kollektivvertrag bzw. im Arbeitszeitgesetz","richtig":"11 Stunden – Verkürzung steht im Kollektivvertrag (bzw. AZG)","falsch":["8 Stunden – in der StVO","12 Stunden – in der Betriebsordnung","9 Stunden – im Urlaubsgesetz"],"quelle":"KV Taxi 2026, V.6; § 12 AZG"},{"nr":"31","frage":"Wie viele Stunden muss die wöchentliche Ruhezeit grundsätzlich betragen und wo schauen Sie nach, ob und welche Ausnahmen bestehen?","antwort":"36 Stunden\nAusnahmen: im Arbeitsruhegesetz und im Kollektivvertrag (Durchrechnung über 26 Wochen möglich)","richtig":"36 Stunden – Ausnahmen im Arbeitsruhegesetz und Kollektivvertrag","falsch":["24 Stunden – in der StVO","48 Stunden – im ABGB","45 Stunden – im KFG"],"quelle":"KV Taxi 2026, V.7; ARG"},{"nr":"32","frage":"Wann muss mir mein/meine Arbeitgeber:in einen Schichtwechsel bekanntgeben?","antwort":"Spätestens 24 Stunden vor Dienstbeginn","richtig":"24 Stunden vor Dienstbeginn","falsch":["1 Stunde vorher","1 Woche vorher","48 Stunden vorher"],"quelle":"KV Taxi 2026, V.9"},{"nr":"33","frage":"Wie viele Tage Urlaub stehen mir pro ganzem Arbeitsjahr zu?","antwort":"5 Wochen: 25 Arbeitstage (bzw. 30 Werktage)\nNach 25 Dienstjahren 6 Wochen","richtig":"25 Arbeitstage (30 Werktage)","falsch":["20 Arbeitstage","30 Arbeitstage","15 Arbeitstage"],"quelle":"§ 2 UrlG"},{"nr":"34","frage":"Wohin wenden Sie sich, wenn Schutzbestimmungen, wie die Einhaltung der Ruhe- und Lenkpausen nicht eingehalten werden?","antwort":"An das Arbeitsinspektorat\nBeratung bei Arbeiterkammer und Gewerkschaft vida","richtig":"An das Arbeitsinspektorat (Beratung: AK, vida)","falsch":["An die Taxiinnung","An die Polizei","An das Finanzamt"],"quelle":"ArbIG"},{"nr":"35","frage":"Wann und wie
